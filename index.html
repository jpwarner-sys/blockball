<title>BLOCKBALL</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #14110e;
    color: #e8dcc8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", ui-sans-serif, Helvetica, Arial, sans-serif;
    height: 100dvh;
    width: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: pan-y;   /* CHIEF FIX BB-V4.5 — was none; see .card below. pan-y, not manipulation: it lets a panel scroll but still refuses pinch-zoom on iOS, which ignores user-scalable=no. */
  }
  #shell {
    /* CHIEF FIX BB-V4.11 — `inset: 0` pins top AND bottom to the LAYOUT viewport,
       which on iOS Safari is the tall one, as though the address bar were hidden.
       The bottom ~90px of every panel therefore sat underneath the browser toolbar
       and the last row of the menu was clipped off the screen. Pinning only the top
       and taking the height from 100dvh gives the panels the viewport that is
       actually visible, and the card's max-height then means what it says. */
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: auto;
    overflow: hidden;
    background: #14110e;
    height: 100dvh;
    width: 100%;
  }
  #game {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #14110e;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
    touch-action: none;
  }
  #hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }
  #hud button, #hud input, #hud textarea, #hud .hit {
    pointer-events: auto;
  }
  #rotate {
    display: none;
    position: absolute;
    inset: 0;
    background: #14110e;
    z-index: 80;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 18px;
    text-align: center;
    padding: 28px;
  }
  #rotate.show { display: flex; }
  #rotate .phone {
    width: 54px; height: 86px; border: 4px solid #e8dcc8; border-radius: 10px;
    transform: rotate(-90deg);
    animation: spinHint 1.6s ease-in-out infinite;
  }
  @keyframes spinHint {
    0% { transform: rotate(-90deg); }
    40% { transform: rotate(0deg); }
    100% { transform: rotate(0deg); }
  }
  #install {
    display: none;
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 60;
    background: #1e1a16ee;
    color: #f0e6d4;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    font-size: 13px;
    align-items: center;
    gap: 10px;
    border-top: 2px solid #3a3328;
  }
  #install.show { display: flex; }
  #install svg { flex: 0 0 auto; }
  #install .grow { flex: 1; }
  #install button {
    background: #d06018; color: #1a120c; border: 0; font-weight: 700;
    padding: 6px 10px; border-radius: 6px; pointer-events: auto;
  }
  .panel {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: #14110ecc; z-index: 40; pointer-events: auto;
    box-sizing: border-box;
    padding: calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
  }
  .panel.show { display: flex; }
  .panel.splash { background: #14110e; }
  .card.splashCard {
    background: transparent; border: 0; box-shadow: none; padding: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%; max-height: 100%; overflow: hidden; gap: 0;
  }
  /* CHIEF FIX BB-V4.7 — `.card h1 { font-size: 28px }` outranked `.splashTitle`
     (0,2,0 beats 0,1,0), so every size set here was silently thrown away and the
     splash rendered at menu-heading size. Matched on the card, and sized off the
     SHORTER viewport axis so a wide window cannot push the words off the screen. */
  .card.splashCard h1.splashTitle {
    margin: 0; font-size: clamp(34px, min(10vw, 9vh), 96px); line-height: 0.95; letter-spacing: 0.1em;
    font-weight: 800; color: #f4ead6; text-shadow: 0 4px 0 #1a120c, 0 0 26px rgba(240,140,40,0.30);
  }
  .splashArt {
    display: block; width: auto; height: auto;
    max-width: min(97vw, 1180px); max-height: 62vh;
    margin: 14px 0; border: 4px solid #4a4032; background: #14110e;
  }
  .splashGo {
    margin-top: 20px; font-size: clamp(13px, 2.4vw, 20px); letter-spacing: 3px; font-weight: 800; color: #c4b49a;
    animation: goPulse 1.5s ease-in-out infinite;
  }
  @keyframes goPulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  @media (max-height: 560px) {
    .card.splashCard h1.splashTitle { font-size: clamp(22px, 7vh, 54px); letter-spacing: 0.08em; text-shadow: 0 3px 0 #1a120c; }
    .splashArt { max-height: 70vh; max-width: min(96vw, 1000px); margin: 5px 0; border-width: 3px; }
    .splashGo { margin-top: 10px; font-size: 13px; letter-spacing: 2px; }
  }
  @media (min-height: 900px) {
    .splashArt { max-height: 66vh; max-width: min(97vw, 1260px); }
  }
  /* CHIEF FIX BB-V4.9 — portrait is now a first-class title screen, not a rejection.
     Width is the scarce axis here, so the words are sized off it and the art takes
     the width it can get; there is height to spare either side. */
  @media (max-aspect-ratio: 4/5) {
    .card.splashCard h1.splashTitle { font-size: clamp(30px, 13vw, 92px); letter-spacing: 0.08em; }
    .splashArt { max-width: 96vw; max-height: 46vh; margin: 22px 0; }
    .splashGo { margin-top: 26px; font-size: clamp(13px, 3.6vw, 20px); }
  }
  .card {
    background: #221c16; border: 3px solid #4a4032; max-width: 920px; width: min(920px, 96%);
    max-height: 100%; overflow-y: auto; overflow-x: hidden; padding: 12px 14px 14px; box-shadow: 0 0 0 4px #14110e;
    box-sizing: border-box;
    /* CHIEF FIX BB-V4.5 — a finger must be able to scroll a card that overflows */
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .card.splashCard { touch-action: manipulation; }
  .card::-webkit-scrollbar { width: 10px; }
  .card::-webkit-scrollbar-thumb { background: #6a5a44; border-radius: 5px; }
  .card::-webkit-scrollbar-track { background: #14110e; }
  .card h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: 1px; }
  /* CHIEF FIX BB-V5.5 — the menu was paying for space it did not use: a stale
     tagline, a 12px heading gap above every section and 16px of card padding.
     Tightened so the run controls sit directly under the title. */
  .card h1.title { line-height: 0.92; letter-spacing: 3px; font-size: clamp(24px, 4.6vw, 36px); margin: 0 0 6px; }
  .card h1.title { text-align: center; }
  .card h1.tTop { margin: 0 0 2px; }
  .card h1.tBot { margin: 0 0 8px; }
  #titleArt { display: block; width: 100%; max-width: 620px; margin: 0 auto; border: 3px solid #4a4032; background: #14110e; }
  .card h2 { margin: 9px 0 5px; font-size: 15px; color: #c4b49a; font-weight: 700; letter-spacing: 1px; }
  .card h2:first-of-type { margin-top: 2px; }
  .card h2.fold { cursor: pointer; user-select: none; -webkit-user-select: none; display: inline-block;
    padding: 2px 10px 2px 0; }
  .card h2.fold:active { color: #f0a050; }
  .foldArrow { color: #8a7a60; font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  button.bb, .bb {
    background: #3a3026; color: #f0e6d4; border: 2px solid #6a5a44; padding: 8px 12px;
    font-weight: 700; font-size: 14px; border-radius: 4px; cursor: pointer;
  }
  button.bb.pri { background: #d06018; color: #1a120c; border-color: #f0a050; }
  button.bb.good { background: #2f5a38; border-color: #6aad6a; }
  button.bb.warn { background: #5a2a22; border-color: #c06048; }
  button.bb.on { outline: 2px solid #f0a050; }
  input.bb, textarea.bb {
    background: #14110e; color: #f0e6d4; border: 2px solid #6a5a44; padding: 8px;
    font: 14px ui-monospace, Menlo, monospace; border-radius: 4px;
  }
  .muted { color: #9a8c78; font-size: 13px; }
  .swatch { width: 28px; height: 28px; border: 2px solid #111; display: inline-block; }
  #toasts {
    position: absolute; right: calc(12px + env(safe-area-inset-right));
    top: calc(48px + env(safe-area-inset-top));
    display: flex; flex-direction: column; gap: 6px; pointer-events: none; z-index: 30;
  }
  .toast {
    background: #2a2218ee; border: 2px solid #d06018; padding: 6px 10px; font-weight: 800;
    font-size: 14px; color: #ffe8c0;
  }
  #topbar, #botbar {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
    pointer-events: none;
  }
  #topbar { pointer-events: none; }
  #topbar .row:last-child { pointer-events: auto; }
  #botbar .row { min-height: 0; }
  #botbar { position: absolute; left: 0; right: 0; bottom: 0;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    pointer-events: none;
  }
  .chip {
    background: #1a1612cc; border: 2px solid #4a4032; padding: 4px 8px; font-weight: 800;
    font-size: 13px; pointer-events: auto;
  }
  #copybox { width: 100%; min-height: 72px; }
</style>
</head>
<body>
<div id="shell">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hud">
    <div id="topbar">
      <div class="row">
        <div class="chip" id="hpChip">HP 5/5</div>
        <div class="chip" id="frChip">FRAG 0</div>
        <div class="chip" id="flChip">FLOOR 1</div>
        <div class="chip" id="scChip">SCORE 0</div>
      </div>
      <div class="row">
        <button class="bb" id="btnBlock">BLOCK 3</button>
        <button class="bb" id="btnPause">PAUSE</button>
      </div>
    </div>
    <!-- CHIEF FIX BB-V6.7 — the bottom strip sat under both thumbs. BALL and SEED
         were read-only labels that belong on the pause card, not across the play
         field; BLOCK and UPGRADE are real controls and have moved up beside PAUSE,
         where nothing is holding the screen. The bottom of the screen now belongs
         to the two rings and nothing else. -->
    <div id="botbar">
      <div class="row"></div>
      <div class="row"></div>
    </div>
    <div id="toasts"></div>
  </div>
  <div id="install">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
      <rect x="4" y="8" width="14" height="12" rx="2" fill="none" stroke="#f0e6d4" stroke-width="2"/>
      <path d="M11 2 v10" stroke="#f0e6d4" stroke-width="2" fill="none"/>
      <path d="M7 6 l4 -4 l4 4" stroke="#f0e6d4" stroke-width="2" fill="none"/>
    </svg>
    <div class="grow"><b>Add to Home Screen</b> for the full app — tap Share, then Add to Home Screen.</div>
    <button id="btnInstallX" type="button">OK</button>
  </div>
  <div id="rotate"><div class="phone"></div><div style="font-size:22px;font-weight:800">Turn sideways to play</div><div class="muted">The dungeon is wider than it is tall. Rotate the device and the run picks up where it is.</div></div>
  <div class="panel splash" id="splashPanel"><div class="card splashCard" id="splashCard"></div></div>
  <div class="panel" id="menuPanel"><div class="card" id="menuCard"></div></div>
  <div class="panel" id="pausePanel"><div class="card" id="pauseCard"></div></div>
  <div class="panel" id="shopPanel"><div class="card" id="shopCard"></div></div>
  <div class="panel" id="passPanel"><div class="card" id="passCard"></div></div>
  <div class="panel" id="floorPanel"><div class="card" id="floorCard"></div></div>
  <div class="panel" id="builderPanel"><div class="card" id="builderCard"></div></div>
  <div class="panel" id="feelPanel"><div class="card" id="feelCard"></div></div>
</div>

  function curveCost(n) { return Math.pow(2, n); }

  var RARITY = {

  var player, ball, room;

  /* CHIEF BB-V5.1 — twin sticks. The left ring walks the hero, the right ring is the

     on each works at once; a drag that starts anywhere else on the field still aims,

  var STK = {

  function stickGeom() {
    var cw = canvas.width, ch = canvas.height;

    return {
      rad: rad,
      L: { cx: inset, cy: ch - inset },
      R: { cx: cw - inset, cy: ch - inset }
    };
  }

  function canvasFromEvent(ev) {
    var r = canvas.getBoundingClientRect();
    return {
      x: (ev.clientX - r.left) * (canvas.width / r.width),
      y: (ev.clientY - r.top) * (canvas.height / r.height)
    };

  /* ---------- room pieces (handmade) ---------- */
  function blankGrid(v) {
    var g = [];
    for (var y = 0; y < ROWS; y++) {
      g[y] = [];
      for (var x = 0; x < COLS; x++) g[y][x] = v || 0;
    }

  }
  function stampBorder(g) {
    for (var x = 0; x < COLS; x++) { g[0][x] = 1; g[ROWS - 1][x] = 1; }
    for (var y = 0; y < ROWS; y++) { g[y][0] = 1; g[y][COLS - 1] = 1; }
  }
  function carveDoor(g, side) {
    if (side === "e") { g[8][COLS - 1] = 0; g[9][COLS - 1] = 0; }
    if (side === "w") { g[8][0] = 0; g[9][0] = 0; }
    if (side === "n") { g[0][15] = 0; g[0][16] = 0; }
    if (side === "s") { g[ROWS - 1][15] = 0; g[ROWS - 1][16] = 0; }
  }
  function rectWall(g, x, y, w, h) {
    for (var j = y; j < y + h; j++) for (var i = x; i < x + w; i++) if (g[j] && g[j][i] !== undefined) g[j][i] = 1;
  }

  var PIECES = {
    arena: function (g) { stampBorder(g); },
    pillars: function (g) {
      stampBorder(g);

      rectWall(g, 8, 11, 2, 2); rectWall(g, 22, 11, 2, 2);

    hallH: function (g) {
      for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) g[y][x] = (y < 6 || y > 11) ? 1 : 0;
      stampBorder(g);
      for (var x2 = 1; x2 < COLS - 1; x2++) { g[6][x2] = 1; g[11][x2] = 1; }
      for (var x3 = 1; x3 < COLS - 1; x3++) { g[7][x3] = 0; g[8][x3] = 0; g[9][x3] = 0; g[10][x3] = 0; }
    },
    hallV: function (g) {

      stampBorder(g);
      for (var y2 = 1; y2 < ROWS - 1; y2++) { g[y2][12] = 1; g[y2][19] = 1; g[y2][13] = 0; g[y2][14] = 0; g[y2][15] = 0; g[y2][16] = 0; g[y2][17] = 0; g[y2][18] = 0; }
    },
    choke: function (g) {
      stampBorder(g);

      g[8][14] = 0; g[9][14] = 0; g[8][15] = 0; g[9][15] = 0; g[8][16] = 0; g[9][16] = 0; g[8][17] = 0; g[9][17] = 0;
    },

  var BIOME = [
    { id: "crypt", name: "CRYPT", walls: ["#3a342c", "#2a2620"], floor: ["#1c1814", "#161310"], roster: ["slime", "bat", "skel", "archer"] },
    { id: "forge", name: "FORGE", walls: ["#4a3020", "#3a2010"], floor: ["#221410", "#1a100c"], roster: ["imp", "cinder", "grunt", "spit"] },

    { id: "thorn", name: "THORN", walls: ["#243424", "#1a2818"], floor: ["#101810", "#0c140c"], roster: ["briar", "spitter", "golem", "witchling"] }
  ];
  function biomeOf(fl) {

  function enemyDef(type) {

      cinder: { hp: 10, r: 19, spd: 58, kind: "orbit", col: "#f08030", name: "CINDER" },

  /* CHIEF BB-V6.6 — a 48px creature moving at 41px/s covers less than one of its own
     bodies a second and reads as stationary. Pursuing kinds get a floor under their
     speed; ranged and orbiting kinds are meant to hold position and keep theirs. */
  function walkFloor(kind, spd) {
    if (kind === "chase" || kind === "swoop" || kind === "charge") return Math.max(spd, 78);
    if (kind === "orbit") return Math.max(spd, 58);
    return spd;
  }

  function spawnEnemy(type, x, y, fl, isBoss) {
    var d = enemyDef(type);
    var hp = scaleStat(d.hp, fl);
    return {
      type: type, name: d.name, x: x, y: y, r: d.r, hp: hp, maxHp: hp,
      spd: walkFloor(d.kind, d.spd), kind: d.kind, col: d.col, boss: d.boss || null,
      cd: rnd() * 1.2, stun: 0, burn: 0, alive: true, vx: 0, vy: 0,
      phase: 0, tell: 0, gap: 0, ringR: 0, ringOn: false, deadT: 0,
      facing: 1
    };
  }

  function buildFloor(fl) {
    seedRng("F" + fl);
    var bio = biomeOf(fl);
    var isBossFloor = fl % 5 === 0;
    var nRooms = isBossFloor ? irnd(3, 4) : irnd(3, 5);
    var list = [];
    var roomPool = ["arena", "pillars", "aisle", "corners", "diamond", "teeth", "choke"];
    var hallPool = ["hallH", "hallV"];
    for (var i = 0; i < nRooms; i++) {
      var last = i === nRooms - 1;
      var kind, piece;
      if (last && isBossFloor) { kind = "boss"; piece = "boss"; }
      else if (last) { kind = "mini"; piece = pick(["arena", "pillars", "boss"]); }
      else if (i > 0 && i < nRooms - 1 && rnd() < 0.42) { kind = "corridor"; piece = pick(hallPool); }
      else { kind = "room"; piece = pick(roomPool); }
      var g = blankGrid(0);
      PIECES[piece](g);
      if (i === 0) carveDoor(g, "e");
      else if (last) carveDoor(g, "w");
      else { carveDoor(g, "w"); carveDoor(g, "e"); }
      var ents = [];
      if (kind === "boss") {
        var btype = fl % 15 === 0 ? "thornqueen" : fl % 10 === 0 ? "ashtitan" : "boneking";
        ents.push({ kind: "enemy", type: btype, tx: 22, ty: 9 });
      } else if (kind === "mini") {
        var mt = bio.id === "crypt" ? "minibone" : bio.id === "forge" ? "miniforge" : bio.id === "ash" ? "miniash" : "minithorn";
        ents.push({ kind: "enemy", type: mt, tx: 20, ty: 9 });
        if (rnd() < 0.5) ents.push({ kind: "chest", tx: 26, ty: 9 });
      } else if (kind === "corridor") {
        var cN = 1 + (fl > 4 ? 1 : 0);
        for (var c = 0; c < cN; c++) ents.push({ kind: "enemy", type: pick(bio.roster), tx: irnd(6, 26), ty: piece === "hallH" ? irnd(7, 10) : irnd(3, 14) });
      } else {
        var budget = 2 + Math.min(4, Math.floor(fl / 3));
        if (piece === "choke") budget = Math.max(2, budget - 1);
        for (var e = 0; e < budget; e++) {
          ents.push({ kind: "enemy", type: pick(bio.roster), tx: irnd(10, 28), ty: irnd(3, 14) });
        }
        if (rnd() < 0.45) ents.push({ kind: "chest", tx: irnd(20, 28), ty: irnd(3, 14) });
      }
      list.push({ piece: piece, kind: kind, grid: g, ents: ents, cleared: false, blocks: [] });
    }
    return list;
  }

  function tileAt(g, x, y) {
    var tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);
    if (ty < 0 || tx < 0 || ty >= ROWS || tx >= COLS) return 1;
    return g[ty][tx];
  }
  function circleBlocked(g, blocks, x, y, r) {
    if (tileAt(g, x - r, y) || tileAt(g, x + r, y) || tileAt(g, x, y - r) || tileAt(g, x, y + r) || tileAt(g, x, y)) return true;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (Math.abs(x - b.x) < r + TILE * 0.45 && Math.abs(y - b.y) < r + TILE * 0.45) return true;
    }
    return false;
  }
  function resolveCircle(g, blocks, o) {
    if (!circleBlocked(g, blocks, o.x, o.y, o.r)) return false;
    var hit = false;
    if (tileAt(g, o.x + o.r, o.y) || tileAt(g, o.x - o.r, o.y) || blockHit(blocks, o.x, o.y, o.r, true)) {
      o.x -= o.vx * DT * 1.1; o.vx *= -1; hit = true;
    }
    if (tileAt(g, o.x, o.y + o.r) || tileAt(g, o.x, o.y - o.r) || blockHit(blocks, o.x, o.y, o.r, false)) {
      o.y -= o.vy * DT * 1.1; o.vy *= -1; hit = true;
    }
    if (circleBlocked(g, blocks, o.x, o.y, o.r)) {
      o.x -= o.vx * DT; o.y -= o.vy * DT;
    }
    return hit;
  }
  function blockHit(blocks, x, y, r, horiz) {
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (Math.abs(x - b.x) < r + TILE * 0.45 && Math.abs(y - b.y) < r + TILE * 0.45) return true;
    }
    return false;
  }

  function loadRoom(idx) {
    S.roomI = idx;
    var spec = S.rooms[idx];
    var ents = [];
    var chests = [];
    for (var i = 0; i < spec.ents.length; i++) {
      var e = spec.ents[i];
      var x = (e.tx + 0.5) * TILE, y = (e.ty + 0.5) * TILE;
      if (e.kind === "enemy") ents.push(spawnEnemy(e.type, x, y, S.floor, spec.kind === "boss"));
      else if (e.kind === "chest") chests.push({ x: x, y: y, open: false, r: 14 });
    }
    room = {
      spec: spec,
      grid: spec.grid,
      enemies: ents,
      chests: chests,
      blocks: spec.blocks.slice(),
      kind: spec.kind,
      cleared: spec.cleared,
      doorReady: spec.cleared,
      spawnX: spec.kind === "corridor" && spec.piece === "hallV" ? 16 * TILE : 3.5 * TILE,
      spawnY: spec.piece === "hallH" ? 9 * TILE : 9 * TILE
    };
    var spawnEnt = spec.ents.filter(function (e) { return e.kind === "spawn"; })[0];
    if (spawnEnt) {
      room.spawnX = (spawnEnt.tx + 0.5) * TILE;
      room.spawnY = (spawnEnt.ty + 0.5) * TILE;

  function startRun(seed, pass, custom) {

  function customToRoom(lv) {
    var g = blankGrid(0);

  /* ---------- combat ---------- */
  function hurtPlayer(n) {

  /* BB-V7.3 — a mini kill was indistinguishable from killing a slime: no beat, no
     fountain, no shake. It gets its own, deliberately smaller than a floor boss's

  function startBossDeath(en) {
    S.bossBeat = 2.4;
    S.muteFx = 0.5;
    S.shake = 0.6;

    for (var i = 0; i < 10; i++) {

  function dropLoot(x, y, rich) {
    var table = rnd();
    var it;
    if (rich || table > 0.55) {
      var aff = [];
      var n = rich ? irnd(1, 2) : (rnd() < 0.5 ? 1 : 0);
      for (var i = 0; i < n; i++) aff.push(pick(AFFIX));
      it = { kind: "ball", x: x, y: y, r: 13, vy: -40, life: 12, rar: rich ? (rnd() < 0.4 ? "legendary" : "epic") : rarityForFloor(S.floor), affix: aff, taken: false };
    } else {
      it = { kind: "frag", x: x, y: y, r: 8, vy: -30, life: 10, rar: "common", n: irnd(1, 3), taken: false };
    }
    S.loot.push(it);
    sfx("loot");
  }

  function takeLoot(it) {
    if (it.taken) return;
    it.taken = true;
    sfx("pickup");
    if (it.kind === "frag") {
      player.frag += it.n || 1;
      floatTxt(it.x, it.y, "+" + (it.n || 1) + " FRAG", "#f0d080");
    } else {
      player.ballAffix = it.affix.slice();
      store.stash.unshift({ affix: it.affix.slice(), rar: it.rar });
      if (store.stash.length > 8) store.stash.pop();
      saveStore();
      floatTxt(it.x, it.y, (it.affix[0] || "BALL") + " " + it.rar.toUpperCase(), RARITY[it.rar].c);
      toast((it.affix.join("+") || "PLAIN") + " · " + it.rar);
    }
  }

  function hasAff(name) {
    if (name === "Fire" && player.permaFire) return true;
    return ball.affix && ball.affix.indexOf(name) >= 0;
  }

  function hitEnemy(en, src, dmg, isSplit) {
    if (!en.alive) return;
    if (src.hits && src.hits.indexOf(en) >= 0 && !isSplit) return;
    if (src.hits) src.hits.push(en);
    var mul = 1;
    if (hasAff("Heavy") && src === ball) mul += 0.7;
    var dealt = Math.max(1, Math.floor(dmg * mul));
    en.hp -= dealt;
    en.stun = Math.max(en.stun, 0.12);
    floatTxt(en.x, en.y - en.r - 8, fmt(dealt), "#fff2c0");
    sfx("hit");
    burst(en.x, en.y, "#f0c070", 4);
    if (hasAff("Fire") && src === ball) en.burn = Math.max(en.burn, 2.2);
    if (hasAff("Chain") && src === ball) {
      var nxt = nearestEnemy(en.x, en.y, en);
      if (nxt) {
        var bolt = { x: nxt.x, y: nxt.y, from: en, to: nxt, t: 0.15 };
        S.pops.push(bolt);
        hitEnemy(nxt, { hits: [en] }, Math.floor(dealt * 0.6), true);
      }
    }
    if (en.hp <= 0) {
      var trick = src === ball && ball.hits && ball.hits.length >= 2;
      if (trick) {
        S.runTricks += 1;
        store.trickKills += 1;
        S.trickAll = store.trickKills;
        saveStore();
        floatTxt(en.x, en.y - 36, "TRICK KILL", "#ffd24a");
        S.shake = 0.35;
      }
      killEnemy(en, trick);
    }
  }

  function nearestEnemy(x, y, skip) {
    var best = null, bd = 90;
    for (var i = 0; i < room.enemies.length; i++) {
      var e = room.enemies[i];
      if (!e.alive || e === skip) continue;
      var d = Math.hypot(e.x - x, e.y - y);
      if (d < bd) { bd = d; best = e; }
    }
    return best;
  }

  function throwBall(ang, pow) {
    if (ball.live) return;
    S.throws = (S.throws || 0) + 1;
    var spd = throwSpeed() * pow;
    ball.live = true; ball.ret = false; ball.pierced = false;
    ball.x = player.x + Math.cos(ang) * 20;
    ball.y = player.y + Math.sin(ang) * 20;
    ball.vx = Math.cos(ang) * spd;
    ball.vy = Math.sin(ang) * spd;
    ball.life = 2.6; ball.bounces = 0; ball.hits = [];
    ball.dmg = currentDmg();
    ball.affix = (player.ballAffix || []).slice();
    ball.trail = [];
    sfx("throw");
    if (!S.seenAimHelp) { S.seenAimHelp = true; store.aimHelp = true; saveStore(); }
  }

  function updateBall(dt) {
    if (!ball.live) {
      /* CHIEF BB-V5.3 — the ball at rest used to be drawn over the hero's face.
         It now sits in the throwing hand, out to the side and low. */
      ball.x = player.x + player.facing * 30;
      ball.y = player.y - 8;
      return;
    }
    if (ball.ret) {
      var dx = player.x - ball.x, dy = player.y - 18 - ball.y;
      var d = Math.hypot(dx, dy) || 1;
      ball.vx = dx / d * 520; ball.vy = dy / d * 520;
      ball.x += ball.vx * dt; ball.y += ball.vy * dt;
      if (d < 30) { ball.live = false; ball.ret = false; }
      return;
    }
    if (hasAff("Homing")) {
      var t = nearestEnemy(ball.x, ball.y, null);
      if (t) {
        var ang = Math.atan2(t.y - ball.y, t.x - ball.x);
        var spd = Math.hypot(ball.vx, ball.vy);
        var cx = Math.cos(ang) * spd, cy = Math.sin(ang) * spd;
        ball.vx = ball.vx * 0.92 + cx * 0.08;
        ball.vy = ball.vy * 0.92 + cy * 0.08;
      }
    }
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;
    ball.life -= dt;
    if (resolveCircle(room.grid, room.blocks, ball)) {
      ball.bounces += 1;
      sfx("bounce");
      if (hasAff("Split") && ball.bounces === 1) spawnSplit();
    }
    for (var i = 0; i < room.enemies.length; i++) {
      var e = room.enemies[i];
      if (!e.alive) continue;
      if (Math.hypot(e.x - ball.x, e.y - ball.y) < e.r + ball.r) {
        var wasAlive = e.alive;
        hitEnemy(e, ball, ball.dmg, false);
        if (hasAff("Split") && ball.hits.length === 1) spawnSplit();
        /* CHIEF BB-V6.4 — the ball used to sail straight through a live enemy, which
           made a body no different from empty floor and quietly deleted the reason to
           aim. It now rebounds off anything still standing, exactly as it does off a
           wall, and that rebound counts as a bounce — so hitting an enemy and then
           banking into a second one is a TRICK KILL. Heavy is the affix that buys
           the old behaviour: it pierces the first enemy it meets and carries on.
           A body that dies on the hit never blocks: you punch through the kill. */
        var pierce = hasAff("Heavy") && !ball.pierced;
        if (pierce) { ball.pierced = true; ball.vx *= 0.85; ball.vy *= 0.85; }
        else if (wasAlive && e.alive) {
          var dx = ball.x - e.x, dy = ball.y - e.y;
          var d = Math.hypot(dx, dy) || 1;
          var nx = dx / d, ny = dy / d;
          var into = ball.vx * nx + ball.vy * ny;
          if (into < 0) { ball.vx -= 1.85 * into * nx; ball.vy -= 1.85 * into * ny; }
          ball.x = e.x + nx * (e.r + ball.r + 1);
          ball.y = e.y + ny * (e.r + ball.r + 1);
          ball.bounces += 1;
          sfx("bounce");
          burst(ball.x, ball.y, "#ffe0a0", 3);
        }
      }
    }
    ball.trail.push({ x: ball.x, y: ball.y, t: 0.25 });
    if (ball.trail.length > 14) ball.trail.shift();
    if (ball.life <= 0 || ball.bounces >= 9 || Math.hypot(ball.vx, ball.vy) < 40) ball.ret = true;
  }

  function spawnSplit() {
    for (var i = -1; i <= 1; i += 2) {
var a = Math.atan2(ball.vy, ball.vx) + i * 0.5;
      S.splits.push({ x: ball.x, y: ball.y, vx: Math.cos(a) * 380, vy: Math.sin(a) * 380, r: 6, life: 0.7, hits: [] });
    }
  }

  function updateSplits(dt) {
    for (var i = S.splits.length - 1; i >= 0; i--) {
      var s = S.splits[i];
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      resolveCircle(room.grid, room.blocks, s);
      for (var j = 0; j < room.enemies.length; j++) {
        var e = room.enemies[j];
        if (e.alive && Math.hypot(e.x - s.x, e.y - s.y) < e.r + s.r) hitEnemy(e, s, Math.floor(currentDmg() * 0.45), true);
      }
      if (s.life <= 0) S.splits.splice(i, 1);
    }
  }

  function aimGuide(ang, pow) {
    var pts = [];
    var x = player.x + Math.cos(ang) * 20, y = player.y + Math.sin(ang) * 20;
    var vx = Math.cos(ang), vy = Math.sin(ang);
    pts.push({ x: x, y: y });
    var bounced = false;
    for (var i = 0; i < 90; i++) {
      x += vx * 8; y += vy * 8;
      if (tileAt(room.grid, x, y) || blockHit(room.blocks, x, y, 6, true)) {
        var hx = tileAt(room.grid, x + vx * 8, y) || blockHit(room.blocks, x + 4, y, 6, true);
        var hy = tileAt(room.grid, x, y + vy * 8) || blockHit(room.blocks, x, y + 4, 6, false);
        if (hx) vx *= -1;
        if (hy) vy *= -1;
        if (!hx && !hy) { vx *= -1; vy *= -1; }
        bounced = true;
        pts.push({ x: x, y: y, bounce: true });
        if (pts.length > 2) break;
      }
      if (i % 2 === 0) pts.push({ x: x, y: y });
      if (bounced && pts.length > 8) break;
    }
    return pts;
  }

  /* ---------- AI ---------- */
  function updateEnemies(dt) {
    var living = 0;
    for (var i = 0; i < room.enemies.length; i++) {
      var e = room.enemies[i];
      if (!e.alive) {
        e.deadT -= dt;
        continue;
      }
      living++;
      if (e.burn > 0) {
        e.burn -= dt;
        if (Math.floor(e.burn * 8) !== Math.floor((e.burn + dt) * 8)) {
          e.hp -= Math.max(1, Math.floor(currentDmg() * 0.08));
          if (e.hp <= 0) killEnemy(e, false);
        }
      }
      if (e.stun > 0) { e.stun -= dt; continue; }
      e.cd -= dt;
      var dx = player.x - e.x, dy = player.y - e.y;
      var dist = Math.hypot(dx, dy) || 1;
      e.facing = dx < 0 ? -1 : 1;
      if (e.boss) { updateBoss(e, dt, dx, dy, dist); }
      else if (e.kind === "chase") moveToward(e, dx / dist, dy / dist, e.spd, dt);
      else if (e.kind === "swoop") {
        e.phase += dt;
        moveToward(e, Math.cos(e.phase * 3) * 0.6 + dx / dist, Math.sin(e.phase * 2) * 0.6 + dy / dist, e.spd, dt);
      } else if (e.kind === "orbit") {
        e.phase += dt;
        var ox = Math.cos(e.phase) * 80, oy = Math.sin(e.phase) * 80;
        moveToward(e, (player.x + ox - e.x) / 40, (player.y + oy - e.y) / 40, e.spd, dt);
      } else if (e.kind === "charge") {
        if (e.cd <= 0) { e.vx = dx / dist * e.spd * 3; e.vy = dy / dist * e.spd * 3; e.cd = 1.8; }
        e.x += e.vx * dt; e.y += e.vy * dt;
        e.vx *= 0.98; e.vy *= 0.98;
        resolveCircle(room.grid, room.blocks, e);
      } else if (e.kind === "range") {
        if (dist < 90) moveToward(e, -dx / dist, -dy / dist, e.spd, dt);
        if (e.cd <= 0) { fireShot(e.x, e.y, dx / dist, dy / dist, 160, 1); e.cd = 1.6 + rnd() * 0.6; }
      }
      if (Math.hypot(e.x - player.x, e.y - player.y) < e.r + player.r - 2) {
        hurtPlayer(1 + Math.floor(S.floor / 6));
        var px = player.x - e.x, py = player.y - e.y, pd = Math.hypot(px, py) || 1;
        /* CHIEF FIX BB-V6.10 — THE clipping cause, found by instrumenting rather
           than by theory. This knock-back from an enemy hit moved the player 18px
           with no wall test at all, so any hit taken with a wall behind you put you
           inside the stone — and enemies are 45% faster now, so they crowd you into
           walls constantly. It goes through the same slide the walk does, and what
           will not fit is simply not applied. */
        var kr = player.r * 0.6;
        slide("x", px / pd * 18, kr);
        slide("y", py / pd * 18, kr);
      }
    }
    if (living === 0 && room && !room.cleared && room.enemies.length) {
      room.cleared = true;
      room.doorReady = true;
      room.clearWait = room.kind === "boss" ? 99 : 0.7;
      S.rooms[S.roomI].cleared = true;
      if (room.kind === "boss" && S.bossBeat > 0) { /* floor card waits on beat */ }
      else toast("ROOM CLEAR");
    }
  }

  function moveToward(e, ux, uy, spd, dt) {
    e.vx = ux * spd; e.vy = uy * spd;
    e.x += e.vx * dt; e.y += e.vy * dt;
    resolveCircle(room.grid, room.blocks, e);
  }

  function fireShot(x, y, ux, uy, spd, dmg) {
    S.shots.push({ x: x, y: y, vx: ux * spd, vy: uy * spd, r: 5, life: 3, dmg: dmg });
  }

  function updateBoss(e, dt, dx, dy, dist) {
    e.phase += dt;
    if (e.boss === "ash") {
      /* ASH TITAN v4
         v3 ring: maxR 420, dmg 55+8*floor applied every frame in band, no tell, no gap
         v4 ring: maxR 196, dmg 8+floor applied ONCE, tell 1.35s, gap 1.15 rad */
      moveToward(e, dx / dist * 0.4, dy / dist * 0.4, e.spd, dt);
      if (e.tell > 0) {
        e.tell -= dt;
        if (e.tell <= 0) {
          e.ringOn = true; e.ringR = 28;
          var ang = Math.atan2(dy, dx) + (rnd() < 0.5 ? 2.4 : -2.4);
          e.gap = ang;
        }
      } else if (e.ringOn) {
        e.ringR += 150 * dt;
        if (!e.ringHit) {
          var pr = Math.hypot(player.x - e.x, player.y - e.y);
          var pang = Math.atan2(player.y - e.y, player.x - e.x);
          var ad = Math.abs(Math.atan2(Math.sin(pang - e.gap), Math.cos(pang - e.gap)));
          var inBand = Math.abs(pr - e.ringR) < 18;
          var inGap = ad < 0.575;
          if (inBand && !inGap) {
            e.ringHit = true;
            hurtPlayer(8 + S.floor);
          }
        }
        if (e.ringR >= 196) { e.ringOn = false; e.ringHit = false; e.cd = 2.2; }
      } else if (e.cd <= 0) {
        if (rnd() < 0.55) { e.tell = 1.35; e.ringHit = false; }
        else { fireShot(e.x, e.y, dx / dist, dy / dist, 200, 2); fireShot(e.x, e.y, dx / dist + 0.2, dy / dist, 180, 2); e.cd = 1.4; }
      }
    } else if (e.boss === "bone") {
      if (e.cd <= 0) {
        for (var k = 0; k < 6; k++) {
          var a = k * Math.PI / 3 + e.phase;
          fireShot(e.x, e.y, Math.cos(a), Math.sin(a), 170, 1);
        }
        e.cd = 2.0;
      }
      moveToward(e, dx / dist * 0.3, dy / dist * 0.3, e.spd, dt);
    } else if (e.boss === "thorn") {
      if (e.cd <= 0) {
        fireShot(e.x, e.y, dx / dist, dy / dist, 210, 2);
        e.cd = 0.7;
      }
      if (Math.floor(e.phase) % 4 === 0 && e.tell <= 0) e.tell = 0.01;
      moveToward(e, dx / dist * 0.5, dy / dist * 0.5, e.spd, dt);
    } else {
      moveToward(e, dx / dist, dy / dist, e.spd, dt);
      if (e.cd <= 0) { fireShot(e.x, e.y, dx / dist, dy / dist, 180, 1); e.cd = 1.5; }
    }
  }

  function updateShots(dt) {
    for (var i = S.shots.length - 1; i >= 0; i--) {
      var s = S.shots[i];
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      if (tileAt(room.grid, s.x, s.y) || blockHit(room.blocks, s.x, s.y, s.r, true)) { S.shots.splice(i, 1); continue; }
      if (Math.hypot(s.x - player.x, s.y - player.y) < player.r + s.r) {
        hurtPlayer(s.dmg); S.shots.splice(i, 1); continue;
      }
      if (s.life <= 0) S.shots.splice(i, 1);
    }
  }

  function updateLoot(dt) {
    for (var i = S.loot.length - 1; i >= 0; i--) {
      var it = S.loot[i];
      it.life -= dt; it.vy += 80 * dt; it.y += it.vy * dt;
      if (it.y > WORLD_H - 40) { it.y = WORLD_H - 40; it.vy *= -0.3; }
      if (!it.taken && Math.hypot(it.x - player.x, it.y - player.y) < 28) takeLoot(it);
      if (it.life <= 0 || it.taken) S.loot.splice(i, 1);
    }
  }

  function burst(x, y, col, n) {
    for (var i = 0; i < n && S.particles.length < MAX_PART; i++) {
      var a = rnd() * Math.PI * 2, sp = 40 + rnd() * 120;
      S.particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0.4 + rnd() * 0.3, col: col, s: 2 + rnd() * 3 });
    }
  }
  function floatTxt(x, y, t, c) {
    S.floats.push({ x: x, y: y, t: t, c: c || "#fff", life: 0.8, vy: -36 });
  }
  function updateFx(dt) {
    for (var i = S.particles.length - 1; i >= 0; i--) {
      var p = S.particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 80 * dt; p.t -= dt;
      if (p.t <= 0) S.particles.splice(i, 1);
    }
    for (var j = S.floats.length - 1; j >= 0; j--) {
      var f = S.floats[j];
      f.y += f.vy * dt; f.life -= dt;
      if (f.life <= 0) S.floats.splice(j, 1);
    }
    for (var k = S.pops.length - 1; k >= 0; k--) {
      S.pops[k].t -= dt;
      if (S.pops[k].t <= 0) S.pops.splice(k, 1);
    }
    if (S.shake > 0) S.shake -= dt;
    if (S.muteFx > 0) S.muteFx -= dt;
    if (S.bossBeat > 0) {
      S.bossBeat -= dt;
      if (S.bossBeat <= 0 && room && room.cleared) {
        nextRoomOrFloor();
      }
    }
  }

  function tryPlaceBlock(wx, wy) {
    if (player.blockStock <= 0) { toast("NO BLOCKS"); return; }
    var tx = Math.floor(wx / TILE), ty = Math.floor(wy / TILE);
    if (ty <= 0 || tx <= 0 || ty >= ROWS - 1 || tx >= COLS - 1) return;
    if (room.grid[ty][tx]) return;
    var x = (tx + 0.5) * TILE, y = (ty + 0.5) * TILE;
    if (Math.hypot(x - player.x, y - player.y) < 36) return;
    room.blocks.push({ x: x, y: y, tx: tx, ty: ty });
    S.rooms[S.roomI].blocks = room.blocks.slice();
    player.blockStock -= 1;
    sfx("place");
    syncHud();
  }

  /* CHIEF BB-V5.1 — solid test and axis-separated movement. Axis-separated so a hero
     pushing into a corner slides along the wall instead of sticking to it, which is
     the difference between a control that feels alive and one that feels broken. */
  function solidAt(x, y) {
    if (!room) return true;
    var tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);
    if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return true;
    if (room.grid[ty] && room.grid[ty][tx]) return true;
    var bl = room.blocks || [];
    for (var i = 0; i < bl.length; i++) {
      if (Math.abs(bl[i].x - x) < TILE * 0.5 && Math.abs(bl[i].y - y) < TILE * 0.5) return true;
    }
    return false;
  }

  function freeAt(x, y, r) {
    return !solidAt(x - r, y - r) && !solidAt(x + r, y - r) &&
           !solidAt(x - r, y + r) && !solidAt(x + r, y + r) &&
           !solidAt(x, y - r) && !solidAt(x, y + r) &&
           !solidAt(x - r, y) && !solidAt(x + r, y);
  }

  /* CHIEF BB-V5.6 — how the walk feels is the game, not a detail. Four things make
     the difference between a hero who walks well and one who slides around:

       1. He accelerates and stops on a ramp, not a switch. Starting is quick (he is
          responsive) and stopping is quicker (he does not skate past the spot you
          let go on).
       2. Diagonals are normalised, so walking corner-ways is not 41% faster.
       3. A corner nudge: when the leading edge clips a tile corner but the way past
          is clear a few pixels over, he is slid those few pixels instead of stopping
          dead. Without this every doorway snags and the whole thing feels sticky.
       4. Keys as well as the stick, summed, so a desk and a thumb both work. */
  var KEYS = Object.create(null);

  function inputVec() {
    var mx = STK.L.dx, my = STK.L.dy;
    if (KEYS.left) mx -= 1;
    if (KEYS.right) mx += 1;
    if (KEYS.up) my -= 1;
    if (KEYS.down) my += 1;
    var m = Math.hypot(mx, my);
    if (m > 1) { mx /= m; my /= m; m = 1; }
    return { x: mx, y: my, m: m };
  }

  /* FEEL — live-tunable, persisted. Defaults are the v3-equivalent: that build ran
     158 px/s at 1.00x sprite scale and was the one that got "keep the controls";
     the sprite is now 2.15x, and speed is felt in body-lengths, so 158 * 2.15 = 340.
     Shipping at 235 was a 31% slowdown in the only unit that matters. */
  var BUILD = "v7.4";
  var FEEL_DEF = { spd: 340, accel: 2600, brake: 3600, throwSpd: 620, aimMode: "drag", aimDead: 2, aimHold: 64 };
  var FEEL = (function () {
    var f = {};
    for (var k in FEEL_DEF) f[k] = FEEL_DEF[k];
    try {
      /* v2 bumped the key so the new DRAG default actually reaches a device that
         already wrote a v1 blob. Slider tweaks carry over; aimMode deliberately
         does not -- otherwise a stale "hybrid" would outrank the new default. */
      var raw = localStorage.getItem("bb.feel.v2"), skipAim = false;
      if (!raw) { raw = localStorage.getItem("bb.feel.v1"); skipAim = !!raw; }
      if (raw) { var o = JSON.parse(raw); for (var j in o) if (j in f && !(skipAim && j === "aimMode")) f[j] = o[j]; }
    } catch (e) {}
    return f;
  })();
  function saveFeel() { try { localStorage.setItem("bb.feel.v2", JSON.stringify(FEEL)); } catch (e) {} }

  var NUDGE = 8;

  /* CHIEF FIX BB-V6.8 — the hero could walk into a wall and stick there. The corner
     nudge tested one point and then moved to a DIFFERENT one: it asked whether
     (nx, y ± 7) was clear and, on yes, moved to (nx, y ± 3.85). The point it landed
     on was never checked, so on a tile edge it put him inside the stone — and once
     inside, every direction reads as blocked and he is held fast. It now moves to
     exactly the point it tested, and `unstick` is the belt and braces: if he is ever
     found inside a solid, he is walked out to the nearest clear spot rather than
     left there. */
  function slide(axis, step, r) {
    var nx = axis === "x" ? player.x + step : player.x;
    var ny = axis === "y" ? player.y + step : player.y;
    if (freeAt(nx, ny, r)) { player.x = nx; player.y = ny; return true; }
    for (var k = 1; k <= 3; k++) {
      var off = NUDGE * k;
      if (axis === "x") {
        if (freeAt(nx, player.y - off, r)) { player.x = nx; player.y -= off; return true; }
        if (freeAt(nx, player.y + off, r)) { player.x = nx; player.y += off; return true; }
      } else {
        if (freeAt(player.x - off, ny, r)) { player.y = ny; player.x -= off; return true; }
        if (freeAt(player.x + off, ny, r)) { player.y = ny; player.x += off; return true; }
      }
    }
    return false;
  }

  function unstick(r) {
    if (freeAt(player.x, player.y, r)) return false;
    for (var ring = 1; ring <= 10; ring++) {
      var step = ring * 6;
      for (var a = 0; a < 16; a++) {
        var ang = a * Math.PI / 8;
        var tx = player.x + Math.cos(ang) * step;
        var ty = player.y + Math.sin(ang) * step;
        if (freeAt(tx, ty, r)) { player.x = tx; player.y = ty; player.vx = player.vy = 0; return true; }
      }
    }
    /* nothing within sixty pixels: fall back to the middle of the nearest open tile */
    for (var ty2 = 1; ty2 < ROWS - 1; ty2++) {
      for (var tx2 = 1; tx2 < COLS - 1; tx2++) {
        var cx = (tx2 + 0.5) * TILE, cy = (ty2 + 0.5) * TILE;
        if (freeAt(cx, cy, r)) { player.x = cx; player.y = cy; player.vx = player.vy = 0; return true; }
      }
    }
    return false;
  }

  function walkPlayer(dt) {
    var rr = player.r * 0.6;
    /* Not while the room is clearing: the exit walk deliberately carries him into
       the doorway, and the doorway reads as out of bounds. Rescuing him there would
       be fighting the game. One toast a second at most — a rescue that fires every
       frame is a spinner, not a message. */
    if (!(room && room.cleared) && unstick(rr)) {
      if (S.t - (S.lastUnstick || -9) > 1) { S.lastUnstick = S.t; toast("UNSTUCK"); }
    }
    var inp = inputVec();
    var top = player.spd * (1 + player.spdLv * 0.05);
    var tx = inp.x * top, ty = inp.y * top;
    var rate = inp.m > 0.12 ? FEEL.accel : FEEL.brake;
    var dvx = tx - player.vx, dvy = ty - player.vy;
    var dv = Math.hypot(dvx, dvy);
    if (dv > 0) {
      var step = Math.min(dv, rate * dt);
      player.vx += dvx / dv * step;
      player.vy += dvy / dv * step;
    }
    var sp = Math.hypot(player.vx, player.vy);
    if (sp < 4) { player.vx = player.vy = 0; player.walk *= 0.84; return; }
    var r = player.r * 0.6;
    if (!slide("x", player.vx * dt, r)) player.vx *= 0.2;
    if (!slide("y", player.vy * dt, r)) player.vy *= 0.2;
    player.walk += dt * (4 + sp / top * 8);
    if (!S.aim) player.facing = player.vx < -8 ? -1 : player.vx > 8 ? 1 : player.facing;
  }

  function updatePlayer(dt) {
    if (player.inv > 0) player.inv -= dt;
    walkPlayer(dt);
    /* second pass: anything that moved him after the walk (a knock-back, a boss
       ring) is caught before the frame is drawn, so he is never rendered in stone */
    if (!(room && room.cleared)) unstick(player.r * 0.6);
    if (S.aim && S.aim.x < player.x - 8) player.facing = -1;
    else if (S.aim && S.aim.x > player.x + 8) player.facing = 1;
    if (room && room.cleared && room.doorReady && S.bossBeat <= 0 && room.kind !== "boss") {
      if (room.clearWait > 0) room.clearWait -= dt;
      else {
        /* CHIEF FIX BB-V6.8 — the exit walk used to move him straight through stone. */
        slide("x", 200 * dt, player.r * 0.6);
        if (player.x > (COLS - 2) * TILE - 10) nextRoomOrFloor();
      }
    }
  }

  /* ---------- render ---------- */
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    canvas.width = Math.max(320, Math.floor(w * (window.devicePixelRatio > 1.5 ? 1.5 : window.devicePixelRatio || 1)));
    canvas.height = Math.max(240, Math.floor(h * (window.devicePixelRatio > 1.5 ? 1.5 : window.devicePixelRatio || 1)));
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    var port = h > w * 1.05;
    S.portrait = port;
    syncRotate();
  }

  /* CHIEF FIX BB-V4.8 — the rotate gate used to fire on any portrait screen, so a
     phone held the normal way met "Rotate to play" before it had seen the title.
     Only the run and the builder need landscape; the splash and the menu are built
     to read upright. The gate now waits until the player actually starts. */
  function syncRotate() {
    /* FIX BB-V7.0 — the rotate gate is z-index 80 and the panels are 40, so in
       portrait it covered the pause, shop and floor cards. Mode stays "play" while
       paused, so pausing and turning the phone upright locked you out of MENU with
       a screen that only says "turn sideways". A card does not need landscape;
       only the live field does. */
    var panelOpen = ["splashPanel", "menuPanel", "pausePanel", "shopPanel", "passPanel",
                     "floorPanel", "builderPanel", "feelPanel"].some(function (id) {
      var el = document.getElementById(id);
      return el && el.className.indexOf("show") >= 0;
    });
    var needsLandscape = (S.mode === "play" || S.mode === "builder") && !S.pause && !panelOpen;
    rotateEl.className = (S.portrait && needsLandscape) ? "show" : "";
  }

  function worldFromEvent(ev) {
    var rect = canvas.getBoundingClientRect();
    var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
    var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
    return {
      x: (sx - S.world.x) / S.world.s,
      y: (sy - S.world.y) / S.world.s
    };
  }

  function draw() {
    var g = ctx;
    var cw = canvas.width, ch = canvas.height;
    g.fillStyle = DARK;
    g.fillRect(0, 0, cw, ch);
    var scale = Math.min(cw / WORLD_W, ch / WORLD_H);
    var ox = (cw - WORLD_W * scale) * 0.5;
    var oy = (ch - WORLD_H * scale) * 0.5;
    S.world = { x: ox, y: oy, s: scale };
    g.save();
    if (S.shake > 0) g.translate((Math.random() - 0.5) * 10 * S.shake * scale, (Math.random() - 0.5) * 10 * S.shake * scale);
    g.translate(ox, oy);
    g.scale(scale, scale);
    drawWorld(g);
    g.restore();
    if (S.mode === "play" && !S.pause && !S.portrait) drawSticks(g);
    if (S.mode === "play" && !S.seenAimHelp) {
      g.fillStyle = "rgba(20,17,14,0.0)";
    }
  }

  /* CHIEF BB-V5.1 — the two spherical controls, drawn in screen space so they keep
     their size whatever the world scale is. The right one carries the ball itself, so
     the player can see at a glance whether the ball is in hand or still in flight. */
  function drawSticks(g) {
    var G = stickGeom(), rad = G.rad;
    var pal = (player && player.cos && PALETTES[player.cos.pal]) || PALETTES.ember;

    function ring(cx, cy, dx, dy, live) {
      g.globalAlpha = live ? 0.30 : 0.18;
      g.fillStyle = "#f0e6d4";
      g.beginPath(); g.arc(cx, cy, rad, 0, 6.3); g.fill();
      g.globalAlpha = live ? 0.85 : 0.5;
      g.strokeStyle = "#f0e6d4"; g.lineWidth = Math.max(2, rad * 0.05);
      g.beginPath(); g.arc(cx, cy, rad, 0, 6.3); g.stroke();
      g.globalAlpha = 1;
      return { kx: cx + dx * rad * 0.55, ky: cy + dy * rad * 0.55 };
    }

    var k = ring(G.L.cx, G.L.cy, STK.L.dx, STK.L.dy, STK.L.id !== null);
    g.globalAlpha = 0.9;
    g.fillStyle = "#f4ead6";
    g.beginPath(); g.arc(k.kx, k.ky, rad * 0.4, 0, 6.3); g.fill();
    g.strokeStyle = "#1a120c"; g.lineWidth = Math.max(2, rad * 0.05);
    g.beginPath(); g.arc(k.kx, k.ky, rad * 0.4, 0, 6.3); g.stroke();
    g.globalAlpha = 0.55;
    g.fillStyle = "#1a120c";
    g.beginPath();
    g.moveTo(k.kx, k.ky - rad * 0.2); g.lineTo(k.kx + rad * 0.14, k.ky); g.lineTo(k.kx - rad * 0.14, k.ky);
    g.closePath(); g.fill();
    g.globalAlpha = 1;

    /* the right ring: the ball, and — until the player has thrown a few — a small
       ricochet looping inside it, so the idea arrives without a word of tutorial. */
    ring(G.R.cx, G.R.cy, 0, 0, false);
    var inHand = !ball.live;
    var cx = G.R.cx, cy = G.R.cy;

    if (S.throws < 4) {
      /* the signature horseshoe from the key art: the ball sweeps round, banks, and
         comes back. One loop says "throw it at a wall" better than a sentence does. */
      var a0 = 2.35, a1 = -1.15, rr = rad * 0.6;
      g.globalAlpha = 0.45;
      g.strokeStyle = "#f0a050";
      g.lineWidth = Math.max(3, rad * 0.1);
      g.lineCap = "round";
      g.beginPath(); g.arc(cx, cy, rr, a0, a1, true); g.stroke();
      g.globalAlpha = 0.9;
      g.strokeStyle = "#6a5a44";
      g.lineWidth = Math.max(3, rad * 0.085);
      g.beginPath();
      g.moveTo(cx + Math.cos(a1) * rr * 1.5, cy + Math.sin(a1) * rr * 1.5 - rad * 0.16);
      g.lineTo(cx + Math.cos(a1) * rr * 1.5, cy + Math.sin(a1) * rr * 1.5 + rad * 0.16);
      g.stroke();
      g.globalAlpha = 1;
      var tt = (S.t * 0.7) % 1;
      var ang2 = a0 + (a1 - a0 - 6.283) * tt;
      var hx = cx + Math.cos(ang2) * rr, hy = cy + Math.sin(ang2) * rr;
      g.fillStyle = ballColour();
      g.beginPath(); g.arc(hx, hy, rad * 0.19, 0, 6.3); g.fill();
      g.strokeStyle = "#1a120c"; g.lineWidth = Math.max(1.5, rad * 0.04);
      g.beginPath(); g.arc(hx, hy, rad * 0.19, 0, 6.3); g.stroke();
      g.globalAlpha = 0.8;
      g.fillStyle = "#f0e6d4";
      g.font = "bold " + Math.round(rad * 0.21) + "px -apple-system, sans-serif";
      g.textAlign = "center";
      g.fillText("DRAG ANYWHERE", cx, cy - rad * 1.22);
      g.globalAlpha = 1;
    } else {
      g.globalAlpha = inHand ? 1 : 0.3;
      g.fillStyle = ballColour();
      g.beginPath(); g.arc(cx, cy, rad * 0.5, 0, 6.3); g.fill();
      g.strokeStyle = "#1a120c"; g.lineWidth = Math.max(2, rad * 0.07);
      g.beginPath(); g.arc(cx, cy, rad * 0.5, 0, 6.3);
      g.moveTo(cx, cy - rad * 0.5); g.lineTo(cx, cy + rad * 0.5);
      g.moveTo(cx - rad * 0.5, cy); g.lineTo(cx + rad * 0.5, cy);
      g.stroke();
      g.globalAlpha = 1;
    }
  }

  /* CHIEF BB-V5.3 — one hex in, a lighter or darker hex out, for the lit and shaded
     faces. Clamped, so an already-bright colour cannot wrap around to black. */
  function shade(hex, k) {
    var n = parseInt(hex.slice(1), 16);
    var r = Math.min(255, Math.round(((n >> 16) & 255) * k));
    var g2 = Math.min(255, Math.round(((n >> 8) & 255) * k));
    var b = Math.min(255, Math.round((n & 255) * k));
    return "#" + ((1 << 24) + (r << 16) + (g2 << 8) + b).toString(16).slice(1);
  }

  /* the old game's ball skins: a highlight, a body and a seam per skin */
  function ballCols() {
    var id = player && player.cos ? player.cos.ball : "classic";
    if (id === "rose") return { hi: "#ffc8d8", lo: "#c04868", seam: "#fff0f4" };
    if (id === "midnight") return { hi: "#8098d8", lo: "#1c2848", seam: "#c8d8ff" };
    if (id === "rune") return { hi: "#90e0d0", lo: "#186858", seam: "#0a3028" };
    if (id === "ivy") return { hi: "#90d878", lo: "#205828", seam: "#0c2810" };
    if (id === "cracked") return { hi: "#e8a070", lo: "#8c3810", seam: "#2a1008" };
    return { hi: "#f0a050", lo: "#c45a12", seam: "#1a120c" };
  }

  function ballColour() {
    var skin = player && player.cos ? player.cos.ball : "classic";
    if (skin === "rose") return "#d07090";
    if (skin === "midnight") return "#304878";
    if (skin === "rune") return "#40a090";
    if (skin === "ivy") return "#3a8848";
    if (skin === "cracked") return "#b05020";
    return ballCols().lo;
  }

  /* BB-V7.4 — walls were flat tiles with a 6px shadow strip INSIDE the tile: 20% of a
     30px tile, an emboss, and nothing occluded anything. Meanwhile the hero, the mobs
     and the knights all carry real cube() depth, so the sprites promised a 3/4 view
     and the floor delivered a top-down checkerboard. The old LP build got this right:
     walls are blocks lifted by their own height, ~48% of a tile. That one number is
     the difference between a room and a grid. */
  var WALL_Z = 0.48;
  function drawWorld(g) {
    var bio = biomeOf(S.floor);
    var wz = Math.round(TILE * WALL_Z);
    var y, x, wall;
    /* floor for EVERY tile first, or a wall's lifted top is painted over by the
       floor of the tile above it. */
    for (y = 0; y < ROWS; y++) {
      for (x = 0; x < COLS; x++) {
        g.fillStyle = bio.floor[(x + y) & 1];
        g.fillRect(x * TILE, y * TILE, TILE, TILE);
      }
    }
    /* then walls as blocks, top row first so a lower wall occludes the one above it */
    for (y = 0; y < ROWS; y++) {
      for (x = 0; x < COLS; x++) {
        wall = room ? room.grid[y][x] : 1;
        if (!wall) continue;
        cube(g, x * TILE, y * TILE - wz, TILE, TILE, wz, bio.walls[(x + y) & 1]);
      }
    }
    if (room && room.cleared) {
      g.fillStyle = "#d0a040";
      g.fillRect((COLS - 1) * TILE + 6, 8 * TILE, 10, 2 * TILE);
    }
    if (room) {
      for (var b = 0; b < room.blocks.length; b++) {
        var bl = room.blocks[b];
        g.fillStyle = "#6a5a44";
        g.fillRect(bl.x - TILE * 0.45, bl.y - TILE * 0.45, TILE * 0.9, TILE * 0.9);
        g.fillStyle = "#8a7a60";
        g.fillRect(bl.x - TILE * 0.45, bl.y - TILE * 0.45, TILE * 0.9, 6);
      }
      for (var c = 0; c < room.chests.length; c++) drawChest(g, room.chests[c]);
      for (var i = 0; i < room.enemies.length; i++) drawEnemy(g, room.enemies[i]);
    }
    for (var L = 0; L < S.loot.length; L++) drawLoot(g, S.loot[L]);
    for (var s = 0; s < S.shots.length; s++) {
      g.fillStyle = "#f0c070";
      g.beginPath(); g.arc(S.shots[s].x, S.shots[s].y, S.shots[s].r, 0, 6.3); g.fill();
    }
    for (var sp = 0; sp < S.splits.length; sp++) {
      g.fillStyle = "#f09040";
g.beginPath(); g.arc(S.splits[sp].x, S.splits[sp].y, S.splits[sp].r, 0, 6.3); g.fill();
    }
    if (ball && !ball.live) drawBallObj(g, ball, false);
    if (player) drawPlayer(g);
    if (ball && ball.live) drawBallObj(g, ball, true);
    if (S.aim && !ball.live) {
      var pts = aimGuide(S.aim.ang, S.aim.pow);
      g.strokeStyle = "rgba(240,210,140,0.45)";
      g.lineWidth = 2;
      g.setLineDash([6, 6]);
      g.beginPath();
      for (var p = 0; p < pts.length; p++) {
        if (p === 0) g.moveTo(pts[p].x, pts[p].y); else g.lineTo(pts[p].x, pts[p].y);
      }
      g.stroke();
      g.setLineDash([]);
      g.fillStyle = "rgba(240,210,140,0.8)";
      g.beginPath(); g.arc(player.x + Math.cos(S.aim.ang) * 28, player.y + Math.sin(S.aim.ang) * 28, 4, 0, 6.3); g.fill();
    }
    for (var z = 0; z < S.particles.length; z++) {
      var pt = S.particles[z];
      g.globalAlpha = Math.max(0, pt.t * 2);
      g.fillStyle = pt.col;
      g.fillRect(pt.x, pt.y, pt.s, pt.s);
      g.globalAlpha = 1;
    }
    for (var f = 0; f < S.floats.length; f++) {
      var ft = S.floats[f];
      g.globalAlpha = Math.max(0, ft.life * 1.4);
      g.fillStyle = ft.c;
      g.font = "bold 16px -apple-system, sans-serif";
      g.textAlign = "center";
      g.fillText(ft.t, ft.x, ft.y);
      g.globalAlpha = 1;
    }
    if (S.placeMode) {
      g.fillStyle = "rgba(240,160,60,0.12)";
      g.fillRect(0, 0, WORLD_W, WORLD_H);
    }
  }

  function drawChest(g, ch) {
    g.fillStyle = ch.open ? "#3a3020" : "#c09030";
    g.fillRect(ch.x - 12, ch.y - 10, 24, 18);
    g.fillStyle = "#201810";
    g.fillRect(ch.x - 12, ch.y - 2, 24, 3);
    if (!ch.open) {
      g.fillStyle = "#f0d060";
      g.fillRect(ch.x - 2, ch.y - 6, 4, 6);
    }
  }

  /* CHIEF BB-V5.2 — the hero, rebuilt. He was a 14x22 slab with one dot for a face,
     drawn smaller than his own 16px hitbox. He is now built from parts — legs that
     alternate as he walks, two arms, the blue gauntlet on the throwing side, a head
     with both eyes and an outline — and sized to fill the hitbox he actually has.
     Everything is derived from HS so one number changes his whole scale. */
  var HS = 2.15;

  /* CHIEF BB-V6.1 — lifted verbatim in behaviour from Joe's own v3 build
     (artifact 9c0196b1, `function cube`). This one function is why the old game
     looked like Minecraft Dungeons and the new one looked like coloured squares:
     every solid is a lit top face, a darker front face dropped by its depth, a
     seam line where the two meet, and a dark outline. Nothing else about the art
     mattered as much as this. */
  function cube(g, x, y, w, h, z, col, outline) {
    g.fillStyle = shade(col, 0.72);
    g.fillRect(x, y + h, w, z);
    g.fillStyle = shade(col, 1.22);
    g.fillRect(x, y, w, h);
    g.fillStyle = shade(col, 0.9);
    g.fillRect(x, y + h - 2, w, 2);
    if (outline !== false) {
      g.strokeStyle = shade(col, 0.38);
      g.lineWidth = 1;
      g.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    }
  }

  function px(g, x, y, w, h, col) {
    g.fillStyle = col;
    g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  }

  /* CHIEF BB-V6.1 — the hero rebuilt on Joe's own `drawKid`: legs, body, head and
     hat each their own cube, and the idle bob (`sin(t*7)`) that made him feel alive
     standing still. Sized off HS so he keeps the scale Joe asked for, and coloured
     from the profile palette so EMBER, QUILL, NOVA and RIFT stay different people. */
  function drawPlayer(g) {
    var cos = player.cos;
    var pal = PALETTES[cos.pal] || PALETTES.ember;
    if (player.inv > 0 && Math.floor(player.inv * 12) % 2 === 0) g.globalAlpha = 0.45;

    /* Joe's own offsets, unchanged: head at 0, body at 0.55, legs at 1.15, all
       measured down from py = y - s*1.55. Only `sc` is ours, so he is the size
       Joe asked for while standing in exactly the proportions that worked. */
    var sc = 22 * HS;
    var moving = Math.hypot(player.vx || 0, player.vy || 0) > 12;
    var bob = Math.sin(S.t * 7) * (moving ? 1.4 : 0.45);
    var step = moving ? Math.sin(player.walk) : 0;
    var lift = Math.abs(step) * sc * 0.09;

    var bw = cos.body === "tall" ? 0.72 : cos.body === "round" ? 0.98 : cos.body === "swift" ? 0.7 : 0.84;
    var bh = cos.body === "tall" ? 0.86 : cos.body === "round" ? 0.56 : cos.body === "swift" ? 0.64 : 0.7;

    var x = player.x, f = player.facing;
    var pxl = x - sc * 0.5, pyt = player.y - sc * 1.55 + bob;

    g.fillStyle = "rgba(10,8,6,0.34)";
    g.beginPath(); g.ellipse(x, player.y + sc * 0.3, sc * 0.44, sc * 0.15, 0, 0, 6.3); g.fill();

    cube(g, pxl + sc * 0.12, pyt + sc * 1.15 - (step > 0 ? lift : 0), sc * 0.28, sc * 0.28, sc * 0.18, pal.b);
    cube(g, pxl + sc * 0.58, pyt + sc * 1.15 - (step < 0 ? lift : 0), sc * 0.28, sc * 0.28, sc * 0.18, pal.b);

    cube(g, pxl + sc * (0.5 - bw / 2), pyt + sc * (1.25 - bh), sc * bw, sc * bh, sc * 0.22, pal.a);

    var armA = S.aim ? S.aim.ang : (f > 0 ? -0.15 : Math.PI + 0.15);
    var ax = x + Math.cos(armA) * sc * (bw * 0.5 + 0.14);
    var ay = pyt + sc * 0.7 + Math.sin(armA) * sc * 0.2;
    cube(g, ax - sc * 0.12, ay, sc * 0.24, sc * 0.3, sc * 0.1, pal.a);
    cube(g, ax - sc * 0.16, ay + sc * 0.26, sc * 0.32, sc * 0.2, sc * 0.09, "#4a80c8");

    cube(g, pxl + sc * 0.18, pyt, sc * 0.64, sc * 0.58, sc * 0.2, pal.skin);
    g.fillStyle = "#1a1a1a";
    var e = Math.max(3, sc * 0.08), ex = f >= 0 ? e * 0.5 : -e * 0.5;
    g.fillRect(pxl + sc * 0.32 + ex, pyt + sc * 0.2, e, e);
    g.fillRect(pxl + sc * 0.52 + ex, pyt + sc * 0.2, e, e);

    drawHat(g, x, pyt, cos.hat, pal, sc);
    g.globalAlpha = 1;
  }

  /* CHIEF BB-V6.1 — hats as cubes on top of the head cube, Joe's own placement. */
  function drawHat(g, x, y, hat, pal, sc) {
    if (hat === "none") return;

  function drawBallObj(g, b, trails) {

        else if (trail === "flame") g.fillStyle = "#f08030";
        else if (trail === "ribbon") g.fillStyle = "#d0a0ff";
        else if (trail === "smoke") g.fillStyle = "#888";
        else if (trail === "pixels") g.fillStyle = "#80e0d0";

    g.fillStyle = "rgba(0,0,0,0.35)";

    g.strokeStyle = cols.seam;

  /* BB-V7.3 — the four mini-bosses were ONE branch and a colour swap, which broke

     drawn with the same cube() the hero uses. No sprite sheet, no added bytes. */
  var KNIGHT = {
    minibone:  { body: "#d8cdb4", trim: "#79808c", accent: "#c9a44c", eye: "#ff7a2a",
                 helm: "crest",  arms: "pauldron", weap: "sword",  cloak: "#5a2230" },
    miniforge: { body: "#d8843c", trim: "#5a3a2c", accent: "#ffb040", eye: "#ffd050",
                 helm: "horn",   arms: "slab",     weap: "hammer", cloak: "#4a1c14" },
    miniash:   { body: "#9a8c7c", trim: "#4a443c", accent: "#a8dce4", eye: "#9fe8f0",
                 helm: "hood",   arms: "spike",    weap: "scythe", cloak: "#2c3038" },
    minithorn: { body: "#4e8c58", trim: "#24381f", accent: "#c0e070", eye: "#d8ff80",
                 helm: "antler", arms: "bramble",  weap: "lance",  cloak: "#243a20" }

  function drawKnight(g, e) {
    var k = KNIGHT[e.type] || KNIGHT.minibone;

    cube(g, x + u * 0.10, yt + u * 1.52, u * 0.36, u * 0.38, u * 0.18, shade(k.body, 0.72));

      cube(g, x + u * 0.46, yt + u * 0.56, u * 0.40, u * 0.34, u * 0.16, k.trim);
    } else if (k.arms === "slab") {
      cube(g, x - u * 0.98, yt + u * 0.48, u * 0.50, u * 0.46, u * 0.22, k.trim);
      cube(g, x + u * 0.48, yt + u * 0.48, u * 0.50, u * 0.46, u * 0.22, k.trim);
    } else if (k.arms === "spike") {
      cube(g, x - u * 0.82, yt + u * 0.58, u * 0.34, u * 0.30, u * 0.14, k.trim);
      cube(g, x + u * 0.48, yt + u * 0.58, u * 0.34, u * 0.30, u * 0.14, k.trim);
      cube(g, x - u * 0.76, yt + u * 0.30, u * 0.12, u * 0.32, u * 0.06, k.accent);
      cube(g, x + u * 0.64, yt + u * 0.30, u * 0.12, u * 0.32, u * 0.06, k.accent);
    } else {
      cube(g, x - u * 0.84, yt + u * 0.54, u * 0.38, u * 0.32, u * 0.15, k.trim);
      cube(g, x + u * 0.46, yt + u * 0.54, u * 0.38, u * 0.32, u * 0.15, k.trim);
      cube(g, x - u * 0.92, yt + u * 0.38, u * 0.16, u * 0.20, u * 0.06, k.accent);
      cube(g, x + u * 0.76, yt + u * 0.38, u * 0.16, u * 0.20, u * 0.06, k.accent);

      cube(g, wx - u * 0.11, yt - u * 0.10 - lift, u * 0.22, u * 1.00, u * 0.10, k.trim);
      cube(g, wx - u * 0.25, yt + u * 0.80 - lift, u * 0.50, u * 0.14, u * 0.08, k.accent);

      cube(g, wx - u * 0.30, yt - u * 0.22 - lift, u * 0.60, u * 0.44, u * 0.20, k.trim);
      g.fillStyle = k.accent; g.fillRect(wx - u * 0.30, yt - u * 0.06 - lift, u * 0.60, u * 0.07);

      cube(g, wx - face * u * 0.34, yt - u * 0.44 - lift, u * 0.46, u * 0.16, u * 0.08, k.accent);
      cube(g, wx - face * u * 0.34, yt - u * 0.30 - lift, u * 0.14, u * 0.22, u * 0.06, k.accent);
    } else {
      cube(g, wx - u * 0.07, yt - u * 0.30 - lift, u * 0.14, u * 1.96, u * 0.07, shade(k.body, 0.6));

    cube(g, x - u * 0.38, yt + u * 0.06, u * 0.76, u * 0.62, u * 0.22, body);
    g.fillStyle = "#120d09";
    g.fillRect(x - u * 0.28, yt + u * 0.26, u * 0.22, u * 0.19);

    /* helm — the one silhouette a player reads from across the room */
    cube(g, x - u * 0.44, yt - u * 0.18, u * 0.88, u * 0.30, u * 0.14, k.trim);
    if (k.helm === "crest") {
      cube(g, x - u * 0.05, yt - u * 0.60, u * 0.10, u * 0.44, u * 0.05, k.accent);
      cube(g, x - u * 0.20, yt - u * 0.72, u * 0.40, u * 0.16, u * 0.06, k.accent);
      cube(g, x - u * 0.30, yt - u * 0.62, u * 0.18, u * 0.12, u * 0.05, shade(k.accent, 0.8));
    } else if (k.helm === "horn") {
      cube(g, x - u * 0.62, yt - u * 0.44, u * 0.22, u * 0.30, u * 0.10, k.accent);
      cube(g, x + u * 0.40, yt - u * 0.44, u * 0.22, u * 0.30, u * 0.10, k.accent);
      cube(g, x - u * 0.72, yt - u * 0.26, u * 0.14, u * 0.18, u * 0.06, k.accent);
      cube(g, x + u * 0.58, yt - u * 0.26, u * 0.14, u * 0.18, u * 0.06, k.accent);
    } else if (k.helm === "hood") {
      cube(g, x - u * 0.52, yt - u * 0.30, u * 1.04, u * 0.34, u * 0.12, k.cloak);
      cube(g, x - u * 0.42, yt - u * 0.46, u * 0.84, u * 0.20, u * 0.08, shade(k.cloak, 1.2));
    } else {
      cube(g, x - u * 0.30, yt - u * 0.52, u * 0.12, u * 0.36, u * 0.05, k.accent);
      cube(g, x + u * 0.18, yt - u * 0.52, u * 0.12, u * 0.36, u * 0.05, k.accent);
      cube(g, x - u * 0.52, yt - u * 0.64, u * 0.26, u * 0.10, u * 0.04, k.accent);
      cube(g, x + u * 0.26, yt - u * 0.64, u * 0.26, u * 0.10, u * 0.04, k.accent);

  function drawEnemy(g, e) {
    if (!e.alive && e.deadT <= 0) return;
    var a = !e.alive ? Math.max(0, e.deadT) : 1;
    g.globalAlpha = a;
    /* CHIEF BB-V5.2 — boss art is drawn from fixed pixel offsets, so it is scaled
       about the boss's own centre to match the radius it now carries. */
    var bossScale = e.boss === "ash" ? 1.2 : e.boss === "mini" ? 1 : e.boss ? 1.35 : 1;
    if (bossScale !== 1) { g.save(); g.translate(e.x, e.y); g.scale(bossScale, bossScale); g.translate(-e.x, -e.y); }
    if (e.boss === "ash") {
      g.fillStyle = "#2a2018";
      g.fillRect(e.x - 28, e.y - 20, 56, 48);
      g.fillStyle = "#c06030";
      g.fillRect(e.x - 22, e.y - 14, 18, 14); g.fillRect(e.x + 4, e.y - 14, 18, 14);
      g.fillStyle = "#f0a040";
      g.fillRect(e.x - 8, e.y + 4, 16, 20);
      g.fillStyle = "#1a1008";
      g.fillRect(e.x - 14, e.y - 8, 8, 6); g.fillRect(e.x + 6, e.y - 8, 8, 6);
      if (e.tell > 0) {
        g.strokeStyle = "rgba(255,80,40,0.7)";
        g.lineWidth = 3;
        g.beginPath(); g.arc(e.x, e.y, 70 + Math.sin(S.t * 12) * 6, 0, 6.3); g.stroke();
        g.fillStyle = "rgba(80,200,80,0.18)";
        g.beginPath(); g.moveTo(e.x, e.y); g.arc(e.x, e.y, 196, e.gap - 0.575, e.gap + 0.575); g.closePath(); g.fill();
        g.fillStyle = "#80f080";
        g.font = "bold 14px sans-serif"; g.textAlign = "center";
        g.fillText("GAP", e.x + Math.cos(e.gap) * 90, e.y + Math.sin(e.gap) * 90);
      }

        g.strokeStyle = "#ff6030";
        g.lineWidth = 8;
        g.beginPath();
        g.arc(e.x, e.y, e.ringR, e.gap + 0.575, e.gap - 0.575 + Math.PI * 2);
        g.stroke();
        g.strokeStyle = "#80f080";
        g.lineWidth = 6;
        g.beginPath();

      g.fillStyle = "#f4eee0";
      g.fillRect(e.x - 14, e.y - 36, 28, 22);
      g.fillStyle = "#1a120c";
      g.fillRect(e.x - 8, e.y - 28, 6, 6); g.fillRect(e.x + 2, e.y - 28, 6, 6);
      g.fillRect(e.x - 6, e.y - 18, 12, 3);

      g.fillStyle = "#245830";
      g.fillRect(e.x - 18, e.y - 10, 36, 36);
      g.fillStyle = "#50a060";
      g.fillRect(e.x - 12, e.y - 28, 24, 22);
      g.fillStyle = "#d07090";
      g.beginPath(); g.arc(e.x, e.y - 30, 8, 0, 6.3); g.fill();
      g.fillStyle = "#c0e070";
      g.fillRect(e.x - 22, e.y + 4, 8, 18); g.fillRect(e.x + 14, e.y + 4, 8, 18);

         with a lit top and a dropped front face, its own idle bob so a room of them
         breathes at different rates, and two hard dark eyes. The flat square with a
         highlight strip was a worse picture of the same thing. */
      var r = e.r, x = e.x, y = e.y;
      if (e.wob == null) e.wob = 4 + (e.seedw = (e.seedw || Math.random() * 4));
      var bob = Math.sin(S.t * e.wob + (e.bobPhase || (e.bobPhase = Math.random() * 6.3))) * r * 0.1;

      g.globalAlpha = a * 0.32;
      g.fillStyle = "#0a0806";

      g.globalAlpha = a;

      var col = e.flash > 0 ? "#ffffff" : e.col;
      if (e.kind === "swoop") {

        g.fillStyle = shade(col, 0.55);
        g.fillRect(x - r * 1.25, y - r * 0.45 + bob, r * 0.32, r * 0.5);
        g.fillRect(x + r * 0.93, y - r * 0.45 + bob, r * 0.32, r * 0.5);

        if (e.kind === "range") {

          g.fillRect(x - r * 1.05, y + r * 0.2 + bob, r * 2.1, r * 0.22);
        }

      var ez = Math.max(3, r * 0.22);
      var eo = Math.max(-1, Math.min(1, (player.x - x) / 200)) * r * 0.1;
      g.fillRect(x - r * 0.46 + eo, y - r * 0.5 + bob, ez, ez);
      g.fillRect(x + r * 0.22 + eo, y - r * 0.5 + bob, ez, ez);

       own hitbox. A knight stands about 2.8r tall, so the bar and the name landed on

      g.fillStyle = e.hp / e.maxHp > 0.35 ? "#50c060" : "#d04030";
      g.fillRect(e.x - w / 2, e.y - topOff - 10, w * Math.max(0, e.hp / e.maxHp), 4);
    }
    if (e.burn > 0 && e.alive) {
      g.fillStyle = "rgba(255,80,20,0.5)";
      g.fillRect(e.x - 6, e.y - topOff - 4, 4, 8);
    }
    g.globalAlpha = 1;
    if (e.boss && e.alive) {
      g.fillStyle = "#f0e0c0";
      g.font = "bold 12px sans-serif";
      g.textAlign = "center";
      g.fillText(e.name, e.x, e.y - topOff - 16);
    }
  }

  function drawLoot(g, it) {
    g.fillStyle = RARITY[it.rar] ? RARITY[it.rar].c : "#ccc";
    g.globalAlpha = 0.25;
    g.fillRect(it.x - 3, it.y - 40, 6, 40);
    g.globalAlpha = 1;
    if (it.kind === "ball") {
      g.fillStyle = RARITY[it.rar].c;
      g.beginPath(); g.arc(it.x, it.y, 8, 0, 6.3); g.fill();
    } else {
      g.fillStyle = "#f0d060";
      g.fillRect(it.x - 5, it.y - 5, 10, 10);
    }
  }

                point: "Aim straight at your thumb. Instant, the old feel. Twitchy close in.",

    document.getElementById("feelCard").onclick = function (ev) {

        if (S.feelFrom === "menu") { S.pause = false; showMenu(); } else showPause();

        if (player) player.spd = FEEL.spd; saveFeel(); renderFeel(); return; }
      if (b.id === "btnFeelCopy") {
        var txt = "BLOCKBALL FEEL " + JSON.stringify(FEEL);
        try { navigator.clipboard.writeText(txt); toast("Settings copied"); }
        catch (e) { toast(txt); }
