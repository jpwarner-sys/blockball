<title>BLOCKBALL</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #14110e;
    color: #e8dcc8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", ui-sans-serif, Helvetica, Arial, sans-serif;
    height: 100dvh;
    width: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  #shell {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #14110e;
    height: 100dvh;
    width: 100%;
  }
  #game {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #14110e;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
    touch-action: none;
  }
  #hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }
  #hud button, #hud input, #hud textarea, #hud .hit {
    pointer-events: auto;
  }
  #rotate {
    display: none;
    position: absolute;
    inset: 0;
    background: #14110e;
    z-index: 80;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 18px;
    text-align: center;
    padding: 28px;
  }
  #rotate.show { display: flex; }
  #rotate .phone {
    width: 54px; height: 86px; border: 4px solid #e8dcc8; border-radius: 10px;
    transform: rotate(-90deg);
    animation: spinHint 1.6s ease-in-out infinite;
  }
  @keyframes spinHint {
    0% { transform: rotate(-90deg); }
    40% { transform: rotate(0deg); }
    100% { transform: rotate(0deg); }
  }
  #install {
    display: none;
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 60;
    background: #1e1a16ee;
    color: #f0e6d4;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    font-size: 13px;
    align-items: center;
    gap: 10px;
    border-top: 2px solid #3a3328;
  }
  #install.show { display: flex; }
  #install svg { flex: 0 0 auto; }
  #install .grow { flex: 1; }
  #install button {
    background: #d06018; color: #1a120c; border: 0; font-weight: 700;
    padding: 6px 10px; border-radius: 6px; pointer-events: auto;
  }
  .panel {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: #14110ecc; z-index: 40; pointer-events: auto; padding: 12px;
  }
  .panel.show { display: flex; }
  .panel.splash { background: #14110e; }
  .card.splashCard {
    background: transparent; border: 0; box-shadow: none; padding: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%; max-height: 100%; overflow: hidden; gap: 0;
  }
  .splashTitle {
    margin: 0; font-size: clamp(30px, 7.2vw, 62px); line-height: 1; letter-spacing: 6px;
    font-weight: 800; color: #f4ead6; text-shadow: 0 3px 0 #1a120c, 0 0 18px rgba(240,140,40,0.25);
  }
  .splashArt {
    display: block; width: auto; height: auto;
    max-width: min(92vw, 640px); max-height: 52vh;
    margin: 10px 0; border: 3px solid #4a4032; background: #14110e;
  }
  .splashGo {
    margin-top: 16px; font-size: 14px; letter-spacing: 3px; font-weight: 800; color: #c4b49a;
    animation: goPulse 1.5s ease-in-out infinite;
  }
  @keyframes goPulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  @media (max-height: 520px) {
    .splashTitle { font-size: clamp(20px, 5vw, 38px); letter-spacing: 4px; text-shadow: 0 2px 0 #1a120c; }
    .splashArt { max-height: 62vh; max-width: min(88vw, 560px); margin: 5px 0; border-width: 2px; }
    .splashGo { margin-top: 8px; font-size: 12px; letter-spacing: 2px; }
  }
  .card {
    background: #221c16; border: 3px solid #4a4032; max-width: 920px; width: min(920px, 96%);
    max-height: 94%; overflow: auto; padding: 16px 18px; box-shadow: 0 0 0 4px #14110e;
  }
  .card h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 1px; }
  .card h1.title { line-height: 0.92; letter-spacing: 3px; font-size: 34px; margin-bottom: 12px; }
  .card h1.title { text-align: center; }
  .card h1.tTop { margin: 2px 0 6px; }
  .card h1.tBot { margin: 6px 0 10px; }
  #titleArt { display: block; width: 100%; max-width: 620px; margin: 0 auto; border: 3px solid #4a4032; background: #14110e; }
  .card h2 { margin: 12px 0 8px; font-size: 16px; color: #c4b49a; font-weight: 700; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button.bb, .bb {
    background: #3a3026; color: #f0e6d4; border: 2px solid #6a5a44; padding: 8px 12px;
    font-weight: 700; font-size: 14px; border-radius: 4px; cursor: pointer;
  }
  button.bb.pri { background: #d06018; color: #1a120c; border-color: #f0a050; }
  button.bb.good { background: #2f5a38; border-color: #6aad6a; }
  button.bb.warn { background: #5a2a22; border-color: #c06048; }
  button.bb.on { outline: 2px solid #f0a050; }
  input.bb, textarea.bb {
    background: #14110e; color: #f0e6d4; border: 2px solid #6a5a44; padding: 8px;
    font: 14px ui-monospace, Menlo, monospace; border-radius: 4px;
  }
  .muted { color: #9a8c78; font-size: 13px; }
  .swatch { width: 28px; height: 28px; border: 2px solid #111; display: inline-block; }
  #toasts {
    position: absolute; right: calc(12px + env(safe-area-inset-right));
    top: calc(48px + env(safe-area-inset-top));
    display: flex; flex-direction: column; gap: 6px; pointer-events: none; z-index: 30;
  }
  .toast {
    background: #2a2218ee; border: 2px solid #d06018; padding: 6px 10px; font-weight: 800;
    font-size: 14px; color: #ffe8c0;
  }
  #topbar, #botbar {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
    pointer-events: none;
  }
  #topbar { pointer-events: none; }
  #botbar { position: absolute; left: 0; right: 0; bottom: 0;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    pointer-events: none;
  }
  .chip {
    background: #1a1612cc; border: 2px solid #4a4032; padding: 4px 8px; font-weight: 800;
    font-size: 13px; pointer-events: auto;
  }
  #copybox { width: 100%; min-height: 72px; }
</style>
</head>
<body>
<div id="shell">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hud">
    <div id="topbar">
      <div class="row">
        <div class="chip" id="hpChip">HP 5/5</div>
        <div class="chip" id="frChip">FRAG 0</div>
        <div class="chip" id="flChip">FLOOR 1</div>
        <div class="chip" id="scChip">SCORE 0</div>
      </div>
      <div class="row">
        <button class="bb" id="btnPause">PAUSE</button>
      </div>
    </div>
    <div id="botbar">
      <div class="row">
        <button class="bb" id="btnBlock">BLOCK 3</button>
        <div class="chip" id="ballChip">BALL CLASSIC</div>
        <div class="chip" id="seedChip">SEED —</div>
      </div>
      <div class="row">
        <button class="bb" id="btnShop">UPGRADE</button>
      </div>
    </div>
    <div id="toasts"></div>
  </div>
  <div id="install">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
      <rect x="4" y="8" width="14" height="12" rx="2" fill="none" stroke="#f0e6d4" stroke-width="2"/>
      <path d="M11 2 v10" stroke="#f0e6d4" stroke-width="2" fill="none"/>
      <path d="M7 6 l4 -4 l4 4" stroke="#f0e6d4" stroke-width="2" fill="none"/>
    </svg>
    <div class="grow"><b>Add to Home Screen</b> for the full app — tap Share, then Add to Home Screen.</div>
    <button id="btnInstallX" type="button">OK</button>
  </div>
  <div id="rotate"><div class="phone"></div><div style="font-size:22px;font-weight:800">Rotate to play</div><div class="muted">BLOCKBALL is a landscape game. Turn the device on its side.</div></div>
  <div class="panel splash" id="splashPanel"><div class="card splashCard" id="splashCard"></div></div>
  <div class="panel" id="menuPanel"><div class="card" id="menuCard"></div></div>
  <div class="panel" id="pausePanel"><div class="card" id="pauseCard"></div></div>
  <div class="panel" id="shopPanel"><div class="card" id="shopCard"></div></div>
  <div class="panel" id="passPanel"><div class="card" id="passCard"></div></div>
  <div class="panel" id="floorPanel"><div class="card" id="floorCard"></div></div>
  <div class="panel" id="builderPanel"><div class="card" id="builderCard"></div></div>
</div>

  function lsGet(k) {
    try { return localStorage.getItem(k); } catch (e) { return null; }
  }
  function lsSet(k, v) {

  function loadStore() {

      if (!raw) return;
      var o = JSON.parse(raw);
      if (o.bestFloor) store.bestFloor = o.bestFloor;
      if (o.trickKills) store.trickKills = o.trickKills;
      if (o.stash) store.stash = o.stash;
      if (o.profiles) store.profiles = o.profiles;
      if (o.installHide) store.installHide = true;
      if (o.aimHelp) store.aimHelp = true;
      S.seenAimHelp = !!o.aimHelp;
    } catch (e) {}
  }

  }

  function hashStr(s) {
    var h = 2166136261;
    s = String(s).toUpperCase();
    for (var i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
    return h >>> 0;
  }
  function mulberry(seed) {
    var a = seed >>> 0;
    return function () {
      a = a + 0x6D2B79F5 >>> 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function makeSeed() {
    var n = Math.floor(Math.random() * 1679616);
    var p = n.toString(36).toUpperCase();
    while (p.length < 4) p = "0" + p;
    return "BLK-" + p;
  }
  function parseSeed(s) {
    s = String(s || "").trim().toUpperCase();
    if (!s) return makeSeed();
    if (s.indexOf("BLK-") !== 0) s = "BLK-" + s.replace(/[^A-Z0-9]/g, "").slice(0, 6);
    return s.slice(0, 12);
  }

  var rng = mulberry(1);
  function rnd() { return rng(); }
  function irnd(a, b) { return a + Math.floor(rnd() * (b - a + 1)); }
  function pick(a) { return a[Math.floor(rnd() * a.length)]; }
  function seedRng(extra) { rng = mulberry(hashStr(S.seed + ":" + extra)); }

  var audioCtx = null;
  function ensureAudio() {
    if (audioCtx) return audioCtx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
    return audioCtx;
  }
  function beep(type, freq, dur, vol, slide) {
    if (S.muteFx > 0) return;
    var ac = ensureAudio();
    if (!ac) return;
    var o = ac.createOscillator();
    var g = ac.createGain();
    o.type = type || "square";
    o.frequency.value = freq;
    if (slide) o.frequency.linearRampToValueAtTime(slide, ac.currentTime + dur);
    g.gain.value = vol || 0.06;
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start();
    o.stop(ac.currentTime + dur);
  }
  function sfx(name) {
    if (name === "throw") beep("triangle", 180, 0.08, 0.05, 90);
    else if (name === "bounce") beep("square", 220, 0.05, 0.04, 140);
    else if (name === "hit") beep("sawtooth", 140, 0.07, 0.06, 60);
    else if (name === "kill") beep("square", 320, 0.12, 0.07, 520);
    else if (name === "trick") { beep("square", 440, 0.16, 0.08, 880); beep("triangle", 660, 0.2, 0.05, 1320); }
    else if (name === "loot") beep("sine", 520, 0.14, 0.06, 780);
    else if (name === "pickup") beep("sine", 660, 0.1, 0.07, 990);
    else if (name === "hurt") beep("sawtooth", 110, 0.18, 0.08, 40);
    else if (name === "place") beep("square", 90, 0.06, 0.05);
    else if (name === "boss") beep("sawtooth", 70, 0.4, 0.09, 30);
    else if (name === "win") { beep("square", 330, 0.2, 0.07, 660); setTimeout(function(){ beep("square", 440, 0.25, 0.07, 880); }, 180); }
    else if (name === "ui") beep("square", 400, 0.04, 0.03);
  }

    if (n >= 1000000) return (n / 1000000).toFixed(n >= 10000000 ? 0 : 1) + "M";

  var AFFIX = ["Fire", "Split", "Heavy", "Homing", "Chain"];

  function rarityForFloor(fl) {
    var r = rnd();
    if (fl >= 8 && r < 0.06) return "legendary";
    if (fl >= 5 && r < 0.16) return "epic";

  var player, ball, room;

  function freshPlayer() {

    return {
      x: 120, y: 270, r: 16,
hp: 5, maxHp: 5,

  function currentDmg() {

  function resetBallHome() {
    ball = {
      live: false, ret: false, x: player.x, y: player.y - 22, vx: 0, vy: 0, r: 9,

  /* ---------- room pieces (handmade) ---------- */
  function blankGrid(v) {
    var g = [];
    for (var y = 0; y < ROWS; y++) {
      g[y] = [];
      for (var x = 0; x < COLS; x++) g[y][x] = v || 0;
    }
    return g;
  }
  function stampBorder(g) {
    for (var x = 0; x < COLS; x++) { g[0][x] = 1; g[ROWS - 1][x] = 1; }
    for (var y = 0; y < ROWS; y++) { g[y][0] = 1; g[y][COLS - 1] = 1; }
  }
  function carveDoor(g, side) {
    if (side === "e") { g[8][COLS - 1] = 0; g[9][COLS - 1] = 0; }
    if (side === "w") { g[8][0] = 0; g[9][0] = 0; }
    if (side === "n") { g[0][15] = 0; g[0][16] = 0; }
    if (side === "s") { g[ROWS - 1][15] = 0; g[ROWS - 1][16] = 0; }
  }
  function rectWall(g, x, y, w, h) {
    for (var j = y; j < y + h; j++) for (var i = x; i < x + w; i++) if (g[j] && g[j][i] !== undefined) g[j][i] = 1;
  }

  var PIECES = {
    arena: function (g) { stampBorder(g); },
    pillars: function (g) {
      stampBorder(g);
      rectWall(g, 8, 5, 2, 2); rectWall(g, 22, 5, 2, 2);
      rectWall(g, 8, 11, 2, 2); rectWall(g, 22, 11, 2, 2);
    },
    aisle: function (g) {
      stampBorder(g);
      rectWall(g, 10, 1, 2, 7); rectWall(g, 20, 10, 2, 7);
    },
    corners: function (g) {
      stampBorder(g);
      rectWall(g, 1, 1, 6, 4); rectWall(g, 25, 1, 6, 4);
      rectWall(g, 1, 13, 6, 4); rectWall(g, 25, 13, 6, 4);
    },
    diamond: function (g) {
      stampBorder(g);
      rectWall(g, 14, 4, 4, 2); rectWall(g, 14, 12, 4, 2);
      rectWall(g, 10, 8, 3, 2); rectWall(g, 19, 8, 3, 2);
    },
    teeth: function (g) {
      stampBorder(g);
      for (var i = 4; i < 28; i += 5) rectWall(g, i, i % 10 < 5 ? 4 : 12, 2, 2);
    },
    hallH: function (g) {
      for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) g[y][x] = (y < 6 || y > 11) ? 1 : 0;
      stampBorder(g);
      for (var x2 = 1; x2 < COLS - 1; x2++) { g[6][x2] = 1; g[11][x2] = 1; }
      for (var x3 = 1; x3 < COLS - 1; x3++) { g[7][x3] = 0; g[8][x3] = 0; g[9][x3] = 0; g[10][x3] = 0; }
    },
    hallV: function (g) {
      for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) g[y][x] = (x < 12 || x > 19) ? 1 : 0;
      stampBorder(g);
      for (var y2 = 1; y2 < ROWS - 1; y2++) { g[y2][12] = 1; g[y2][19] = 1; g[y2][13] = 0; g[y2][14] = 0; g[y2][15] = 0; g[y2][16] = 0; g[y2][17] = 0; g[y2][18] = 0; }
    },
    choke: function (g) {
      stampBorder(g);
      rectWall(g, 1, 1, 13, 6); rectWall(g, 18, 11, 13, 6);
      g[8][14] = 0; g[9][14] = 0; g[8][15] = 0; g[9][15] = 0; g[8][16] = 0; g[9][16] = 0; g[8][17] = 0; g[9][17] = 0;
    },
    boss: function (g) {
      stampBorder(g);
      rectWall(g, 3, 3, 2, 2); rectWall(g, 27, 3, 2, 2);
      rectWall(g, 3, 13, 2, 2); rectWall(g, 27, 13, 2, 2);
    }
  };

  var BIOME = [
    { id: "crypt", name: "CRYPT", walls: ["#3a342c", "#2a2620"], floor: ["#1c1814", "#161310"], roster: ["slime", "bat", "skel", "archer"] },
    { id: "forge", name: "FORGE", walls: ["#4a3020", "#3a2010"], floor: ["#221410", "#1a100c"], roster: ["imp", "cinder", "grunt", "spit"] },
    { id: "ash", name: "ASHEN", walls: ["#3a3830", "#2c2418"], floor: ["#1a1610", "#14120e"], roster: ["wraith", "ashling", "charger", "voider"] },
    { id: "thorn", name: "THORN", walls: ["#243424", "#1a2818"], floor: ["#101810", "#0c140c"], roster: ["briar", "spitter", "golem", "witchling"] }
  ];
  function biomeOf(fl) {
    if (fl <= 4) return BIOME[0];
    if (fl <= 8) return BIOME[1];
    if (fl <= 12) return BIOME[2];
    return BIOME[3];
  }

  function enemyDef(type) {
    var T = {
      slime: { hp: 12, r: 14, spd: 28, kind: "chase", col: "#6aaa3a", name: "SLIME" },
      bat: { hp: 8, r: 10, spd: 70, kind: "swoop", col: "#8878a8", name: "BAT" },
      skel: { hp: 18, r: 13, spd: 36, kind: "chase", col: "#d0d0c0", name: "SKEL" },
      archer: { hp: 14, r: 12, spd: 10, kind: "range", col: "#c08050", name: "ARCHER" },
      imp: { hp: 16, r: 12, spd: 50, kind: "chase", col: "#d04028", name: "IMP" },
      cinder: { hp: 10, r: 11, spd: 40, kind: "orbit", col: "#f08030", name: "CINDER" },
      grunt: { hp: 28, r: 16, spd: 24, kind: "chase", col: "#8a6040", name: "GRUNT" },
      spit: { hp: 18, r: 13, spd: 12, kind: "range", col: "#e06020", name: "SPITTER" },
      wraith: { hp: 22, r: 14, spd: 44, kind: "swoop", col: "#6070a8", name: "WRAITH" },
      ashling: { hp: 20, r: 12, spd: 38, kind: "chase", col: "#a09080", name: "ASHLING" },
      charger: { hp: 26, r: 15, spd: 90, kind: "charge", col: "#c05040", name: "CHARGER" },
      voider: { hp: 24, r: 13, spd: 14, kind: "range", col: "#503878", name: "VOIDER" },
      briar: { hp: 30, r: 15, spd: 22, kind: "chase", col: "#3a8040", name: "BRIAR" },
      spitter: { hp: 22, r: 13, spd: 12, kind: "range", col: "#80b040", name: "NEEDLE" },
      golem: { hp: 48, r: 18, spd: 16, kind: "chase", col: "#687060", name: "GOLEM" },
      witchling: { hp: 26, r: 12, spd: 34, kind: "orbit", col: "#70a058", name: "WITCHLING" },
      boneking: { hp: 220, r: 28, spd: 22, kind: "boss", col: "#e8e0d0", name: "BONE KING", boss: "bone" },
      ashtitan: { hp: 420, r: 34, spd: 16, kind: "boss", col: "#c06030", name: "ASH TITAN", boss: "ash" },
      thornqueen: { hp: 640, r: 30, spd: 20, kind: "boss", col: "#50a060", name: "THORN QUEEN", boss: "thorn" },
      minibone: { hp: 90, r: 22, spd: 24, kind: "boss", col: "#c8b898", name: "BONE KNIGHT", boss: "mini" },
      miniforge: { hp: 110, r: 22, spd: 20, kind: "boss", col: "#d07030", name: "SLAG KNIGHT", boss: "mini" },
      miniash: { hp: 140, r: 23, spd: 22, kind: "boss", col: "#908070", name: "ASH KNIGHT", boss: "mini" },
      minithorn: { hp: 160, r: 23, spd: 20, kind: "boss", col: "#407848", name: "THORN KNIGHT", boss: "mini" }
    };
    return T[type] || T.slime;
  }

  function spawnEnemy(type, x, y, fl, isBoss) {
    var d = enemyDef(type);
    var hp = scaleStat(d.hp, fl);
    return {
      type: type, name: d.name, x: x, y: y, r: d.r, hp: hp, maxHp: hp,
      spd: d.spd, kind: d.kind, col: d.col, boss: d.boss || null,
      cd: rnd() * 1.2, stun: 0, burn: 0, alive: true, vx: 0, vy: 0,
      phase: 0, tell: 0, gap: 0, ringR: 0, ringOn: false, deadT: 0,
      facing: 1
    };
  }

  function buildFloor(fl) {
    seedRng("F" + fl);
    var bio = biomeOf(fl);
    var isBossFloor = fl % 5 === 0;
    var nRooms = isBossFloor ? irnd(3, 4) : irnd(3, 5);
    var list = [];
    var roomPool = ["arena", "pillars", "aisle", "corners", "diamond", "teeth", "choke"];
    var hallPool = ["hallH", "hallV"];
    for (var i = 0; i < nRooms; i++) {
      var last = i === nRooms - 1;
      var kind, piece;
      if (last && isBossFloor) { kind = "boss"; piece = "boss"; }
      else if (last) { kind = "mini"; piece = pick(["arena", "pillars", "boss"]); }
      else if (i > 0 && i < nRooms - 1 && rnd() < 0.42) { kind = "corridor"; piece = pick(hallPool); }
      else { kind = "room"; piece = pick(roomPool); }
      var g = blankGrid(0);
      PIECES[piece](g);
      if (i === 0) carveDoor(g, "e");
      else if (last) carveDoor(g, "w");
      else { carveDoor(g, "w"); carveDoor(g, "e"); }
      var ents = [];
      if (kind === "boss") {
        var btype = fl % 15 === 0 ? "thornqueen" : fl % 10 === 0 ? "ashtitan" : "boneking";
        ents.push({ kind: "enemy", type: btype, tx: 22, ty: 9 });
      } else if (kind === "mini") {
        var mt = bio.id === "crypt" ? "minibone" : bio.id === "forge" ? "miniforge" : bio.id === "ash" ? "miniash" : "minithorn";
        ents.push({ kind: "enemy", type: mt, tx: 20, ty: 9 });
        if (rnd() < 0.5) ents.push({ kind: "chest", tx: 26, ty: 9 });
      } else if (kind === "corridor") {
        var cN = 1 + (fl > 4 ? 1 : 0);
        for (var c = 0; c < cN; c++) ents.push({ kind: "enemy", type: pick(bio.roster), tx: irnd(6, 26), ty: piece === "hallH" ? irnd(7, 10) : irnd(3, 14) });
      } else {
        var budget = 2 + Math.min(4, Math.floor(fl / 3));
        if (piece === "choke") budget = Math.max(2, budget - 1);
        for (var e = 0; e < budget; e++) {
          ents.push({ kind: "enemy", type: pick(bio.roster), tx: irnd(10, 28), ty: irnd(3, 14) });
        }
        if (rnd() < 0.45) ents.push({ kind: "chest", tx: irnd(20, 28), ty: irnd(3, 14) });
      }
      list.push({ piece: piece, kind: kind, grid: g, ents: ents, cleared: false, blocks: [] });
    }
    return list;
  }

  function tileAt(g, x, y) {
    var tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);
    if (ty < 0 || tx < 0 || ty >= ROWS || tx >= COLS) return 1;
    return g[ty][tx];
  }
  function circleBlocked(g, blocks, x, y, r) {
    if (tileAt(g, x - r, y) || tileAt(g, x + r, y) || tileAt(g, x, y - r) || tileAt(g, x, y + r) || tileAt(g, x, y)) return true;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (Math.abs(x - b.x) < r + TILE * 0.45 && Math.abs(y - b.y) < r + TILE * 0.45) return true;
    }
    return false;
  }
  function resolveCircle(g, blocks, o) {
    if (!circleBlocked(g, blocks, o.x, o.y, o.r)) return false;
    var hit = false;
    if (tileAt(g, o.x + o.r, o.y) || tileAt(g, o.x - o.r, o.y) || blockHit(blocks, o.x, o.y, o.r, true)) {
      o.x -= o.vx * DT * 1.1; o.vx *= -1; hit = true;
    }
    if (tileAt(g, o.x, o.y + o.r) || tileAt(g, o.x, o.y - o.r) || blockHit(blocks, o.x, o.y, o.r, false)) {
      o.y -= o.vy * DT * 1.1; o.vy *= -1; hit = true;
    }
    if (circleBlocked(g, blocks, o.x, o.y, o.r)) {
      o.x -= o.vx * DT; o.y -= o.vy * DT;
    }
    return hit;
  }
  function blockHit(blocks, x, y, r, horiz) {
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (Math.abs(x - b.x) < r + TILE * 0.45 && Math.abs(y - b.y) < r + TILE * 0.45) return true;
    }
    return false;
  }

  function loadRoom(idx) {
    S.roomI = idx;
    var spec = S.rooms[idx];
    var ents = [];
    var chests = [];
    for (var i = 0; i < spec.ents.length; i++) {
      var e = spec.ents[i];
      var x = (e.tx + 0.5) * TILE, y = (e.ty + 0.5) * TILE;
      if (e.kind === "enemy") ents.push(spawnEnemy(e.type, x, y, S.floor, spec.kind === "boss"));
      else if (e.kind === "chest") chests.push({ x: x, y: y, open: false, r: 14 });
    }
    room = {
      spec: spec,
      grid: spec.grid,
      enemies: ents,
      chests: chests,
      blocks: spec.blocks.slice(),
      kind: spec.kind,
      cleared: spec.cleared,
      doorReady: spec.cleared,
      spawnX: spec.kind === "corridor" && spec.piece === "hallV" ? 16 * TILE : 3.5 * TILE,
      spawnY: spec.piece === "hallH" ? 9 * TILE : 9 * TILE
    };
    var spawnEnt = spec.ents.filter(function (e) { return e.kind === "spawn"; })[0];
    if (spawnEnt) {
      room.spawnX = (spawnEnt.tx + 0.5) * TILE;
      room.spawnY = (spawnEnt.ty + 0.5) * TILE;
    }
    player.x = room.spawnX; player.y = room.spawnY;
    player.blockStock = player.blockMax;
    player.inv = 0.6;
    resetBallHome();
    S.placeMode = false;
    S.shots = []; S.splits = [];
    room.clearWait = 0;
    if (!ents.length) { room.cleared = true; room.doorReady = true; }
    if (!S.seenAimHelp) toast("DRAG to aim · RELEASE to throw");
  }

  function startRun(seed, pass, custom) {
    S.seed = parseSeed(seed || makeSeed());
    S.floor = 1;
    S.score = 0;
    S.runTricks = 0;
    S.passPlay = !!pass;
    S.passWho = 0;
    S.customPlay = !!custom;
    S.builderLevel = custom || null;
    player = freshPlayer();
    player.ballAffix = [];
    if (custom) {
      S.rooms = [customToRoom(custom)];
    } else {
      S.rooms = buildFloor(1);
    }
    loadRoom(0);
    S.mode = "play";
    hidePanels();
    syncHud();
    toast("SEED " + S.seed);
  }

  function customToRoom(lv) {
    var g = blankGrid(0);
    var ents = [];
    var data = lv.t || "";
    for (var i = 0; i < COLS * ROWS; i++) {
      var x = i % COLS, y = Math.floor(i / COLS);
      var ch = data.charAt(i);
      if (ch === "1") g[y][x] = 1;
      else g[y][x] = 0;
    }
    stampBorder(g);
    (lv.e || []).forEach(function (e) {
      ents.push(e);
    });
    return { piece: "custom", kind: "room", grid: g, ents: ents, cleared: false, blocks: [], name: lv.n || "CUSTOM" };
  }

  function nextRoomOrFloor() {
    S.rooms[S.roomI].cleared = true;
    if (S.roomI < S.rooms.length - 1) {
      loadRoom(S.roomI + 1);
      toast("NEXT HALL");
      return;
    }
    if (S.customPlay) {
      toast("LEVEL CLEAR");
      S.mode = "menu";
      showMenu();
      return;
    }
    var wasBoss = S.rooms[S.roomI].kind === "boss";
    if (S.floor > store.bestFloor) store.bestFloor = S.floor;
    saveStore();
    if (S.passPlay) {
      S.passWho = 1 - S.passWho;
      showPassCard();
    }
    S.floor += 1;
    S.rooms = buildFloor(S.floor);
    showFloorCard(wasBoss);
  }

  /* ---------- combat ---------- */
  function hurtPlayer(n) {
    if (player.inv > 0) return;
    player.hp -= n;
    player.inv = 0.9;
    S.shake = 0.25;
    sfx("hurt");
    floatTxt(player.x, player.y - 24, "-" + n, "#ff8060");
    if (player.hp <= 0) {
      player.hp = 0;
      toast("DOWN — room reset, loot kept");
      player.hp = player.maxHp;
      loadRoom(S.roomI);
    }
  }

  function killEnemy(en, trick) {
    en.alive = false;
    en.deadT = 1.2;
    S.score += 10 * S.floor * (trick ? 3 : 1);
    player.frag += 1 + Math.floor(S.floor / 3);
    sfx(trick ? "trick" : "kill");
    burst(en.x, en.y, en.col, trick ? 22 : 10);
    if (rnd() < 0.62 || en.boss) dropLoot(en.x, en.y, !!en.boss);
    if (en.boss === "ash" || en.boss === "bone" || en.boss === "thorn") startBossDeath(en);
  }

  function startBossDeath(en) {
    S.bossBeat = 2.4;
    S.muteFx = 0.5;
    S.shake = 0.6;
    sfx("boss");
    for (var i = 0; i < 10; i++) {
      (function (k) {
        setTimeout(function () { dropLoot(en.x + irnd(-40, 40), en.y + irnd(-30, 30), true); }, 80 * k);
      })(i);
    }
  }

  function dropLoot(x, y, rich) {
    var table = rnd();
    var it;
    if (rich || table > 0.55) {
      var aff = [];
      var n = rich ? irnd(1, 2) : (rnd() < 0.5 ? 1 : 0);
      for (var i = 0; i < n; i++) aff.push(pick(AFFIX));
      it = { kind: "ball", x: x, y: y, r: 10, vy: -40, life: 12, rar: rich ? (rnd() < 0.4 ? "legendary" : "epic") : rarityForFloor(S.floor), affix: aff, taken: false };
    } else {
      it = { kind: "frag", x: x, y: y, r: 8, vy: -30, life: 10, rar: "common", n: irnd(1, 3), taken: false };
    }
    S.loot.push(it);
    sfx("loot");
  }

  function takeLoot(it) {
    if (it.taken) return;
    it.taken = true;
    sfx("pickup");
    if (it.kind === "frag") {
      player.frag += it.n || 1;
      floatTxt(it.x, it.y, "+" + (it.n || 1) + " FRAG", "#f0d080");
    } else {
      player.ballAffix = it.affix.slice();
      store.stash.unshift({ affix: it.affix.slice(), rar: it.rar });
      if (store.stash.length > 8) store.stash.pop();
      saveStore();
      floatTxt(it.x, it.y, (it.affix[0] || "BALL") + " " + it.rar.toUpperCase(), RARITY[it.rar].c);
      toast((it.affix.join("+") || "PLAIN") + " · " + it.rar);
    }
  }

  function hasAff(name) {
    if (name === "Fire" && player.permaFire) return true;
    return ball.affix && ball.affix.indexOf(name) >= 0;
  }

  function hitEnemy(en, src, dmg, isSplit) {
    if (!en.alive) return;
    if (src.hits && src.hits.indexOf(en) >= 0 && !isSplit) return;
    if (src.hits) src.hits.push(en);
    var mul = 1;
    if (hasAff("Heavy") && src === ball) mul += 0.7;
    var dealt = Math.max(1, Math.floor(dmg * mul));
    en.hp -= dealt;
    en.stun = Math.max(en.stun, 0.12);
    floatTxt(en.x, en.y - en.r - 8, fmt(dealt), "#fff2c0");
    sfx("hit");
    burst(en.x, en.y, "#f0c070", 4);
    if (hasAff("Fire") && src === ball) en.burn = Math.max(en.burn, 2.2);
    if (hasAff("Chain") && src === ball) {
      var nxt = nearestEnemy(en.x, en.y, en);
      if (nxt) {
        var bolt = { x: nxt.x, y: nxt.y, from: en, to: nxt, t: 0.15 };
        S.pops.push(bolt);
        hitEnemy(nxt, { hits: [en] }, Math.floor(dealt * 0.6), true);
      }
    }
    if (en.hp <= 0) {
      var trick = src === ball && ball.hits && ball.hits.length >= 2;
      if (trick) {
        S.runTricks += 1;
        store.trickKills += 1;
        S.trickAll = store.trickKills;
        saveStore();
        floatTxt(en.x, en.y - 36, "TRICK KILL", "#ffd24a");
        S.shake = 0.35;
      }
      killEnemy(en, trick);
    }
  }

  function nearestEnemy(x, y, skip) {
    var best = null, bd = 90;
    for (var i = 0; i < room.enemies.length; i++) {
      var e = room.enemies[i];
      if (!e.alive || e === skip) continue;
      var d = Math.hypot(e.x - x, e.y - y);
      if (d < bd) { bd = d; best = e; }
    }
    return best;
  }

  function throwBall(ang, pow) {
    if (ball.live) return;
    var spd = throwSpeed() * pow;
    ball.live = true; ball.ret = false;
    ball.x = player.x + Math.cos(ang) * 20;
    ball.y = player.y + Math.sin(ang) * 20;
    ball.vx = Math.cos(ang) * spd;
    ball.vy = Math.sin(ang) * spd;
    ball.life = 2.6; ball.bounces = 0; ball.hits = [];
    ball.dmg = currentDmg();
    ball.affix = (player.ballAffix || []).slice();
    ball.trail = [];
    sfx("throw");
    if (!S.seenAimHelp) { S.seenAimHelp = true; store.aimHelp = true; saveStore(); }
  }

  function updateBall(dt) {
    if (!ball.live) {
      ball.x = player.x + player.facing * 8;
      ball.y = player.y - 20;
      return;
    }
    if (ball.ret) {
      var dx = player.x - ball.x, dy = player.y - 18 - ball.y;
      var d = Math.hypot(dx, dy) || 1;
      ball.vx = dx / d * 520; ball.vy = dy / d * 520;
      ball.x += ball.vx * dt; ball.y += ball.vy * dt;
      if (d < 18) { ball.live = false; ball.ret = false; }
      return;
    }
    if (hasAff("Homing")) {
      var t = nearestEnemy(ball.x, ball.y, null);
      if (t) {
        var ang = Math.atan2(t.y - ball.y, t.x - ball.x);
        var spd = Math.hypot(ball.vx, ball.vy);
        var cx = Math.cos(ang) * spd, cy = Math.sin(ang) * spd;
        ball.vx = ball.vx * 0.92 + cx * 0.08;
        ball.vy = ball.vy * 0.92 + cy * 0.08;
      }
    }
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;
    ball.life -= dt;
    if (resolveCircle(room.grid, room.blocks, ball)) {
      ball.bounces += 1;
      sfx("bounce");
      if (hasAff("Split") && ball.bounces === 1) spawnSplit();
    }
    for (var i = 0; i < room.enemies.length; i++) {
      var e = room.enemies[i];
      if (!e.alive) continue;
      if (Math.hypot(e.x - ball.x, e.y - ball.y) < e.r + ball.r) {
        hitEnemy(e, ball, ball.dmg, false);
        if (hasAff("Split") && ball.hits.length === 1) spawnSplit();
        if (hasAff("Heavy")) { ball.vx *= 0.85; ball.vy *= 0.85; }
      }
    }
    ball.trail.push({ x: ball.x, y: ball.y, t: 0.25 });
    if (ball.trail.length > 14) ball.trail.shift();
    if (ball.life <= 0 || ball.bounces >= 9 || Math.hypot(ball.vx, ball.vy) < 40) ball.ret = true;
  }

  function spawnSplit() {
    for (var i = -1; i <= 1; i += 2) {
var a = Math.atan2(ball.vy, ball.vx) + i * 0.5;
      S.splits.push({ x: ball.x, y: ball.y, vx: Math.cos(a) * 380, vy: Math.sin(a) * 380, r: 6, life: 0.7, hits: [] });
    }
  }

  function updateSplits(dt) {
    for (var i = S.splits.length - 1; i >= 0; i--) {
      var s = S.splits[i];
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      resolveCircle(room.grid, room.blocks, s);
      for (var j = 0; j < room.enemies.length; j++) {
        var e = room.enemies[j];
        if (e.alive && Math.hypot(e.x - s.x, e.y - s.y) < e.r + s.r) hitEnemy(e, s, Math.floor(currentDmg() * 0.45), true);
      }
      if (s.life <= 0) S.splits.splice(i, 1);
    }
  }

  function aimGuide(ang, pow) {
    var pts = [];
    var x = player.x + Math.cos(ang) * 20, y = player.y + Math.sin(ang) * 20;
    var vx = Math.cos(ang), vy = Math.sin(ang);
    pts.push({ x: x, y: y });
    var bounced = false;
    for (var i = 0; i < 90; i++) {
      x += vx * 8; y += vy * 8;
      if (tileAt(room.grid, x, y) || blockHit(room.blocks, x, y, 6, true)) {
        var hx = tileAt(room.grid, x + vx * 8, y) || blockHit(room.blocks, x + 4, y, 6, true);
        var hy = tileAt(room.grid, x, y + vy * 8) || blockHit(room.blocks, x, y + 4, 6, false);
        if (hx) vx *= -1;
        if (hy) vy *= -1;
        if (!hx && !hy) { vx *= -1; vy *= -1; }
        bounced = true;
        pts.push({ x: x, y: y, bounce: true });
        if (pts.length > 2) break;
      }
      if (i % 2 === 0) pts.push({ x: x, y: y });
      if (bounced && pts.length > 8) break;
    }
    return pts;
  }

  /* ---------- AI ---------- */
  function updateEnemies(dt) {
    var living = 0;
    for (var i = 0; i < room.enemies.length; i++) {
      var e = room.enemies[i];
      if (!e.alive) {
        e.deadT -= dt;
        continue;
      }
      living++;
      if (e.burn > 0) {
        e.burn -= dt;
        if (Math.floor(e.burn * 8) !== Math.floor((e.burn + dt) * 8)) {
          e.hp -= Math.max(1, Math.floor(currentDmg() * 0.08));
          if (e.hp <= 0) killEnemy(e, false);
        }
      }
      if (e.stun > 0) { e.stun -= dt; continue; }
      e.cd -= dt;
      var dx = player.x - e.x, dy = player.y - e.y;
      var dist = Math.hypot(dx, dy) || 1;
      e.facing = dx < 0 ? -1 : 1;
      if (e.boss) { updateBoss(e, dt, dx, dy, dist); }
      else if (e.kind === "chase") moveToward(e, dx / dist, dy / dist, e.spd, dt);
      else if (e.kind === "swoop") {
        e.phase += dt;
        moveToward(e, Math.cos(e.phase * 3) * 0.6 + dx / dist, Math.sin(e.phase * 2) * 0.6 + dy / dist, e.spd, dt);
      } else if (e.kind === "orbit") {
        e.phase += dt;
        var ox = Math.cos(e.phase) * 80, oy = Math.sin(e.phase) * 80;
        moveToward(e, (player.x + ox - e.x) / 40, (player.y + oy - e.y) / 40, e.spd, dt);
      } else if (e.kind === "charge") {
        if (e.cd <= 0) { e.vx = dx / dist * e.spd * 3; e.vy = dy / dist * e.spd * 3; e.cd = 1.8; }
        e.x += e.vx * dt; e.y += e.vy * dt;
        e.vx *= 0.98; e.vy *= 0.98;
        resolveCircle(room.grid, room.blocks, e);
      } else if (e.kind === "range") {
        if (dist < 90) moveToward(e, -dx / dist, -dy / dist, e.spd, dt);
        if (e.cd <= 0) { fireShot(e.x, e.y, dx / dist, dy / dist, 160, 1); e.cd = 1.6 + rnd() * 0.6; }
      }
      if (Math.hypot(e.x - player.x, e.y - player.y) < e.r + player.r - 2) {
        hurtPlayer(1 + Math.floor(S.floor / 6));
        var px = player.x - e.x, py = player.y - e.y, pd = Math.hypot(px, py) || 1;
        player.x += px / pd * 18; player.y += py / pd * 18;
      }
    }
    if (living === 0 && room && !room.cleared && room.enemies.length) {
      room.cleared = true;
      room.doorReady = true;
      room.clearWait = room.kind === "boss" ? 99 : 0.7;
      S.rooms[S.roomI].cleared = true;
      if (room.kind === "boss" && S.bossBeat > 0) { /* floor card waits on beat */ }
      else toast("ROOM CLEAR");
    }
  }

  function moveToward(e, ux, uy, spd, dt) {
    e.vx = ux * spd; e.vy = uy * spd;
    e.x += e.vx * dt; e.y += e.vy * dt;
    resolveCircle(room.grid, room.blocks, e);
  }

  function fireShot(x, y, ux, uy, spd, dmg) {
    S.shots.push({ x: x, y: y, vx: ux * spd, vy: uy * spd, r: 5, life: 3, dmg: dmg });
  }

  function updateBoss(e, dt, dx, dy, dist) {
    e.phase += dt;
    if (e.boss === "ash") {
      /* ASH TITAN v4
         v3 ring: maxR 420, dmg 55+8*floor applied every frame in band, no tell, no gap
         v4 ring: maxR 196, dmg 8+floor applied ONCE, tell 1.35s, gap 1.15 rad */
      moveToward(e, dx / dist * 0.4, dy / dist * 0.4, e.spd, dt);
      if (e.tell > 0) {
        e.tell -= dt;
        if (e.tell <= 0) {
          e.ringOn = true; e.ringR = 28;
          var ang = Math.atan2(dy, dx) + (rnd() < 0.5 ? 2.4 : -2.4);
          e.gap = ang;
        }
      } else if (e.ringOn) {
        e.ringR += 150 * dt;
        if (!e.ringHit) {
          var pr = Math.hypot(player.x - e.x, player.y - e.y);
          var pang = Math.atan2(player.y - e.y, player.x - e.x);
          var ad = Math.abs(Math.atan2(Math.sin(pang - e.gap), Math.cos(pang - e.gap)));
          var inBand = Math.abs(pr - e.ringR) < 18;
          var inGap = ad < 0.575;
          if (inBand && !inGap) {
            e.ringHit = true;
            hurtPlayer(8 + S.floor);
          }
        }
        if (e.ringR >= 196) { e.ringOn = false; e.ringHit = false; e.cd = 2.2; }
      } else if (e.cd <= 0) {
        if (rnd() < 0.55) { e.tell = 1.35; e.ringHit = false; }
        else { fireShot(e.x, e.y, dx / dist, dy / dist, 200, 2); fireShot(e.x, e.y, dx / dist + 0.2, dy / dist, 180, 2); e.cd = 1.4; }
      }
    } else if (e.boss === "bone") {
      if (e.cd <= 0) {
        for (var k = 0; k < 6; k++) {
          var a = k * Math.PI / 3 + e.phase;
          fireShot(e.x, e.y, Math.cos(a), Math.sin(a), 170, 1);
        }
        e.cd = 2.0;
      }
      moveToward(e, dx / dist * 0.3, dy / dist * 0.3, e.spd, dt);
    } else if (e.boss === "thorn") {
      if (e.cd <= 0) {
        fireShot(e.x, e.y, dx / dist, dy / dist, 210, 2);
        e.cd = 0.7;
      }
      if (Math.floor(e.phase) % 4 === 0 && e.tell <= 0) e.tell = 0.01;
      moveToward(e, dx / dist * 0.5, dy / dist * 0.5, e.spd, dt);
    } else {
      moveToward(e, dx / dist, dy / dist, e.spd, dt);
      if (e.cd <= 0) { fireShot(e.x, e.y, dx / dist, dy / dist, 180, 1); e.cd = 1.5; }
    }
  }

  function updateShots(dt) {
    for (var i = S.shots.length - 1; i >= 0; i--) {
      var s = S.shots[i];
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      if (tileAt(room.grid, s.x, s.y) || blockHit(room.blocks, s.x, s.y, s.r, true)) { S.shots.splice(i, 1); continue; }
      if (Math.hypot(s.x - player.x, s.y - player.y) < player.r + s.r) {
        hurtPlayer(s.dmg); S.shots.splice(i, 1); continue;
      }
      if (s.life <= 0) S.shots.splice(i, 1);
    }
  }

  function updateLoot(dt) {
    for (var i = S.loot.length - 1; i >= 0; i--) {
      var it = S.loot[i];
      it.life -= dt; it.vy += 80 * dt; it.y += it.vy * dt;
      if (it.y > WORLD_H - 40) { it.y = WORLD_H - 40; it.vy *= -0.3; }
      if (!it.taken && Math.hypot(it.x - player.x, it.y - player.y) < 28) takeLoot(it);
      if (it.life <= 0 || it.taken) S.loot.splice(i, 1);
    }
  }

  function burst(x, y, col, n) {
    for (var i = 0; i < n && S.particles.length < MAX_PART; i++) {
      var a = rnd() * Math.PI * 2, sp = 40 + rnd() * 120;
      S.particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0.4 + rnd() * 0.3, col: col, s: 2 + rnd() * 3 });
    }
  }
  function floatTxt(x, y, t, c) {
    S.floats.push({ x: x, y: y, t: t, c: c || "#fff", life: 0.8, vy: -36 });
  }
  function updateFx(dt) {
    for (var i = S.particles.length - 1; i >= 0; i--) {
      var p = S.particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 80 * dt; p.t -= dt;
      if (p.t <= 0) S.particles.splice(i, 1);
    }
    for (var j = S.floats.length - 1; j >= 0; j--) {
      var f = S.floats[j];
      f.y += f.vy * dt; f.life -= dt;
      if (f.life <= 0) S.floats.splice(j, 1);
    }
    for (var k = S.pops.length - 1; k >= 0; k--) {
      S.pops[k].t -= dt;
      if (S.pops[k].t <= 0) S.pops.splice(k, 1);
    }
    if (S.shake > 0) S.shake -= dt;
    if (S.muteFx > 0) S.muteFx -= dt;
    if (S.bossBeat > 0) {
      S.bossBeat -= dt;
      if (S.bossBeat <= 0 && room && room.cleared) {
        nextRoomOrFloor();
      }
    }
  }

  function tryPlaceBlock(wx, wy) {
    if (player.blockStock <= 0) { toast("NO BLOCKS"); return; }
    var tx = Math.floor(wx / TILE), ty = Math.floor(wy / TILE);
    if (ty <= 0 || tx <= 0 || ty >= ROWS - 1 || tx >= COLS - 1) return;
    if (room.grid[ty][tx]) return;
    var x = (tx + 0.5) * TILE, y = (ty + 0.5) * TILE;
    if (Math.hypot(x - player.x, y - player.y) < 36) return;
    room.blocks.push({ x: x, y: y, tx: tx, ty: ty });
    S.rooms[S.roomI].blocks = room.blocks.slice();
    player.blockStock -= 1;
    sfx("place");
    syncHud();
  }

  function updatePlayer(dt) {
    if (player.inv > 0) player.inv -= dt;
    if (S.aim && S.aim.x < player.x - 8) player.facing = -1;
    else if (S.aim && S.aim.x > player.x + 8) player.facing = 1;
    if (room && room.cleared && room.doorReady && S.bossBeat <= 0 && room.kind !== "boss") {
      if (room.clearWait > 0) room.clearWait -= dt;
      else {
        player.x += 160 * dt;
        if (player.x > (COLS - 2) * TILE - 10) nextRoomOrFloor();
      }
    }
  }

  /* ---------- render ---------- */
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    canvas.width = Math.max(320, Math.floor(w * (window.devicePixelRatio > 1.5 ? 1.5 : window.devicePixelRatio || 1)));
    canvas.height = Math.max(240, Math.floor(h * (window.devicePixelRatio > 1.5 ? 1.5 : window.devicePixelRatio || 1)));
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    var port = h > w * 1.05;
    S.portrait = port;
    rotateEl.className = port ? "show" : "";
    if (port && S.mode === "play") { /* freeze via flag */ }
  }

  function worldFromEvent(ev) {
    var rect = canvas.getBoundingClientRect();
    var sx = (ev.clientX - rect.left) * (canvas.width / rect.width);
    var sy = (ev.clientY - rect.top) * (canvas.height / rect.height);
    return {
      x: (sx - S.world.x) / S.world.s,
      y: (sy - S.world.y) / S.world.s
    };
  }

  function draw() {
    var g = ctx;
    var cw = canvas.width, ch = canvas.height;
    g.fillStyle = DARK;
    g.fillRect(0, 0, cw, ch);
    var scale = Math.min(cw / WORLD_W, ch / WORLD_H);
    var ox = (cw - WORLD_W * scale) * 0.5;
    var oy = (ch - WORLD_H * scale) * 0.5;
    S.world = { x: ox, y: oy, s: scale };
    g.save();
    if (S.shake > 0) g.translate((Math.random() - 0.5) * 10 * S.shake * scale, (Math.random() - 0.5) * 10 * S.shake * scale);
    g.translate(ox, oy);
    g.scale(scale, scale);
    drawWorld(g);
    g.restore();
    if (S.mode === "play" && !S.seenAimHelp) {
      g.fillStyle = "rgba(20,17,14,0.0)";
    }
  }

  function drawWorld(g) {
    var bio = biomeOf(S.floor);
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        var wall = room ? room.grid[y][x] : 1;
        g.fillStyle = wall ? bio.walls[(x + y) & 1] : bio.floor[(x + y) & 1];
        g.fillRect(x * TILE, y * TILE, TILE, TILE);
        if (wall) {
          g.fillStyle = "rgba(0,0,0,0.25)";
          g.fillRect(x * TILE, y * TILE + TILE - 6, TILE, 6);
          g.fillStyle = "rgba(255,255,255,0.05)";
          g.fillRect(x * TILE + 2, y * TILE + 2, TILE - 8, 4);
        }
      }
    }
    if (room && room.cleared) {
      g.fillStyle = "#d0a040";
      g.fillRect((COLS - 1) * TILE + 6, 8 * TILE, 10, 2 * TILE);
    }
    if (room) {
      for (var b = 0; b < room.blocks.length; b++) {
        var bl = room.blocks[b];
        g.fillStyle = "#6a5a44";
        g.fillRect(bl.x - TILE * 0.45, bl.y - TILE * 0.45, TILE * 0.9, TILE * 0.9);
        g.fillStyle = "#8a7a60";
        g.fillRect(bl.x - TILE * 0.45, bl.y - TILE * 0.45, TILE * 0.9, 6);
      }
      for (var c = 0; c < room.chests.length; c++) drawChest(g, room.chests[c]);
      for (var i = 0; i < room.enemies.length; i++) drawEnemy(g, room.enemies[i]);
    }
    for (var L = 0; L < S.loot.length; L++) drawLoot(g, S.loot[L]);
    for (var s = 0; s < S.shots.length; s++) {
      g.fillStyle = "#f0c070";
      g.beginPath(); g.arc(S.shots[s].x, S.shots[s].y, S.shots[s].r, 0, 6.3); g.fill();
    }
    for (var sp = 0; sp < S.splits.length; sp++) {
      g.fillStyle = "#f09040";
g.beginPath(); g.arc(S.splits[sp].x, S.splits[sp].y, S.splits[sp].r, 0, 6.3); g.fill();
    }
    if (player) drawPlayer(g);
    if (ball) drawBallObj(g, ball, true);
    if (S.aim && !ball.live) {
      var pts = aimGuide(S.aim.ang, S.aim.pow);
      g.strokeStyle = "rgba(240,210,140,0.45)";
      g.lineWidth = 2;
      g.setLineDash([6, 6]);
      g.beginPath();
      for (var p = 0; p < pts.length; p++) {
        if (p === 0) g.moveTo(pts[p].x, pts[p].y); else g.lineTo(pts[p].x, pts[p].y);
      }
      g.stroke();
      g.setLineDash([]);
      g.fillStyle = "rgba(240,210,140,0.8)";
      g.beginPath(); g.arc(player.x + Math.cos(S.aim.ang) * 28, player.y + Math.sin(S.aim.ang) * 28, 4, 0, 6.3); g.fill();
    }
    for (var z = 0; z < S.particles.length; z++) {
      var pt = S.particles[z];
      g.globalAlpha = Math.max(0, pt.t * 2);
      g.fillStyle = pt.col;
      g.fillRect(pt.x, pt.y, pt.s, pt.s);
      g.globalAlpha = 1;
    }
    for (var f = 0; f < S.floats.length; f++) {
      var ft = S.floats[f];
      g.globalAlpha = Math.max(0, ft.life * 1.4);
      g.fillStyle = ft.c;
      g.font = "bold 16px -apple-system, sans-serif";
      g.textAlign = "center";
      g.fillText(ft.t, ft.x, ft.y);
      g.globalAlpha = 1;
    }
    if (S.placeMode) {
      g.fillStyle = "rgba(240,160,60,0.12)";
      g.fillRect(0, 0, WORLD_W, WORLD_H);
    }
  }

  function drawChest(g, ch) {
    g.fillStyle = ch.open ? "#3a3020" : "#c09030";
    g.fillRect(ch.x - 12, ch.y - 10, 24, 18);
    g.fillStyle = "#201810";
    g.fillRect(ch.x - 12, ch.y - 2, 24, 3);
    if (!ch.open) {
      g.fillStyle = "#f0d060";
      g.fillRect(ch.x - 2, ch.y - 6, 4, 6);
    }
  }

  function drawPlayer(g) {
    var cos = player.cos;
    var pal = PALETTES[cos.pal] || PALETTES.ember;
    if (player.inv > 0 && Math.floor(player.inv * 12) % 2 === 0) g.globalAlpha = 0.45;
    var bw = cos.body === "tall" ? 12 : cos.body === "round" ? 18 : cos.body === "swift" ? 12 : 14;
    var bh = cos.body === "tall" ? 26 : cos.body === "round" ? 16 : cos.body === "swift" ? 20 : 22;
    g.fillStyle = pal.b;
    g.fillRect(player.x - bw / 2 - 3, player.y + 6, 6, 10);
    g.fillRect(player.x + bw / 2 - 3, player.y + 6, 6, 10);
    g.fillStyle = pal.a;
    g.fillRect(player.x - bw / 2, player.y - bh / 2, bw, bh);
    g.fillStyle = pal.skin;
    g.fillRect(player.x - 7, player.y - bh / 2 - 12, 14, 12);
    g.fillStyle = "#1a120c";
    g.fillRect(player.x - 3 + player.facing * 3, player.y - bh / 2 - 8, 3, 3);
    drawHat(g, player.x, player.y - bh / 2 - 12, cos.hat, pal);
    g.globalAlpha = 1;
  }

  function drawHat(g, x, y, hat, pal) {
    if (hat === "none") return;
    if (hat === "cap") {
      g.fillStyle = pal.c; g.fillRect(x - 10, y - 2, 20, 5); g.fillRect(x - 2, y - 2, 14, 4);
    } else if (hat === "bow") {
      g.fillStyle = pal.c; g.fillRect(x - 10, y, 8, 6); g.fillRect(x + 2, y, 8, 6); g.fillRect(x - 2, y + 1, 4, 4);
    } else if (hat === "crown") {
      g.fillStyle = "#e0c050"; g.fillRect(x - 9, y, 18, 5); g.fillRect(x - 9, y - 5, 4, 6); g.fillRect(x - 2, y - 6, 4, 7); g.fillRect(x + 5, y - 5, 4, 6);
    } else if (hat === "helm") {
      g.fillStyle = "#8a9088"; g.fillRect(x - 9, y - 2, 18, 10); g.fillStyle = "#222"; g.fillRect(x - 7, y + 2, 14, 3);
    } else if (hat === "flower") {
      g.fillStyle = pal.c; g.beginPath(); g.arc(x - 6, y + 1, 4, 0, 6.3); g.arc(x + 6, y + 1, 4, 0, 6.3); g.arc(x, y - 3, 4, 0, 6.3); g.fill();
      g.fillStyle = "#f0e060"; g.beginPath(); g.arc(x, y + 1, 2.5, 0, 6.3); g.fill();
    } else if (hat === "ribbon") {
      g.fillStyle = pal.c; g.fillRect(x - 8, y + 8, 4, 16); g.fillRect(x + 4, y + 8, 4, 14); g.fillRect(x - 9, y, 18, 4);
    } else if (hat === "beret") {
      g.fillStyle = pal.c; g.beginPath(); g.ellipse(x, y + 2, 11, 5, 0, 0, 6.3); g.fill(); g.fillRect(x + 6, y - 2, 5, 3);
    }
  }

  function drawBallObj(g, b, trails) {
    var skin = player && player.cos ? player.cos.ball : "classic";
    var trail = player && player.cos ? player.cos.trail : "spark";
    if (trails && b.trail) {
      for (var i = 0; i < b.trail.length; i++) {
        var t = b.trail[i];
        g.globalAlpha = i / b.trail.length * 0.5;
        if (trail === "petals") g.fillStyle = "#f0a0b8";
        else if (trail === "flame") g.fillStyle = "#f08030";
        else if (trail === "ribbon") g.fillStyle = "#d0a0ff";
        else if (trail === "smoke") g.fillStyle = "#888";
        else if (trail === "pixels") g.fillStyle = "#80e0d0";
        else g.fillStyle = "#f0a050";
        g.fillRect(t.x - 2, t.y - 2, 4, 4);
      }
      g.globalAlpha = 1;
    }
    var col = "#d06018";
    if (skin === "rose") col = "#d07090";
    else if (skin === "midnight") col = "#304878";
    else if (skin === "rune") col = "#40a090";
    else if (skin === "ivy") col = "#3a8848";
    else if (skin === "cracked") col = "#b05020";
    g.fillStyle = col;
    g.beginPath(); g.arc(b.x, b.y, b.r, 0, 6.3); g.fill();
    g.strokeStyle = skin === "rose" ? "#fff0f4" : "#1a120c";
    g.lineWidth = 2;
    g.beginPath(); g.arc(b.x, b.y, b.r, 0, 6.3);
    g.moveTo(b.x, b.y - b.r); g.lineTo(b.x, b.y + b.r);
    g.moveTo(b.x - b.r, b.y); g.lineTo(b.x + b.r, b.y);
    g.stroke();
    if (player && player.permaFire) {
      g.fillStyle = "rgba(240,80,20,0.45)";
      g.beginPath(); g.arc(b.x, b.y, b.r + 3, 0, 6.3); g.fill();
    }
  }

  function drawEnemy(g, e) {
    if (!e.alive && e.deadT <= 0) return;
    var a = !e.alive ? Math.max(0, e.deadT) : 1;
    g.globalAlpha = a;
    if (e.boss === "ash") {
      g.fillStyle = "#2a2018";
      g.fillRect(e.x - 28, e.y - 20, 56, 48);
      g.fillStyle = "#c06030";
      g.fillRect(e.x - 22, e.y - 14, 18, 14); g.fillRect(e.x + 4, e.y - 14, 18, 14);
      g.fillStyle = "#f0a040";
      g.fillRect(e.x - 8, e.y + 4, 16, 20);
      g.fillStyle = "#1a1008";
      g.fillRect(e.x - 14, e.y - 8, 8, 6); g.fillRect(e.x + 6, e.y - 8, 8, 6);
      if (e.tell > 0) {
        g.strokeStyle = "rgba(255,80,40,0.7)";
        g.lineWidth = 3;
        g.beginPath(); g.arc(e.x, e.y, 70 + Math.sin(S.t * 12) * 6, 0, 6.3); g.stroke();
        g.fillStyle = "rgba(80,200,80,0.18)";
        g.beginPath(); g.moveTo(e.x, e.y); g.arc(e.x, e.y, 196, e.gap - 0.575, e.gap + 0.575); g.closePath(); g.fill();
        g.fillStyle = "#80f080";
        g.font = "bold 14px sans-serif"; g.textAlign = "center";
        g.fillText("GAP", e.x + Math.cos(e.gap) * 90, e.y + Math.sin(e.gap) * 90);
      }
      if (e.ringOn) {
        g.strokeStyle = "#ff6030";
        g.lineWidth = 8;
        g.beginPath();
        g.arc(e.x, e.y, e.ringR, e.gap + 0.575, e.gap - 0.575 + Math.PI * 2);
        g.stroke();
        g.strokeStyle = "#80f080";
        g.lineWidth = 6;
        g.beginPath();
        g.arc(e.x, e.y, e.ringR, e.gap - 0.575, e.gap + 0.575);
        g.stroke();
      }
    } else if (e.boss === "bone") {
      g.fillStyle = "#e8e0d0";
      g.fillRect(e.x - 16, e.y - 18, 32, 40);
      g.fillStyle = "#f4eee0";
      g.fillRect(e.x - 14, e.y - 36, 28, 22);
      g.fillStyle = "#1a120c";
      g.fillRect(e.x - 8, e.y - 28, 6, 6); g.fillRect(e.x + 2, e.y - 28, 6, 6);
      g.fillRect(e.x - 6, e.y - 18, 12, 3);
      for (var r = 0; r < 4; r++) g.fillRect(e.x - 12, e.y - 8 + r * 7, 24, 3);
    } else if (e.boss === "thorn") {
      g.fillStyle = "#245830";
      g.fillRect(e.x - 18, e.y - 10, 36, 36);
      g.fillStyle = "#50a060";
      g.fillRect(e.x - 12, e.y - 28, 24, 22);
      g.fillStyle = "#d07090";
      g.beginPath(); g.arc(e.x, e.y - 30, 8, 0, 6.3); g.fill();
      g.fillStyle = "#c0e070";
      g.fillRect(e.x - 22, e.y + 4, 8, 18); g.fillRect(e.x + 14, e.y + 4, 8, 18);
    } else if (e.boss === "mini") {
      g.fillStyle = e.col;
      g.fillRect(e.x - 16, e.y - 16, 32, 32);
      g.fillStyle = "#1a120c";
      g.fillRect(e.x - 8, e.y - 8, 5, 5); g.fillRect(e.x + 3, e.y - 8, 5, 5);
      g.fillStyle = "#c0a060";
      g.fillRect(e.x - 14, e.y - 22, 28, 8);
    } else {
      g.fillStyle = e.col;
      if (e.kind === "swoop") {
        g.beginPath(); g.ellipse(e.x, e.y, e.r + 2, e.r - 2, 0, 0, 6.3); g.fill();
      } else {
        g.fillRect(e.x - e.r, e.y - e.r, e.r * 2, e.r * 2);
      }
      g.fillStyle = "#1a120c";
      g.fillRect(e.x - 4 + e.facing, e.y - 4, 3, 3);
      g.fillRect(e.x + 2 + e.facing, e.y - 4, 3, 3);
    }
    if (e.alive) {
      var w = Math.max(20, e.r * 2);
      g.fillStyle = "#2a1810";
      g.fillRect(e.x - w / 2, e.y - e.r - 10, w, 4);
      g.fillStyle = e.hp / e.maxHp > 0.35 ? "#50c060" : "#d04030";
      g.fillRect(e.x - w / 2, e.y - e.r - 10, w * Math.max(0, e.hp / e.maxHp), 4);
    }
    if (e.burn > 0 && e.alive) {
      g.fillStyle = "rgba(255,80,20,0.5)";
      g.fillRect(e.x - 6, e.y - e.r - 4, 4, 8);
    }
    g.globalAlpha = 1;
    if (e.boss && e.alive) {
      g.fillStyle = "#f0e0c0";
      g.font = "bold 12px sans-serif";
      g.textAlign = "center";
      g.fillText(e.name, e.x, e.y - e.r - 16);
    }
  }

  function drawLoot(g, it) {
    g.fillStyle = RARITY[it.rar] ? RARITY[it.rar].c : "#ccc";

    }
  }

  /* ---------- builder ---------- */
  var BLD = { grid: null, ents: [], tool: "wall", name: "MY DUNGEON", hover: null };

  function emptyLevel() {
    var t = "";
    for (var i = 0; i < COLS * ROWS; i++) t += "0";
    return { n: "MY DUNGEON", w: COLS, h: ROWS, t: t, e: [] };
  }
  function encodeShare(lv) {
    var raw = JSON.stringify({ n: lv.n, w: lv.w, h: lv.h, t: lv.t, e: lv.e });
    var b64 = btoa(unescape(encodeURIComponent(raw)));
    return b64.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
  }
  function decodeShare(code) {
    try {
      var s = String(code || "").trim().replace(/-/g, "+").replace(/_/g, "/");
      while (s.length % 4) s += "=";
      var raw = decodeURIComponent(escape(atob(s)));
      var lv = JSON.parse(raw);
      if (!lv || !lv.t) return null;
      lv.w = COLS; lv.h = ROWS;
      return lv;
    } catch (e) { return null; }
  }

  function openBuilder(lv) {
    hidePanels();
    S.mode = "builder";
    lv = lv || emptyLevel();
    BLD.name = lv.n || "MY DUNGEON";
    BLD.ents = (lv.e || []).slice();
    BLD.grid = blankGrid(0);
    for (var i = 0; i < lv.t.length && i < COLS * ROWS; i++) {
      BLD.grid[Math.floor(i / COLS)][i % COLS] = lv.t.charAt(i) === "1" ? 1 : 0;
    }
    stampBorder(BLD.grid);
    document.getElementById("builderPanel").className = "panel show";
    renderBuilder();
  }

  function levelFromBld() {
    var t = "";
    for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) t += BLD.grid[y][x] ? "1" : "0";
    return { n: BLD.name, w: COLS, h: ROWS, t: t, e: BLD.ents.slice() };
  }

  function renderBuilder() {
    var tools = ["wall", "erase", "slime", "bat", "skel", "archer", "imp", "chest", "spawn"].map(function (t) {
      return "<button class='bb" + (BLD.tool === t ? " on" : "") + "' data-tool='" + t + "'>" + t + "</button>";
    }).join("");
    var code = encodeShare(levelFromBld());
    document.getElementById("builderCard").innerHTML =
      "<h1>DUNGEON BUILDER</h1>" +
      "<div class='row'><input class='bb' id='lvlName' value='" + BLD.name.replace(/"/g, "") + "' style='flex:1'>" +
      "<button class='bb pri' id='btnPlayLv'>PLAY</button>" +
      "<button class='bb' id='btnBldMenu'>MENU</button></div>" +
      "<h2>TOOLS</h2><div class='row' id='tools'>" + tools + "</div>" +
      "<canvas id='bld' width='960' height='540' style='width:100%;background:#14110e;touch-action:none;margin-top:8px'></canvas>" +
      "<h2>SHARE CODE</h2>" +
      "<textarea class='bb' id='copybox' readonly>" + code + "</textarea>" +
      "<div class='row'><button class='bb good' id='btnCopy'>COPY</button><button class='bb' id='btnClearB'>CLEAR</button></div>" +
      "<p class='muted'>Paint walls. Stamp enemies and a chest. Play it. The code is the level — screenshot it if storage dies.</p>";
    document.getElementById("lvlName").oninput = function () { BLD.name = this.value.slice(0, 24); };
    document.getElementById("tools").onclick = function (ev) {
      var b = ev.target.closest("button"); if (!b) return; BLD.tool = b.getAttribute("data-tool"); renderBuilder();
    };
    document.getElementById("btnPlayLv").onclick = function () {
      var lv = levelFromBld();
      hidePanels();
      startRun("BLK-CODE", false, lv);
    };
    document.getElementById("btnBldMenu").onclick = function () { S.mode = "menu"; hidePanels(); showMenu(); };
    document.getElementById("btnCopy").onclick = function () {
      var ta = document.getElementById("copybox");
      ta.select();
      try { document.execCommand("copy"); toast("COPIED"); } catch (e) { toast("SELECT AND COPY"); }
    };
    document.getElementById("btnClearB").onclick = function () { openBuilder(emptyLevel()); };
    var bc = document.getElementById("bld");
    paintBuilder(bc);
    function paintAt(ev) {
      var r = bc.getBoundingClientRect();
      var x = (ev.clientX - r.left) * (bc.width / r.width);
      var y = (ev.clientY - r.top) * (bc.height / r.height);
      var tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);
      if (tx <= 0 || ty <= 0 || tx >= COLS - 1 || ty >= ROWS - 1) return;
      if (BLD.tool === "wall") BLD.grid[ty][tx] = 1;
      else if (BLD.tool === "erase") {
        BLD.grid[ty][tx] = 0;
        BLD.ents = BLD.ents.filter(function (e) { return !(e.tx === tx && e.ty === ty); });
      } else if (BLD.tool === "chest") {
        BLD.ents = BLD.ents.filter(function (e) { return !(e.tx === tx && e.ty === ty); });
        BLD.ents.push({ kind: "chest", tx: tx, ty: ty });
      } else if (BLD.tool === "spawn") {
        BLD.ents = BLD.ents.filter(function (e) { return e.kind !== "spawn"; });
        BLD.ents.push({ kind: "spawn", tx: tx, ty: ty });
      } else {
        BLD.ents = BLD.ents.filter(function (e) { return !(e.tx === tx && e.ty === ty); });
        BLD.ents.push({ kind: "enemy", type: BLD.tool, tx: tx, ty: ty });
      }
      paintBuilder(bc);
    }
    var down = false;
    bc.onpointerdown = function (ev) { down = true; bc.setPointerCapture(ev.pointerId); paintAt(ev); };
    bc.onpointermove = function (ev) { if (down) paintAt(ev); };
    bc.onpointerup = function () {
      down = false;
      var ta = document.getElementById("copybox");
      if (ta) ta.value = encodeShare(levelFromBld());
    };
  }

  function paintBuilder(bc) {
    var g = bc.getContext("2d");
    g.fillStyle = DARK; g.fillRect(0, 0, bc.width, bc.height);
    for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) {
      g.fillStyle = BLD.grid[y][x] ? "#3a3328" : "#1c1814";
      g.fillRect(x * TILE, y * TILE, TILE - 1, TILE - 1);
    }
    BLD.ents.forEach(function (e) {
      var x = e.tx * TILE + 4, y = e.ty * TILE + 4;
      if (e.kind === "chest") g.fillStyle = "#c09030";
      else if (e.kind === "spawn") g.fillStyle = "#40c070";
      else g.fillStyle = "#c05040";
      g.fillRect(x, y, TILE - 8, TILE - 8);
      g.fillStyle = "#fff";
      g.font = "9px sans-serif";
      g.fillText((e.type || e.kind).slice(0, 4), x, y + 12);
    });
  }

  /* ---------- input ---------- */
  function onDown(ev) {
    if (S.mode !== "play" || S.pause || S.portrait) return;
    if (ev.target && ev.target.tagName === "BUTTON") return;
    ensureAudio();
    var w = worldFromEvent(ev);
    if (S.placeMode) { tryPlaceBlock(w.x, w.y); return; }
    S.pointer.down = true;
    S.pointer.x = w.x; S.pointer.y = w.y;
    if (!ball.live) {
      var dx = w.x - player.x, dy = w.y - player.y;
      var ang = Math.atan2(dy, dx);
      var pow = Math.min(1, Math.hypot(dx, dy) / 140);
      S.aim = { ang: ang, pow: Math.max(0.35, pow), x: w.x, y: w.y };
    }
  }
  function onMove(ev) {
    if (!S.pointer.down || S.mode !== "play") return;
    var w = worldFromEvent(ev);
    S.pointer.x = w.x; S.pointer.y = w.y;
    if (S.aim && !ball.live) {
      var dx = w.x - player.x, dy = w.y - player.y;
      S.aim.ang = Math.atan2(dy, dx);
      S.aim.pow = Math.max(0.35, Math.min(1, Math.hypot(dx, dy) / 140));
      S.aim.x = w.x; S.aim.y = w.y;
    }
  }
  function onUp(ev) {
    if (!S.pointer.down) return;
    S.pointer.down = false;
    if (S.mode === "play" && S.aim && !ball.live && !S.placeMode) {
      throwBall(S.aim.ang, S.aim.pow);
    }
    S.aim = null;
  }

  canvas.addEventListener("pointerdown", onDown);
  canvas.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onUp);

  document.getElementById("btnPause").onclick = function () {
    if (S.mode !== "play") return;
    S.pause = true; showPause();
  };
  document.getElementById("btnBlock").onclick = function () {
    if (S.mode !== "play") return;
    S.placeMode = !S.placeMode;
    syncHud();
  };
  document.getElementById("btnShop").onclick = function () {
    if (S.mode !== "play") return;
    showShop();
  };

  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 80); });

  /* ---------- chests ---------- */
  function updateChests() {
    if (!room) return;
    for (var i = 0; i < room.chests.length; i++) {
      var ch = room.chests[i];
      if (!ch.open && Math.hypot(ch.x - player.x, ch.y - player.y) < 28) {
        ch.open = true;
        dropLoot(ch.x, ch.y - 10, S.floor >= 4);
        dropLoot(ch.x + 10, ch.y - 6, false);
        player.frag += 2;
        sfx("loot");
      }
    }
  }

  /* ---------- loop ---------- */
  function update(dt) {
    S.t += dt;
    if (S.mode !== "play" || S.pause || S.portrait) return;
    if (!player || !room) return;
    if (document.getElementById("shopPanel").className.indexOf("show") >= 0) return;
    if (document.getElementById("floorPanel").className.indexOf("show") >= 0) return;
    if (document.getElementById("passPanel").className.indexOf("show") >= 0) return;
    updatePlayer(dt);
    updateBall(dt);
    updateSplits(dt);
    updateEnemies(dt);
    updateShots(dt);
    updateLoot(dt);
    updateChests();
    updateFx(dt);
    if (S.t % 0.25 < dt) syncHud();
  }

  function frame(now) {
    if (!S.last) S.last = now;
    var d = Math.min(0.05, (now - S.last) / 1000);
    S.last = now;
    S.acc += d;
    while (S.acc >= DT) { update(DT); S.acc -= DT; }
    draw();
    requestAnimationFrame(frame);
  }

  /* ---------- install bar ---------- */
  function setupInstall() {
    var ua = navigator.userAgent || "";
    var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var standalone = navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    S.ios = ios; S.standalone = standalone;
    if (!standalone && ios && !store.installHide) installBar.className = "show";
    document.getElementById("btnInstallX").onclick = function () {
      installBar.className = "";
      store.installHide = true;
      saveStore();
    };
  }

  /* ---------- boot ---------- */
  loadStore();
  setupInstall();
  resize();
  showSplash();
  requestAnimationFrame(frame);

  window.__BB_SELFTEST = {
    encode: encodeShare,
    decode: decodeShare,
    hash: hashStr,
    buildFloor: buildFloor,
    parseSeed: parseSeed
  };
})();
</script>
</body>
