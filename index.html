  }

  /* BB-V7.4 — walls were flat tiles with a 6px shadow strip INSIDE the tile: 20% of a
     30px tile, an emboss, and nothing occluded anything. Meanwhile the hero, the mobs
     and the knights all carry real cube() depth, so the sprites promised a 3/4 view
     and the floor delivered a top-down checkerboard. The old LP build got this right:
     walls are blocks lifted by their own height, ~48% of a tile. That one number is
     the difference between a room and a grid.
     BB-V7.19 — painting every wall before every actor made the hero cover a south
     wall's lifted top, so walking the south lip read as floating on the block.
     Depth is now row-sorted north→south: actors on a row, then that row's cubes.
     A wall south of you occludes your feet; you stay in front of walls to the north.
     BB-V7.20 — visual HEIGHT is paint-only (grid stays 0/1). In this projection,
     height is the cube front-face (z), not extra top-face rows — stacking tops
     reads as wall thickness. BACK_WALL_H is north-border height in block units
     (1 half · 2 wall · 3 high · 4 deep). Interior/side/south keep WALL_Z.
     Walls use one solid biome colour; only the floor checkerboards. */
  var WALL_Z = 0.48;
  var BACK_WALL_H = 2;
  var WALL_H_MIN = 1, WALL_H_MAX = 4;
  var WALL_H_NAME = { 1: "half", 2: "wall", 3: "high", 4: "deep" };
  var WALL_H_FROM_NAME = {
    half: 1, halfwall: 1,
    wall: 2,
    high: 3, highwall: 3,
    deep: 4, deeproom: 4, deeproomhigh: 4, deeproomhighwall: 4
  };

  function clampWallH(n) {
    n = n | 0;
    if (n < WALL_H_MIN) n = WALL_H_MIN;
    if (n > WALL_H_MAX) n = WALL_H_MAX;
    return n;
  }

  function setBackWallH(n) {
    if (typeof n === "string") {
      var key = String(n).toLowerCase().replace(/[\s_-]+/g, "");
      if (WALL_H_FROM_NAME[key] != null) n = WALL_H_FROM_NAME[key];
      else n = parseInt(n, 10);
    }
    BACK_WALL_H = clampWallH(n);
    return BACK_WALL_H;
  }

  /* Procedural + curated back-wall height. Schema stays 0/1; this is paint mood.
     1 half — corridors / choke
     2 wall — standard combat rooms
     3 high — mini-boss, big chambers, generic boss
     4 deep — Skull Lord cathedral (and other huge curated halls) */
  function pickWallH(kind, piece, cols, rows) {
    var area = (cols || 20) * (rows || 12);
    if (piece === "skullLair") return 4;
    if (piece === "throneGate") return 3;
    if (kind === "boss" || piece === "boss") return 3;
    if (kind === "mini") return 3;
    if (kind === "corridor" || piece === "hallH" || piece === "hallV") return 1;
    if (piece === "choke") return 1;
    if (piece === "teeth" || piece === "aisle") return rnd() < 0.55 ? 1 : 2;
    if (piece === "chambers" || piece === "ring" || piece === "lbend") return rnd() < 0.5 ? 3 : 2;
    if (piece === "plus" || piece === "stagger") return rnd() < 0.35 ? 3 : 2;
    if (area >= 28 * 15) return rnd() < 0.65 ? 3 : 2;
    if (area <= 18 * 12) return rnd() < 0.4 ? 1 : 2;
    return 2;
  }

  function applySpecWallH(spec) {
    if (!spec) return setBackWallH(2);
    return setBackWallH(spec.wallH != null ? spec.wallH : 2);
  }

  function wallHeightPx(x, y, cols, rows) {
    if (y === 0) return clampWallH(BACK_WALL_H) * TILE;
    return Math.round(TILE * WALL_Z);
  }

  function wallVisualPad() {
    var h = clampWallH(BACK_WALL_H) * TILE;
    var base = Math.round(TILE * WALL_Z);
    return Math.max(0, h - base);
  }

  function sortRow(py) {
    var rows = playRows();
    return Math.max(0, Math.min(rows - 1, Math.floor(py / TILE)));
  }

  /* Exit door: sealed plank slab before clear, swings open with a warm hall glow after. */
  function drawExitDoor(g, wz) {
    var d = eastDoorSpan();
    if (!d) return;
    var open = exitDoorOpenAmt();
    var x = d.tx * TILE;
    var top = d.y0 * TILE;
    var h = (d.y1 - d.y0 + 1) * TILE;
    var doorCol = "#6a4a28";
    var bandCol = "#2a2218";
    var glow = "#e8c060";
    var leafW = Math.max(6, Math.round(TILE * 0.28));

    /* Arch frame always sits in the wall so the hole is readable either state. */
    cube(g, x, top - wz - 4, TILE, 6, 4, shade(doorCol, 0.55));
    g.fillStyle = shade(bandCol, 0.9);
    g.fillRect(x + 2, top - 2, TILE - 4, 3);

    if (open < 0.02) {
      /* CLOSED — full slab, iron bands, latch facing into the room. */
      cube(g, x + 2, top - wz + 2, TILE - 4, h - 4, wz - 2, doorCol);
      g.fillStyle = shade(bandCol, 1.1);
      g.fillRect(x + 4, top + h * 0.28, TILE - 8, 3);
      g.fillRect(x + 4, top + h * 0.62, TILE - 8, 3);
      g.fillStyle = shade("#c0a050", 1.05);
      g.beginPath();
      g.arc(x + 8, top + h * 0.5, 3.2, 0, 6.3);
      g.fill();
      g.fillStyle = shade("#1a140e", 1);
      g.fillRect(x + 4, top + 6, 3, h - 12);
      return;
    }

    /* OPEN — void beyond, light spill, leaves hinged to the sides. */
    var voidX = x + Math.round(TILE * 0.18);
    var voidW = TILE - Math.round(TILE * 0.22);
    /* Lit hall beyond the threshold — brighter than the room so the hole pops. */
    g.fillStyle = shade("#3a2a10", 1);
    g.fillRect(voidX, top + 2, voidW, h - 4);
    g.fillStyle = shade("#c09030", 1.15);
    g.fillRect(voidX + 3, top + 5, voidW - 6, h - 10);
    g.fillStyle = shade("#f0d070", 1.2);
    g.fillRect(voidX + 6, top + 10, Math.max(4, voidW - 14), h - 20);

    var pulse = 0.6 + 0.4 * Math.sin(S.t * 4.5);
    g.save();
    g.globalAlpha = (0.55 + 0.35 * pulse) * open;
    var grad = g.createLinearGradient(x - TILE * 2.2, top + h * 0.5, x + TILE * 0.4, top + h * 0.5);
    grad.addColorStop(0, "rgba(232,192,96,0)");
    grad.addColorStop(0.45, "rgba(232,192,96,0.28)");
    grad.addColorStop(1, "rgba(255,236,150,0.85)");
    g.fillStyle = grad;
    g.fillRect(x - TILE * 2.2, top - 6, TILE * 3.0, h + 12);
    g.restore();

    /* Floor path glow leading into the hall. */
    g.save();
    g.globalAlpha = (0.25 + 0.2 * pulse) * open;
    g.fillStyle = glow;
    g.fillRect(x - TILE * 1.4, top + h * 0.38, TILE * 1.5, h * 0.24);
    g.restore();

    /* Door leaves swing outward (open=0 flat, open=1 tucked to the frame). */
    var swing = open * 0.85;
    var leftW = Math.max(4, Math.round(leafW * (1 - swing * 0.7)));
    var rightW = Math.max(4, Math.round(leafW * (1 - swing * 0.5)));
    cube(g, x + 1, top - wz + 4, leftW, h - 8, Math.max(4, wz - 4), doorCol, false);
    cube(g, x + TILE - rightW - 1, top - wz + 4, rightW, h - 8, Math.max(4, wz - 4), shade(doorCol, 0.85), false);

    g.save();
    g.globalAlpha = (0.75 + 0.25 * pulse) * open;
    g.strokeStyle = "#fff0a8";
    g.lineWidth = 2.5;
    g.strokeRect(voidX + 1.5, top + 3.5, voidW - 3, h - 7);
    /* Bold chevron pointing into the hall. */
    var cx = x + TILE * 0.55, cy = top + h * 0.5;
    g.fillStyle = "#fff0a8";
    g.beginPath();
    g.moveTo(cx - 6, cy - 10);
    g.lineTo(cx + 8, cy);
    g.lineTo(cx - 6, cy + 10);
    g.closePath();
    g.fill();
    g.restore();
  }

  function drawWorld(g) {
    var bio = (room && room.tileset) || biomeOf(S.floor);
    var center = room && room.centerTileset;
    var wz = Math.round(TILE * WALL_Z);
    var rows = playRows(), cols = playCols();
    var y, x, wall, b, c, i, L, s, sp, z, f, p;
    var cx0 = Math.floor(cols * 0.28), cx1 = Math.ceil(cols * 0.72);
    var cy0 = Math.floor(rows * 0.28), cy1 = Math.ceil(rows * 0.72);
    /* floor for EVERY tile first, or a wall's lifted top is painted over by the
       floor of the tile above it. */
    for (y = 0; y < rows; y++) {
      for (x = 0; x < cols; x++) {
        var floorPal = bio.floor;
        if (center && x >= cx0 && x < cx1 && y >= cy0 && y < cy1) floorPal = center.floor;
        g.fillStyle = floorPal[(x + y) & 1];
        g.fillRect(x * TILE, y * TILE, TILE, TILE);
      }
    }
    if (S.scaleProbe && player) drawScaleProbe(g, wz);
    /* Row-sorted north→south: actors then cubes so south walls occlude feet.
       North border: one footprint, taller front face (height, not thickness).
       Hoop paints after the north face so a wallH-3 board sits ON the wall. */
    for (y = 0; y < rows; y++) {
      if (room) {
        for (c = 0; c < room.chests.length; c++) {
          if (sortRow(room.chests[c].y) === y) drawChest(g, room.chests[c]);
        }
        for (i = 0; i < room.enemies.length; i++) {
          if (sortRow(room.enemies[i].y) === y) drawEnemy(g, room.enemies[i]);
        }
      }
      for (L = 0; L < S.loot.length; L++) {
        if (sortRow(S.loot[L].y) === y) drawLoot(g, S.loot[L]);
      }
      if (ball && !ball.live && sortRow(ball.groundY != null ? ball.groundY : ball.y) === y) drawBallObj(g, ball, false);
      if (player && sortRow(player.y) === y) drawPlayer(g);
      if (ball && ball.live && sortRow(ball.y) === y) drawBallObj(g, ball, true);
      if (room && room.blocks) {
        for (b = 0; b < room.blocks.length; b++) {
          var bl = room.blocks[b];
          if (sortRow(bl.y) !== y) continue;
          var tLife = bl.maxLife ? Math.max(0, bl.life / bl.maxLife) : 1;
          var tHp = bl.maxHp ? Math.max(0, bl.hp / bl.maxHp) : 1;
          var t = Math.min(tLife, tHp);
          var bh = TILE * (0.42 + 0.58 * t);
          var bz = Math.round(wz * (0.35 + 0.65 * t));
          g.globalAlpha = 0.38 + 0.62 * t;
          cube(g, bl.x - TILE * 0.5, bl.y - TILE * 0.5 - bz + (TILE - bh), TILE, bh, bz, t < 0.35 ? "#5a4030" : "#6a5a44");
          g.globalAlpha = 1;
        }
      }
      for (x = 0; x < cols; x++) {
        wall = room && room.grid && room.grid[y] ? room.grid[y][x] : 1;
        if (!wall) continue;
        var wh = wallHeightPx(x, y, cols, rows);
        /* Floor keeps the checkerboard; walls are one solid colour so height
           (front face) does not read as alternating thickness rows. */
        var col = bio.walls[0];
        var foot = y * TILE;
        cube(g, x * TILE, foot - wh, TILE, TILE, wh, col);
        /* seam lines on tall faces so N-block height reads as stories, not a slab */
        if (wh > TILE + 1) {
          var frontTop = foot - wh + TILE;
          var s;
          g.strokeStyle = shade(col, 0.42);
          g.lineWidth = 1;
          for (s = TILE; s < wh; s += TILE) {
            g.beginPath();
            g.moveTo(x * TILE + 1.5, frontTop + s);
            g.lineTo(x * TILE + TILE - 1.5, frontTop + s);
            g.stroke();
          }
        }
      }
      if (y === 0 && room && room.hoop) drawHoop(g, room.hoop);
    }
    /* East exit after wall pass so sealed/open leaves sit on the carved hole. */
    drawExitDoor(g, wz);

    for (s = 0; s < S.shots.length; s++) drawShot(g, S.shots[s]);
    for (sp = 0; sp < S.splits.length; sp++) {
      g.fillStyle = "#f09040";
      g.beginPath(); g.arc(S.splits[sp].x, S.splits[sp].y, S.splits[sp].r, 0, 6.3); g.fill();
    }
    if (S.mode === "play" && !S.pause && S.placeArmed) drawPlaceGhost(g, wz);
    if (S.aim && ball && !ball.live) {
      var pts = aimGuide(S.aim.ang, S.aim.pow);
      /* Exit-pull: a cancelled aim keeps its line so the thumb can push back
         out and re-commit, but it greys and the ball wears a strike ring. */
      var aimOff = !!S.aim.cancel;
      g.strokeStyle = aimOff ? "rgba(200,190,170,0.22)" : "rgba(240,210,140,0.45)";
      g.lineWidth = 2;
      g.setLineDash([6, 6]);
      g.beginPath();
      for (p = 0; p < pts.length; p++) {
        if (p === 0) g.moveTo(pts[p].x, pts[p].y); else g.lineTo(pts[p].x, pts[p].y);
      }
      g.stroke();
      g.setLineDash([]);
      if (aimOff) {
        /* Ring sits on the torso (drawPlayer paints from y - sc*1.55 down). */
        var hsc = 22 * HS, rcx = player.x, rcy = player.y - hsc * 0.75, rr = hsc * 0.5, rx = rr * 0.45;
        g.strokeStyle = "rgba(230,120,100,0.85)";
        g.lineWidth = 2.5;
        g.beginPath(); g.arc(rcx, rcy, rr, 0, 6.3); g.stroke();
        g.beginPath();
        g.moveTo(rcx - rx, rcy - rx); g.lineTo(rcx + rx, rcy + rx);
        g.moveTo(rcx + rx, rcy - rx); g.lineTo(rcx - rx, rcy + rx);
        g.stroke();
      } else {
        g.fillStyle = "rgba(240,210,140,0.8)";
        g.beginPath(); g.arc(player.x + Math.cos(S.aim.ang) * 28, player.y + Math.sin(S.aim.ang) * 28, 4, 0, 6.3); g.fill();
      }
    }
    for (z = 0; z < S.particles.length; z++) {
      var pt = S.particles[z];
      g.globalAlpha = Math.max(0, pt.t * 2);
      g.fillStyle = pt.col;
      g.fillRect(pt.x, pt.y, pt.s, pt.s);
      g.globalAlpha = 1;
    }
    for (f = 0; f < S.floats.length; f++) {
      var ft = S.floats[f];
      g.globalAlpha = Math.max(0, ft.life * 1.4);
      g.fillStyle = ft.c;
      g.font = "bold 16px -apple-system, sans-serif";
      g.textAlign = "center";
      g.fillText(ft.t, ft.x, ft.y);
      g.globalAlpha = 1;
    }
    if (S.placeArmed && !S.placePull) {
      g.fillStyle = "rgba(240,176,60,0.08)";
      g.fillRect(0, 0, playW(), playH());
    }
  }

  function drawScaleProbe(g, wz) {
    /* 1–4 block height ladder: half · wall · high · deep (same extrusion metaphor). */
    var baseY = player.y;
    var foot = baseY - TILE * 0.5;
    var gap = TILE + 8;
    var x0 = player.x + 56;
    var i, h, x, s, frontTop;
    for (i = 1; i <= 4; i++) {
      h = i * TILE;
      x = x0 + (i - 1) * gap;
      cube(g, x - TILE * 0.5, foot - h, TILE, TILE, h, "#6a5a44");
      if (h > TILE + 1) {
        frontTop = foot - h + TILE;
        g.strokeStyle = shade("#6a5a44", 0.42);
        g.lineWidth = 1;
        for (s = TILE; s < h; s += TILE) {
          g.beginPath();
          g.moveTo(x - TILE * 0.5 + 1.5, frontTop + s);
          g.lineTo(x + TILE * 0.5 - 1.5, frontTop + s);
          g.stroke();
        }
      }
      if (i === clampWallH(BACK_WALL_H)) {
        g.fillStyle = "#c4a060";
        g.fillRect(x - TILE * 0.5, foot - h, TILE, 4);
      }
      g.fillStyle = "#f0e6d4";
      g.font = "bold 10px -apple-system, sans-serif";
      g.textAlign = "center";
      g.fillText(String(i), x, baseY + 18);
      g.font = "bold 8px -apple-system, sans-serif";
      g.fillStyle = "#c4b49a";
      g.fillText(WALL_H_NAME[i], x, baseY + 28);
    }
  }

  function drawPlaceGhost(g, wz) {
    if (!S.placeArmed) return;
    var ghost = placeGhostCell();
    if (!ghost) return;
    var x = ghost.tx * TILE, y = ghost.ty * TILE;
    var pull = !!S.placePull;
    g.save();
    g.globalAlpha = pull ? 0.32 : 0.78;
    cube(g, x, y - wz, TILE, TILE, wz, pull ? "#9a9080" : "#e8b84a", false);
    g.globalAlpha = 1;
    g.strokeStyle = pull ? "rgba(230,120,100,0.8)" : "#fff3b0";
    g.lineWidth = 2.5;
    g.setLineDash([6, 4]);
    g.strokeRect(x + 1.5, y - wz + 1.5, TILE - 3, TILE - 3);
    g.setLineDash([]);
    if (pull) {
      /* Exit-pull: a strike across the top face says "lift here, no block". */
      g.beginPath();
      g.moveTo(x + 7, y - wz + 7); g.lineTo(x + TILE - 7, y - wz + TILE - 7);
      g.moveTo(x + TILE - 7, y - wz + 7); g.lineTo(x + 7, y - wz + TILE - 7);
      g.stroke();
    }
    g.restore();
  }

  function drawChest(g, ch) {
    g.fillStyle = ch.open ? "#3a3020" : "#c09030";
    g.fillRect(ch.x - 12, ch.y - 10, 24, 18);
    g.fillStyle = "#201810";
    g.fillRect(ch.x - 12, ch.y - 2, 24, 3);
    if (!ch.open) {
      g.fillStyle = "#f0d060";
      g.fillRect(ch.x - 2, ch.y - 6, 4, 6);
    }
  }

  /* CHIEF BB-V5.2 — the hero, rebuilt. He was a 14x22 slab with one dot for a face,
     drawn smaller than his own 16px hitbox. He is now built from parts — legs that
     alternate as he walks, two arms, the blue gauntlet on the throwing side, a head
     with both eyes and an outline — and sized to fill the hitbox he actually has.
     Everything is derived from HS so one number changes his whole scale.
     BB-V7.8 — HS 1.7 so the hero reads smaller than the Bone Knight vs the
     same 30 CSS px tiles. v7.7 used 2.2, which matched the knight's height and
     felt too big on Joe's phone. v7.15: KNIGHT_VIS / LORD_VIS split the tiers;
     PLAYER_R matches the painted torso. */
  var HS = 1.7;

  /* CHIEF BB-V6.1 — lifted verbatim in behaviour from Joe's own v3 build
     (artifact 9c0196b1, `function cube`). This one function is why the old game
     looked like Minecraft Dungeons and the new one looked like coloured squares:
     every solid is a lit top face, a darker front face dropped by its depth, a
     seam line where the two meet, and a dark outline. Nothing else about the art
     mattered as much as this. */
  function cube(g, x, y, w, h, z, col, outline) {
    g.fillStyle = shade(col, 0.72);
    g.fillRect(x, y + h, w, z);
    g.fillStyle = shade(col, 1.22);
    g.fillRect(x, y, w, h);
    g.fillStyle = shade(col, 0.9);
    g.fillRect(x, y + h - 2, w, 2);
    if (outline !== false) {
      g.strokeStyle = shade(col, 0.38);
      g.lineWidth = 1;
      g.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    }
  }

  /* BB-V7.5 — shots used to be one yellow arc. Knives are a small blade along
     velocity; thrown knight weapons are the same silhouette he holds, just flying.
     BB-V7.18 — ember / bone / needle for themed knight volleys. */
  function drawShot(g, s) {
    if (s.inert) {
      g.save();
      g.globalAlpha = Math.max(0.12, Math.min(0.55, s.life * 1.2));
      drawShotLive(g, s);
      g.restore();
      return;
    }
    drawShotLive(g, s);
  }

  function drawShotLive(g, s) {
    if (s.kind === "weapon") drawThrownWeapon(g, s);
    else if (s.kind === "ember") drawEmber(g, s);
    else if (s.kind === "bone") drawBoneShard(g, s);
    else if (s.kind === "needle") drawNeedle(g, s);
    else drawKnife(g, s);
  }

  function drawKnife(g, s) {
    var ang = Math.atan2(s.vy, s.vx);
    var sc = s.dmg >= 2 ? 1.45 : 1.2;
    var lo = s.col || "#9aa4b0";
    var hi = s.accent || "#c8d0d8";
    var pom = s.body || "#c9a44c";
    g.save();
    g.translate(s.x, s.y);
    g.rotate(ang);
    g.globalAlpha = 0.28;
    g.fillStyle = "#0a0806";
    g.beginPath(); g.ellipse(-2 * sc, 5 * sc, 7 * sc, 2.4 * sc, 0, 0, 6.3); g.fill();
    g.globalAlpha = 1;
    g.fillStyle = lo;
    g.beginPath();
    g.moveTo(10 * sc, 0);
    g.lineTo(1 * sc, 3.2 * sc);
    g.lineTo(-6 * sc, 1.8 * sc);
    g.lineTo(-6 * sc, 0);
    g.closePath();
    g.fill();
    g.fillStyle = hi;
    g.beginPath();
    g.moveTo(10 * sc, 0);
    g.lineTo(1 * sc, -3.2 * sc);
    g.lineTo(-6 * sc, -1.8 * sc);
    g.lineTo(-6 * sc, 0);
    g.closePath();
    g.fill();
    g.fillStyle = shade(lo, 0.7);
    g.fillRect(-8 * sc, -1.6 * sc, 3.4 * sc, 3.2 * sc);
    g.fillStyle = pom;
    g.fillRect(-9.4 * sc, -1.1 * sc, 2.2 * sc, 2.2 * sc);
    g.restore();
  }

  function drawEmber(g, s) {
    var pulse = 0.85 + 0.15 * Math.sin(S.t * 18 + s.x * 0.05);
    g.save();
    g.globalAlpha = 0.3;
    g.fillStyle = "#0a0806";
    g.beginPath(); g.ellipse(s.x, s.y + 5, 8, 3, 0, 0, 6.3); g.fill();
    g.globalAlpha = 1;
    g.fillStyle = s.accent || "#ff4020";
    g.beginPath(); g.arc(s.x, s.y, 7 * pulse, 0, 6.3); g.fill();
    g.fillStyle = s.col || "#ffb040";
    g.beginPath(); g.arc(s.x - 1, s.y - 1.5, 4.2 * pulse, 0, 6.3); g.fill();
    g.fillStyle = "#fff2c0";
    g.beginPath(); g.arc(s.x - 1.5, s.y - 2, 1.8, 0, 6.3); g.fill();
    g.restore();
  }

  function drawBoneShard(g, s) {
    var ang = Math.atan2(s.vy, s.vx) + Math.PI / 2;
    var body = s.col || "#d8cdb4";
    var trim = s.body || "#79808c";
    g.save();
    g.translate(s.x, s.y);
    g.rotate(ang);
    g.globalAlpha = 0.28;
    g.fillStyle = "#0a0806";
    g.beginPath(); g.ellipse(0, 6, 7, 2.5, 0, 0, 6.3); g.fill();
    g.globalAlpha = 1;
    cube(g, -4, -12, 8, 24, 4, body);
    cube(g, -6, -14, 12, 5, 3, trim);
    cube(g, -3, 8, 6, 6, 3, shade(body, 0.8));
    g.restore();
  }

  function drawNeedle(g, s) {
    var ang = Math.atan2(s.vy, s.vx);
    var col = s.accent || "#c0e070";
    var shaft = s.col || "#24381f";
    g.save();
    g.translate(s.x, s.y);
    g.rotate(ang);
    g.globalAlpha = 0.25;
    g.fillStyle = "#0a0806";
    g.beginPath(); g.ellipse(-2, 4, 8, 2, 0, 0, 6.3); g.fill();
    g.globalAlpha = 1;
    g.fillStyle = shaft;
    g.fillRect(-10, -1.4, 16, 2.8);
    g.fillStyle = col;
    g.beginPath();
    g.moveTo(12, 0); g.lineTo(4, 3.2); g.lineTo(4, -3.2); g.closePath(); g.fill();
    g.fillStyle = shade(col, 0.7);
    g.fillRect(-12, -2.2, 3, 4.4);

  function drawThrownWeapon(g, s) {
    var ang = Math.atan2(s.vy, s.vx);
    var trim = s.col || "#79808c";
    var accent = s.accent || "#c9a44c";
    var body = s.body || "#d8cdb4";

    g.save();
    g.translate(s.x, s.y);
    g.rotate(ang);
    g.globalAlpha = 0.32;
    g.fillStyle = "#0a0806";
    g.beginPath(); g.ellipse(-4, 10, 16, 5, 0, 0, 6.3); g.fill();
    g.globalAlpha = 1;
    /* a short streak so the throw direction reads at a glance on a phone */
    g.strokeStyle = "rgba(232, 236, 240, 0.45)";
    g.lineWidth = 2;
    g.beginPath(); g.moveTo(-8, 0); g.lineTo(-28, 0); g.stroke();
    if (weap === "sword") {
      cube(g, -22, -4, 12, 8, 4, shade(body, 0.72));
      cube(g, -12, -11, 7, 22, 4, accent);

      g.fillStyle = shade(trim, 1.22);
      g.beginPath();
      g.moveTo(20, -5); g.lineTo(34, 0); g.lineTo(20, 5); g.closePath(); g.fill();
      g.strokeStyle = shade(trim, 0.4); g.lineWidth = 1;
      g.beginPath();
      g.moveTo(20, -5); g.lineTo(34, 0); g.lineTo(20, 5); g.closePath(); g.stroke();
    } else if (weap === "hammer") {
      cube(g, -24, -4, 30, 8, 4, shade(body, 0.6));
      cube(g, 4, -13, 20, 26, 8, trim);
      g.fillStyle = accent; g.fillRect(4, -2, 20, 4);
    } else if (weap === "scythe") {
      cube(g, -26, -3.5, 40, 7, 4, shade(body, 0.6));
      cube(g, 6, -18, 22, 8, 4, accent);
      cube(g, 22, -18, 7, 20, 3, accent);
    } else {
      cube(g, -28, -3, 44, 6, 3, shade(body, 0.6));
      cube(g, 14, -7, 14, 14, 4, accent);
      g.fillStyle = shade(accent, 1.2);
      g.beginPath();
      g.moveTo(28, -7); g.lineTo(42, 0); g.lineTo(28, 7); g.closePath(); g.fill();

  }

  function px(g, x, y, w, h, col) {
    g.fillStyle = col;
    g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  }

  /* CHIEF BB-V6.1 — the hero rebuilt on Joe's own `drawKid`: legs, body, head and
     hat each their own cube, and the idle bob (`sin(t*7)`) that made him feel alive
     standing still. Sized off HS so he keeps the scale Joe asked for, and coloured
     from the profile palette so EMBER, QUILL, NOVA and RIFT stay different people. */
  function drawPlayer(g) {
    var cos = player.cos || defaultCos();
    var pal = PALETTES[cos.pal] || PALETTES.ember;
    if (player.inv > 0 && Math.floor(player.inv * 12) % 2 === 0) g.globalAlpha = 0.45;
    /* BB-V7.21 — flatten + dim while DOWN so the beat reads on the body, not only
       as a screen tint. */
    if (S.downed) {
      var du = Math.min(1, S.downed.t / 0.22);
      g.globalAlpha = Math.min(g.globalAlpha, 0.55 + 0.2 * (1 - du));
      g.save();
      g.translate(player.x, player.y);
      g.scale(1, 0.55 + 0.45 * (1 - du));
      g.translate(-player.x, -player.y);
    }

    /* Joe's own offsets, unchanged: head at 0, body at 0.55, legs at 1.15, all
       measured down from py = y - s*1.55. Only `sc` is ours, so he is the size
       Joe asked for while standing in exactly the proportions that worked.
       BB-V7.19 — near a south wall the cube top overhangs onto the floor tile
       (lifted by WALL_Z). Row-sort hides feet under that lip, but bob + a low
       shadow still read as standing on the block. Soften bob, park the ellipse
       on the real floor north of the lip, and bias the paint a few px north so
       the soles clear the overhang without changing the hitbox. */
    var sc = 22 * HS;
    var moving = Math.hypot(player.vx || 0, player.vy || 0) > 12;
    var nearSouth = false;
    if (room && room.grid) {
      var ptx = Math.floor(player.x / TILE), pty = Math.floor(player.y / TILE);
      if (pty + 1 < playRows() && room.grid[pty + 1] && room.grid[pty + 1][ptx]) nearSouth = true;
    }
    var bobAmp = moving ? (nearSouth ? 0.5 : 1.4) : (nearSouth ? 0.2 : 0.45);
    var bob = Math.sin(S.t * 7) * bobAmp;
    var step = moving ? Math.sin(player.walk) : 0;
    var lift = Math.abs(step) * sc * (nearSouth ? 0.04 : 0.09);
    /* Full WALL_Z: the cube top overhangs exactly that far onto the floor. */
    var groundBias = nearSouth ? -Math.round(TILE * WALL_Z) : 0;

    var bw = cos.body === "tall" ? 0.72 : cos.body === "round" ? 0.98 : cos.body === "swift" ? 0.7 : 0.84;
    var bh = cos.body === "tall" ? 0.86 : cos.body === "round" ? 0.56 : cos.body === "swift" ? 0.64 : 0.7;

    var x = player.x, f = player.facing;
    var pxl = x - sc * 0.5, pyt = player.y - sc * 1.55 + bob + groundBias;
    var shadowY = player.y + sc * 0.08 + groundBias;

    g.fillStyle = "rgba(10,8,6,0.34)";
    g.beginPath(); g.ellipse(x, shadowY, sc * 0.42, sc * 0.13, 0, 0, 6.3); g.fill();

    cube(g, pxl + sc * 0.12, pyt + sc * 1.15 - (step > 0 ? lift : 0), sc * 0.28, sc * 0.28, sc * 0.18, pal.b);
    cube(g, pxl + sc * 0.58, pyt + sc * 1.15 - (step < 0 ? lift : 0), sc * 0.28, sc * 0.28, sc * 0.18, pal.b);

    cube(g, pxl + sc * (0.5 - bw / 2), pyt + sc * (1.25 - bh), sc * bw, sc * bh, sc * 0.22, pal.a);

    var armA = S.aim ? S.aim.ang : (f > 0 ? -0.15 : Math.PI + 0.15);
    /* BB-V7.23 — while dribbling, the gauntlet taps toward the bounce instead of
       hanging in a static throw pose. */
    if (!S.aim && ball && !ball.live && !S.downed) {
      var tap = Math.sin(ball.dribble || 0);
      var base = f > 0 ? 1.05 : Math.PI - 1.05;
      armA = base + tap * 0.55;
    }
    var ax = x + Math.cos(armA) * sc * (bw * 0.5 + 0.14);
    var ay = pyt + sc * 0.7 + Math.sin(armA) * sc * 0.2;
    cube(g, ax - sc * 0.12, ay, sc * 0.24, sc * 0.3, sc * 0.1, pal.a);
    cube(g, ax - sc * 0.16, ay + sc * 0.26, sc * 0.32, sc * 0.2, sc * 0.09, "#4a80c8");

    cube(g, pxl + sc * 0.18, pyt, sc * 0.64, sc * 0.58, sc * 0.2, pal.skin);
    g.fillStyle = "#1a1a1a";
    var e = Math.max(3, sc * 0.08), ex = f >= 0 ? e * 0.5 : -e * 0.5;
    g.fillRect(pxl + sc * 0.32 + ex, pyt + sc * 0.2, e, e);
    g.fillRect(pxl + sc * 0.52 + ex, pyt + sc * 0.2, e, e);

    drawHat(g, x, pyt, cos.hat, pal, sc);
    if (S.downed) g.restore();
    g.globalAlpha = 1;
  }

  /* CHIEF BB-V6.1 — hats as cubes on top of the head cube, Joe's own placement. */
  function drawHat(g, x, y, hat, pal, sc) {
    if (hat === "none") return;
    var pxl = x - sc * 0.5;
    if (hat === "cap") {
      cube(g, pxl + sc * 0.12, y - sc * 0.26, sc * 0.76, sc * 0.3, sc * 0.12, pal.c);
      cube(g, pxl + sc * 0.5, y - sc * 0.02, sc * 0.5, sc * 0.12, sc * 0.05, shade(pal.c, 0.85));
    } else if (hat === "bow") {
      cube(g, pxl + sc * 0.1, y - sc * 0.18, sc * 0.26, sc * 0.24, sc * 0.08, pal.c);
      cube(g, pxl + sc * 0.64, y - sc * 0.18, sc * 0.26, sc * 0.24, sc * 0.08, pal.c);
      cube(g, pxl + sc * 0.42, y - sc * 0.12, sc * 0.16, sc * 0.16, sc * 0.06, shade(pal.c, 1.1));
    } else if (hat === "crown") {
      cube(g, pxl + sc * 0.16, y - sc * 0.2, sc * 0.68, sc * 0.18, sc * 0.08, "#e0c050");
      g.fillStyle = "#f0d870";
      g.fillRect(pxl + sc * 0.2, y - sc * 0.38, sc * 0.1, sc * 0.2);
      g.fillRect(pxl + sc * 0.45, y - sc * 0.44, sc * 0.12, sc * 0.26);
      g.fillRect(pxl + sc * 0.7, y - sc * 0.38, sc * 0.1, sc * 0.2);
    } else if (hat === "helm") {
      cube(g, pxl + sc * 0.1, y - sc * 0.22, sc * 0.8, sc * 0.36, sc * 0.16, "#8a9098");
      g.fillStyle = "#1b1f24";
      g.fillRect(pxl + sc * 0.2, y + sc * 0.08, sc * 0.6, sc * 0.09);
    } else if (hat === "flower") {
      cube(g, pxl + sc * 0.14, y - sc * 0.14, sc * 0.72, sc * 0.14, sc * 0.05, shade(pal.c, 0.8));
      g.fillStyle = pal.c;
      g.beginPath();
      g.arc(pxl + sc * 0.3, y - sc * 0.2, sc * 0.12, 0, 6.3);
      g.arc(pxl + sc * 0.7, y - sc * 0.2, sc * 0.12, 0, 6.3);
      g.arc(pxl + sc * 0.5, y - sc * 0.32, sc * 0.12, 0, 6.3);
      g.fill();
      g.fillStyle = "#f0e060";
      g.beginPath(); g.arc(pxl + sc * 0.5, y - sc * 0.2, sc * 0.08, 0, 6.3); g.fill();
    } else if (hat === "ribbon") {
      cube(g, pxl + sc * 0.14, y - sc * 0.1, sc * 0.72, sc * 0.12, sc * 0.05, pal.c);
      g.fillStyle = shade(pal.c, 0.85);
      g.fillRect(pxl + sc * 0.2, y + sc * 0.02, sc * 0.11, sc * 0.5);
      g.fillRect(pxl + sc * 0.68, y + sc * 0.02, sc * 0.11, sc * 0.42);
    } else if (hat === "beret") {
      cube(g, pxl + sc * 0.14, y - sc * 0.2, sc * 0.72, sc * 0.26, sc * 0.09, pal.c);
      g.fillStyle = shade(pal.c, 1.15);
      g.fillRect(pxl + sc * 0.72, y - sc * 0.28, sc * 0.12, sc * 0.1);
    }
  }

  function drawBallObj(g, b, trails) {
    /* BB-V7.13 — during the post-boss hoop window a live ball throws a hotter
       title-art trail so the shot reads as a highlight-reel heave. */
    var skin = player && player.cos ? player.cos.ball : "classic";
    var trail = player && player.cos ? player.cos.trail : "spark";
    var hoopHeat = !!(S.hoopReady && b.live && !b.ret && room && room.hoop && !room.hoop.swished);
    var swishDrop = !!(room && room.hoop && room.hoop.swished && room.hoop.netT > 0 && b.live);
    if (trails && b.trail) {
      var n = b.trail.length;
      for (var i = 0; i < n; i++) {
        var t = b.trail[i];
        var u = (i + 1) / n;
        if (hoopHeat || swishDrop) {
          /* title-art fire arc: soft ember glow under a bright core */
          var sz = (hoopHeat ? 3.2 : 2.4) + u * (hoopHeat ? 5.5 : 3.5);
          g.globalAlpha = u * (hoopHeat ? 0.42 : 0.32);
          g.fillStyle = swishDrop ? "#fff2c0" : "#ff6a18";
          g.beginPath(); g.arc(t.x, t.y, sz, 0, 6.3); g.fill();
          g.globalAlpha = u * (hoopHeat ? 0.85 : 0.7);
          g.fillStyle = swishDrop ? "#ffe070" : (u > 0.7 ? "#ffe8a0" : "#ffb040");
          g.beginPath(); g.arc(t.x, t.y, sz * 0.45, 0, 6.3); g.fill();
        } else {
          g.globalAlpha = u * 0.5;
          if (trail === "petals") g.fillStyle = "#f0a0b8";
          else if (trail === "flame") g.fillStyle = "#f08030";
          else if (trail === "ribbon") g.fillStyle = "#d0a0ff";
          else if (trail === "smoke") g.fillStyle = "#888";
          else if (trail === "pixels") g.fillStyle = "#80e0d0";
          else g.fillStyle = "#f0a050";
          g.fillRect(t.x - 2, t.y - 2, 4, 4);
        }
      }
      g.globalAlpha = 1;
    }
    if (hoopHeat) {
      /* corona so the heave reads at a glance before the trail fills in */
      var pulse = 0.55 + 0.25 * Math.sin(S.t * 14);
      g.globalAlpha = 0.35 * pulse;
      g.fillStyle = "#ff8020";
      g.beginPath(); g.arc(b.x, b.y, b.r + 7, 0, 6.3); g.fill();
      g.globalAlpha = 0.55 * pulse;
      g.fillStyle = "#ffe070";
      g.beginPath(); g.arc(b.x, b.y, b.r + 3.5, 0, 6.3); g.fill();
      g.globalAlpha = 1;
    }
    /* CHIEF BB-V6.2 — Joe's `drawBallOn`: a radial-lit sphere with a shadow under it
       and four seam arcs that rotate with travel, instead of a flat disc with a cross
       drawn on top. This is what gives the ball weight.
       BB-V7.23 — held dribble: shadow stays on the ground, shrinks with lift, and
       the ball squashes slightly on each floor kiss. */
    var cols = ballCols();
    var lift = (!b.live && b.lift) ? b.lift : 0;
    var squash = (!b.live && b.squash) ? b.squash : 0;
    var spin = b.live ? Math.hypot(b.vx, b.vy) * 0.0006 : (lift > 6 ? 0.035 : 0.004);
    b.rot = (b.rot || 0) + spin;
    var shadowY = b.y + b.r * 0.78 + lift;
    var shadowS = 1 - Math.min(0.5, lift / 36);
    g.fillStyle = "rgba(0,0,0," + (0.22 + 0.18 * shadowS) + ")";
    var srx = b.r * 0.78 * shadowS, sry = b.r * 0.28 * shadowS;
    if (ellipseOk(srx, sry)) {
      g.beginPath(); g.ellipse(b.x, shadowY, srx, sry, 0, 0, 6.3); g.fill();
    }
    var rx = b.r * (1 + squash * 0.35), ry = b.r * (1 - squash * 0.45);
    if (!ellipseOk(rx, ry)) { rx = Math.max(1, b.r || 8); ry = rx; }
    var grdR = Math.max(rx, ry);
    var grd = g.createRadialGradient(b.x - rx * 0.35, b.y - ry * 0.38, Math.max(0.08, ry * 0.08), b.x, b.y, grdR);
    grd.addColorStop(0, cols.hi);
    grd.addColorStop(1, cols.lo);
    g.fillStyle = grd;
    g.beginPath(); g.ellipse(b.x, b.y, rx, ry, 0, 0, 6.3); g.fill();
    g.strokeStyle = cols.seam;
    g.lineWidth = Math.max(1.5, b.r * 0.1);
    g.save();
    g.translate(b.x, b.y); g.rotate(b.rot); g.scale(rx / b.r, ry / b.r);
    g.beginPath(); g.arc(0, 0, b.r * 0.92, 0, 6.3); g.stroke();
    g.beginPath(); g.moveTo(0, -b.r * 0.92); g.lineTo(0, b.r * 0.92); g.stroke();
    g.beginPath(); g.arc(b.r * 0.95, 0, b.r * 0.85, Math.PI * 0.65, Math.PI * 1.35); g.stroke();
    g.beginPath(); g.arc(-b.r * 0.95, 0, b.r * 0.85, -Math.PI * 0.35, Math.PI * 0.35); g.stroke();
    g.restore();
    if (player && player.permaFire) {
      g.fillStyle = "rgba(240,80,20,0.45)";
      g.beginPath(); g.arc(b.x, b.y, b.r + 3, 0, 6.3); g.fill();
    }
  }

  /* BB-V7.3 — the four mini-bosses were ONE branch and a colour swap, which broke
     the playtester's own rule that bosses look visibly different from each other.
     They were also the last sprites in the game still drawn as flat fillRects: the
     hero and the trash mobs were rebuilt on cube() and the bosses were never
     revisited, so the biggest thing in the room was the least-lit thing in it.
     Each knight now gets its own helm, shoulders and weapon on a shared skeleton,
     drawn with the same cube() the hero uses. No sprite sheet, no added bytes.
     BB-V7.18 — pose clock from each kit attack; weapons read more distinct mid-swing. */
  var KNIGHT = {
    minibone:  { body: "#d8cdb4", trim: "#79808c", accent: "#c9a44c", eye: "#ff7a2a",
                 helm: "crest",  arms: "pauldron", weap: "sword",  cloak: "#5a2230" },
    miniforge: { body: "#d8843c", trim: "#5a3a2c", accent: "#ffb040", eye: "#ffd050",
                 helm: "horn",   arms: "slab",     weap: "hammer", cloak: "#4a1c14" },
    miniash:   { body: "#9a8c7c", trim: "#4a443c", accent: "#a8dce4", eye: "#9fe8f0",
                 helm: "hood",   arms: "spike",    weap: "scythe", cloak: "#2c3038" },
    minithorn: { body: "#4e8c58", trim: "#24381f", accent: "#c0e070", eye: "#d8ff80",
                 helm: "antler", arms: "bramble",  weap: "lance",  cloak: "#243a20" }
  };

  function drawKnightWeapon(g, k, wx, yt, u, face, lift, swing, pose) {
    var sw = swing || 0;
    if (k.weap === "sword") {
      /* bone-blade: notched edge + gold crossguard */
      var sx = pose === "spire" ? wx - face * u * 0.1 : wx;
      var sy = yt - lift;
      cube(g, sx - u * 0.13, sy + u * 0.86, u * 0.26, u * 0.46, u * 0.12, shade(k.body, 0.72));
      cube(g, sx - u * 0.11, sy - u * 0.10, u * 0.22, u * 1.00, u * 0.10, k.trim);
      cube(g, sx - u * 0.06, sy + u * 0.10, u * 0.08, u * 0.14, u * 0.04, shade(k.body, 1.1));
      cube(g, sx - u * 0.06, sy + u * 0.36, u * 0.08, u * 0.14, u * 0.04, shade(k.body, 1.1));
      cube(g, sx - u * 0.25, sy + u * 0.80, u * 0.50, u * 0.14, u * 0.08, k.accent);
    } else if (k.weap === "hammer") {
      /* slag maul: thick head, ember stripe, short haft on slam wind */
      var hl = pose === "slam" ? lift * 1.15 : lift;
      cube(g, wx - u * 0.09, yt + u * 0.10 - hl, u * 0.18, u * 1.36, u * 0.09, shade(k.body, 0.6));
      cube(g, wx - u * 0.34, yt - u * 0.28 - hl, u * 0.68, u * 0.50, u * 0.24, k.trim);
      g.fillStyle = k.accent; g.fillRect(wx - u * 0.34, yt - u * 0.08 - hl, u * 0.68, u * 0.09);
      g.fillStyle = "#ff6030"; g.fillRect(wx - u * 0.28, yt - u * 0.22 - hl, u * 0.56, u * 0.06);
    } else if (k.weap === "scythe") {
      /* ash reaper: long crook, blade sweeps with swing */
      var hook = face * (u * 0.34 + sw * u * 0.55);
      var tipY = yt - u * 0.44 - lift + sw * u * 0.35;
      cube(g, wx - u * 0.08, yt - u * 0.10 - lift, u * 0.16, u * 1.66, u * 0.08, shade(k.body, 0.6));
      cube(g, wx - hook, tipY, u * 0.52, u * 0.16, u * 0.08, k.accent);
      cube(g, wx - hook, tipY + u * 0.14, u * 0.16, u * 0.28, u * 0.06, k.accent);
      cube(g, wx - hook - face * u * 0.12, tipY - u * 0.08, u * 0.18, u * 0.10, u * 0.05, shade(k.accent, 1.15));
    } else {
      /* thorn lance: barbed tip, leveled on charge */
      var lx = pose === "charge" ? wx + face * u * (0.2 + lift * 0.4) : wx;
      var ly = pose === "charge" ? yt + u * 0.15 : yt;
      var ll = pose === "charge" ? lift * 0.2 : lift;
      cube(g, lx - u * 0.07, ly - u * 0.30 - ll, u * 0.14, u * 1.96, u * 0.07, shade(k.body, 0.6));
      cube(g, lx - u * 0.15, ly - u * 0.52 - ll, u * 0.30, u * 0.26, u * 0.10, k.accent);
      cube(g, lx - u * 0.20, ly - u * 0.18 - ll, u * 0.10, u * 0.12, u * 0.04, k.accent);
      cube(g, lx + u * 0.10, ly - u * 0.02 - ll, u * 0.10, u * 0.12, u * 0.04, k.accent);
      g.fillStyle = shade(k.accent, 1.2);
      g.beginPath();
      g.moveTo(lx + u * 0.07, ly - u * 0.52 - ll);
      g.lineTo(lx + face * u * 0.28, ly - u * 0.38 - ll);
      g.lineTo(lx + u * 0.07, ly - u * 0.24 - ll);
      g.closePath(); g.fill();
    }
  }

  function drawKnight(g, e) {
    ensureKnight(e);
    var k = KNIGHT[e.type] || KNIGHT.minibone;
    var body = e.flash > 0 ? "#ffffff" : k.body;
    var u = artR(e) * 1.35;
    var x = e.x;
    e.artH = u * 2.86;
    if (e.bobPhase == null) e.bobPhase = Math.random() * 6.3;
    var tell = 0;
    if (e.tell > 0) {
      tell = e.tellMax > 0 ? 1 - Math.max(0, e.tell) / e.tellMax : Math.min(1, e.tell);
    }
    var liftPose = (e.bladeLift != null && e.bladeLift > 0) ? e.bladeLift : tell;
    var bob = Math.sin(S.t * 2.0 + e.bobPhase) * u * 0.05 - liftPose * u * 0.08;
    var crouch = (e.crouch || 0) * u;

    g.fillRect(hx + u * 0.10, hy - u * 0.22, u * 0.22, u * 0.20);
    g.fillStyle = EMBER;
    g.fillRect(hx - u * 0.26, hy - u * 0.16, u * 0.10, u * 0.08);
    g.fillRect(hx + u * 0.16, hy - u * 0.16, u * 0.10, u * 0.08);
    /* jaw under skull plate */
    cube(g, hx - u * 0.30, hy + u * 0.08, u * 0.60, u * 0.16, u * 0.10, shade(BONE, 0.85));
    /* thick slab blade — nearly as wide as the skull plate */
    cube(g, hx - u * 0.22, hy - u * 1.95, u * 0.44, u * 1.70, u * 0.14, STEEL);
    g.fillStyle = shade(STEEL, 1.15);
    g.fillRect(hx - u * 0.08, hy - u * 1.90, u * 0.10, u * 1.55);
    /* three ember runes down the blade */
    g.fillStyle = EMBER;
    g.globalAlpha = 0.65 + 0.35 * Math.sin(S.t * 5.5);
    for (var rune = 0; rune < 3; rune++) {
      g.fillRect(hx - u * 0.12, hy - u * (1.70 - rune * 0.42), u * 0.24, u * 0.14);
    }
    g.globalAlpha = 1;
    if (e.atk && e.atkT >= e.atkWind && e.atkT < e.atkWind + e.atkActive) {
      g.fillStyle = "#fff2c0";
      g.globalAlpha = 0.75;
      g.fillRect(hx - u * 0.18, hy - u * 2.05, u * 0.36, u * 0.14);
      g.globalAlpha = 1;
    }
    g.restore();

    /* ===== SKULL HEAD — big exposed skull, not a helm ===== */
    cube(g, x - u * 0.46, yt + u * 0.02, u * 0.92, u * 0.66, u * 0.28, body);
    /* cheek / jaw */
    cube(g, x - u * 0.34, yt + u * 0.62, u * 0.68, u * 0.22, u * 0.16, shade(body, 0.9));
    /* eye sockets */
    g.fillStyle = "#0a0604";
    g.fillRect(x - u * 0.34, yt + u * 0.20, u * 0.28, u * 0.28);
    g.fillRect(x + u * 0.06, yt + u * 0.20, u * 0.28, u * 0.28);
    g.fillStyle = EMBER;
    var glow = 0.6 + 0.4 * Math.sin(S.t * 3.0 + e.bobPhase);
    if (e.atk) glow = 0.9 + 0.1 * Math.sin(S.t * 14);
    g.globalAlpha = Math.min(1, glow);
    g.fillRect(x - u * 0.26 + face * u * 0.03, yt + u * 0.28, u * 0.14, u * 0.12);
    g.fillRect(x + u * 0.14 + face * u * 0.03, yt + u * 0.28, u * 0.14, u * 0.12);
    g.globalAlpha = 1;
    /* nasal cavity */
    g.fillStyle = "#0a0604";
    g.fillRect(x - u * 0.06, yt + u * 0.48, u * 0.12, u * 0.14);
    /* teeth */
    for (var tooth = 0; tooth < 5; tooth++) {
      g.fillStyle = "#0a0604";
      g.fillRect(x - u * 0.28 + tooth * u * 0.12, yt + u * 0.64, u * 0.06, u * 0.18);
    }

    /* ===== ORNATE CROWN + WIND-UP KEY ===== */
    cube(g, x - u * 0.56, yt - u * 0.22, u * 1.12, u * 0.32, u * 0.16, GOLD);
    /* jewel settings */
    g.fillStyle = EMBER;
    g.fillRect(x - u * 0.42, yt - u * 0.12, u * 0.14, u * 0.12);
    g.fillRect(x - u * 0.07, yt - u * 0.14, u * 0.14, u * 0.14);
    g.fillRect(x + u * 0.28, yt - u * 0.12, u * 0.14, u * 0.12);
    g.fillStyle = "#4a80c8";
    g.fillRect(x - u * 0.24, yt - u * 0.10, u * 0.10, u * 0.08);
    g.fillRect(x + u * 0.14, yt - u * 0.10, u * 0.10, u * 0.08);
    /* crown points */
    cube(g, x - u * 0.54, yt - u * 0.52, u * 0.20, u * 0.36, u * 0.08, GOLD);
    cube(g, x - u * 0.12, yt - u * 0.64, u * 0.24, u * 0.48, u * 0.10, GOLD);
    cube(g, x + u * 0.34, yt - u * 0.52, u * 0.20, u * 0.36, u * 0.08, GOLD);
    /* wind-up key rising from crown center */
    cube(g, x - u * 0.07, yt - u * 0.98, u * 0.14, u * 0.42, u * 0.07, GOLD);
    cube(g, x - u * 0.24, yt - u * 1.10, u * 0.48, u * 0.18, u * 0.08, shade(GOLD, 1.18));
    cube(g, x - u * 0.28, yt - u * 1.06, u * 0.10, u * 0.10, u * 0.05, shade(GOLD, 0.85));
    cube(g, x + u * 0.18, yt - u * 1.06, u * 0.10, u * 0.10, u * 0.05, shade(GOLD, 0.85));

    g.restore(); /* lean */

    if (e.atk && e.atkT < e.atkWind) {
      var wt = e.atkT / e.atkWind;
      g.strokeStyle = "rgba(240,220,140," + (0.28 + wt * 0.5) + ")";
      g.lineWidth = 2.8;
      g.beginPath();
      g.arc(x, e.y - u * 0.55, u * (1.55 + Math.sin(S.t * 16) * 0.1), 0, 6.3);
      g.stroke();
    }
  }

  function drawEnemy(g, e) {
    if (!e.alive && e.deadT <= 0) return;
    var a = !e.alive ? Math.max(0, e.deadT) : 1;
    g.globalAlpha = a;
    /* BB-V7.15 — trash / knight / lord each have their own vis. Hurtboxes are
       fit to the painted torso in fitSilhouette (not a shared r*N halo). */
    g.save();
    g.translate(e.x, e.y);
    g.scale(enemyVis(e), enemyVis(e));
    g.translate(-e.x, -e.y);
    /* CHIEF BB-V5.2 — boss art is drawn from fixed pixel offsets, so it is scaled
       about the boss's own centre to match the radius it now carries. */
    var bossScale = e.boss === "ash" ? 1.2 : (e.boss === "mini" || e.boss === "bone" || e.boss === "slag" || e.boss === "lord") ? 1 : e.boss ? 1.35 : 1;
    if (bossScale !== 1) { g.save(); g.translate(e.x, e.y); g.scale(bossScale, bossScale); g.translate(-e.x, -e.y); }
    if (e.boss === "ash") {
      g.fillStyle = "#2a2018";
      g.fillRect(e.x - 28, e.y - 20, 56, 48);
      g.fillStyle = "#c06030";
      g.fillRect(e.x - 22, e.y - 14, 18, 14); g.fillRect(e.x + 4, e.y - 14, 18, 14);
      g.fillStyle = "#f0a040";
      g.fillRect(e.x - 8, e.y + 4, 16, 20);
      g.fillStyle = "#1a1008";
      g.fillRect(e.x - 14, e.y - 8, 8, 6); g.fillRect(e.x + 6, e.y - 8, 8, 6);
      if (e.tell > 0) {
        g.strokeStyle = "rgba(255,80,40,0.7)";
        g.lineWidth = 3;
        g.beginPath(); g.arc(e.x, e.y, 70 + Math.sin(S.t * 12) * 6, 0, 6.3); g.stroke();
        g.fillStyle = "rgba(80,200,80,0.18)";
        g.beginPath(); g.moveTo(e.x, e.y); g.arc(e.x, e.y, 196, e.gap - 0.575, e.gap + 0.575); g.closePath(); g.fill();
        g.fillStyle = "#80f080";
        g.font = "bold 14px sans-serif"; g.textAlign = "center";
        g.fillText("GAP", e.x + Math.cos(e.gap) * 90, e.y + Math.sin(e.gap) * 90);
      }
      if (e.ringOn) {
        g.strokeStyle = "#ff6030";
        g.lineWidth = 8;
        g.beginPath();
        g.arc(e.x, e.y, e.ringR, e.gap + 0.575, e.gap - 0.575 + Math.PI * 2);
        g.stroke();
        g.strokeStyle = "#80f080";
        g.lineWidth = 6;
        g.beginPath();
        g.arc(e.x, e.y, e.ringR, e.gap - 0.575, e.gap + 0.575);
        g.stroke();
      }
    } else if (e.boss === "lord") {
      drawSkullLord(g, e);
    } else if (e.boss === "bone") {
      g.fillStyle = "#e8e0d0";
      g.fillRect(e.x - 16, e.y - 18, 32, 40);
      g.fillStyle = "#f4eee0";
      g.fillRect(e.x - 14, e.y - 36, 28, 22);
      g.fillStyle = "#1a120c";
      g.fillRect(e.x - 8, e.y - 28, 6, 6); g.fillRect(e.x + 2, e.y - 28, 6, 6);
      g.fillRect(e.x - 6, e.y - 18, 12, 3);
      for (var r = 0; r < 4; r++) g.fillRect(e.x - 12, e.y - 8 + r * 7, 24, 3);
    } else if (e.boss === "slag") {
      g.fillStyle = "#d07030";
      g.fillRect(e.x - 17, e.y - 18, 34, 42);
      g.fillStyle = "#f0a050";
      g.fillRect(e.x - 14, e.y - 38, 28, 22);
      g.fillStyle = "#1a1008";
      g.fillRect(e.x - 8, e.y - 30, 6, 6); g.fillRect(e.x + 2, e.y - 30, 6, 6);
      g.fillStyle = "#ffd080";
      g.fillRect(e.x - 6, e.y - 18, 12, 4);
      for (var sr = 0; sr < 4; sr++) g.fillRect(e.x - 13, e.y - 8 + sr * 7, 26, 3);
    } else if (e.boss === "thorn") {
      g.fillStyle = "#245830";
      g.fillRect(e.x - 18, e.y - 10, 36, 36);
      g.fillStyle = "#50a060";
      g.fillRect(e.x - 12, e.y - 28, 24, 22);
      g.fillStyle = "#d07090";
      g.beginPath(); g.arc(e.x, e.y - 30, 8, 0, 6.3); g.fill();
      g.fillStyle = "#c0e070";
      g.fillRect(e.x - 22, e.y + 4, 8, 18); g.fillRect(e.x + 14, e.y + 4, 8, 18);
    } else if (e.boss === "mini") {
      drawKnight(g, e);
    } else {
      /* CHIEF BB-V6.2 — first-floor mobs rebuilt on Joe's own `drawEnemy`: one cube
         with a lit top and a dropped front face, its own idle bob so a room of them
         breathes at different rates, and two hard dark eyes. The flat square with a
         highlight strip was a worse picture of the same thing. */
      var r = artR(e), x = e.x, y = e.y;
      if (e.wob == null) e.wob = 4 + (e.seedw = (e.seedw || Math.random() * 4));
      var bob = Math.sin(S.t * e.wob + (e.bobPhase || (e.bobPhase = Math.random() * 6.3))) * r * 0.1;

      g.globalAlpha = a * 0.32;
      g.fillStyle = "#0a0806";
      g.beginPath(); g.ellipse(x, y + r * 0.95, r * 0.8, r * 0.28, 0, 0, 6.3); g.fill();
      g.globalAlpha = a;

      var col = e.flash > 0 ? "#ffffff" : e.col;
      if (e.kind === "swoop") {
        cube(g, x - r * 0.95, y - r * 0.75 + bob, r * 1.9, r * 1.0, r * 0.28, col);
        g.fillStyle = shade(col, 0.55);
        g.fillRect(x - r * 1.25, y - r * 0.45 + bob, r * 0.32, r * 0.5);
        g.fillRect(x + r * 0.93, y - r * 0.45 + bob, r * 0.32, r * 0.5);
      } else {
        cube(g, x - r, y - r * 1.0 + bob, r * 2, r * 1.85, r * 0.42, col);
        if (e.kind === "range") {
          g.fillStyle = shade(col, 0.5);
          g.fillRect(x - r * 1.05, y + r * 0.2 + bob, r * 2.1, r * 0.22);
        }
      }
      g.fillStyle = "#111";
      var ez = Math.max(3, r * 0.22);
      var eo = Math.max(-1, Math.min(1, (player.x - x) / 200)) * r * 0.1;
      g.fillRect(x - r * 0.46 + eo, y - r * 0.5 + bob, ez, ez);
      g.fillRect(x + r * 0.22 + eo, y - r * 0.5 + bob, ez, ez);
    }
    if (bossScale !== 1) g.restore();
    g.restore();
    /* HP bar sits above the painted silhouette (artH), not the contact bodyR. */
    var topOff = (e.artH || artR(e)) * enemyVis(e);
    if (e.alive) {
      var w = Math.max(20, artR(e) * 2 * enemyVis(e));
      g.fillStyle = "#2a1810";
      g.fillRect(e.x - w / 2, e.y - topOff - 10, w, 4);
      g.fillStyle = e.hp / e.maxHp > 0.35 ? "#50c060" : "#d04030";
      g.fillRect(e.x - w / 2, e.y - topOff - 10, w * Math.max(0, e.hp / e.maxHp), 4);
    }
    if (e.burn > 0 && e.alive) {
      g.fillStyle = "rgba(255,80,20,0.5)";
      g.fillRect(e.x - 6, e.y - topOff - 4, 4, 8);
    }
    g.globalAlpha = 1;
    if (e.boss && e.alive) {
      g.fillStyle = "#f0e0c0";
      g.font = "bold 12px sans-serif";
      g.textAlign = "center";
      g.fillText(e.name, e.x, e.y - topOff - 16);
    }
  }

  function drawLoot(g, it) {
    g.fillStyle = RARITY[it.rar] ? RARITY[it.rar].c : "#ccc";
    g.globalAlpha = 0.25;
    g.fillRect(it.x - 3, it.y - 40, 6, 40);
    g.globalAlpha = 1;
    if (it.kind === "heart") {
      g.fillStyle = "#e05040";
      g.beginPath();
      g.moveTo(it.x, it.y + 7);
      g.bezierCurveTo(it.x - 11, it.y - 1, it.x - 6, it.y - 10, it.x, it.y - 4);
      g.bezierCurveTo(it.x + 6, it.y - 10, it.x + 11, it.y - 1, it.x, it.y + 7);
      g.fill();
    } else if (it.kind === "ball") {
      g.fillStyle = (RARITY[it.rar] && RARITY[it.rar].c) || "#ccc";
      g.beginPath(); g.arc(it.x, it.y, 8, 0, 6.3); g.fill();
    } else {
      g.fillStyle = "#f0d060";
      g.fillRect(it.x - 5, it.y - 5, 10, 10);
    }
  }

  /* ---------- HUD / menus ---------- */
  function syncHud() {
    var play = S.mode === "play";
    var hpEl = document.getElementById("hpPips");
    if (hpEl) {
      var html = "", i, maxHp = player ? player.maxHp : 5, hp = player ? player.hp : 0;
      /* BB-V7.35 — rectangles share a track (narrower as max HP grows);
         after 8 they merge into a ticked bar, then a plain bar. */
      var trackMode = maxHp <= HP_PIPS_MAX ? "pips" : (maxHp <= HP_TICKS_MAX ? "ticks" : "bar");
      hpEl.classList.remove("hp-pips", "hp-ticks", "hp-bar");
      hpEl.classList.add("hp-" + trackMode);
      if (trackMode === "pips") {
        var gap = maxHp <= 5 ? 4 : maxHp <= 6 ? 3 : maxHp <= 7 ? 2 : 1;
        hpEl.style.setProperty("--hp-gap", gap + "px");
        for (i = 0; i < maxHp; i++) html += '<i class="hpPip' + (i < hp ? " on" : "") + '"></i>';
      } else {
        var pct = maxHp > 0 ? Math.max(0, Math.min(1, hp / maxHp)) : 0;
        var ticks = "";
        if (trackMode === "ticks") {
          for (i = 1; i < maxHp; i++) {
            ticks += '<i class="hpTick" style="left:' + ((i / maxHp) * 100).toFixed(3) + '%"></i>';
          }
        }
        html = '<div class="hpMeter" role="meter" aria-label="health" aria-valuemin="0" aria-valuemax="' + maxHp + '" aria-valuenow="' + hp + '">' +
          '<div class="hpBar"><i class="hpFill" style="width:' + Math.round(pct * 100) + '%"></i>' + ticks + "</div>" +
          '<b class="hpNum">' + hp + "/" + maxHp + "</b></div>";
      }
      var hpState = trackMode + ":" + maxHp + ":" + hp;
      if (hpEl.__bbState !== hpState) {
        hpEl.innerHTML = html;
        hpEl.__bbState = hpState;
      }
    }
    var fl = document.getElementById("flNum");
    if (fl) fl.textContent = S.floor;
    var sc = document.getElementById("scNum");
    if (sc) sc.textContent = fmt(S.score);
    var fr = document.getElementById("frNum");
    if (fr) fr.textContent = player ? String(player.frag) : "0";
    var pips = document.getElementById("placePips");
    if (pips) {
      var max = player ? Math.max(0, Math.min(PLACE_MAX_HARD, player.blockMax)) : 3;
      var have = player ? player.blockStock : 0;
      var hits = player ? (player.placeHits || 0) : 0;
      var need = placeHitsNeed();
      var pipHtml = "", slot, fill;
      var miniSvg = function (fillAmt, lit) {
        var top = lit ? "rgba(248,228,180,0.50)" : "rgba(248,228,180," + (0.10 + fillAmt * 0.4) + ")";
        var left = lit ? "rgba(210,160,70,0.42)" : "rgba(160,120,50," + (0.08 + fillAmt * 0.35) + ")";
        var right = lit ? "rgba(140,96,40,0.42)" : "rgba(100,70,30," + (0.08 + fillAmt * 0.35) + ")";
        return '<svg viewBox="0 0 18 16"><polygon points="9,1 17,5.5 9,10 1,5.5" fill="' + top + '" stroke="#f0e0c0" stroke-width="0.7"/><polygon points="1,5.5 9,10 9,15 1,10.5" fill="' + left + '" stroke="#c4b49a" stroke-width="0.6"/><polygon points="9,10 17,5.5 17,10.5 9,15" fill="' + right + '" stroke="#c4b49a" stroke-width="0.6"/></svg>';
      };
      for (slot = 0; slot < max; slot++) {
        var lit = slot < have;
        fill = (!lit && slot === have) ? Math.max(0, Math.min(1, hits / need)) : 0;
        pipHtml += '<i class="mini-cube' + (lit ? " on" : (fill > 0 ? " partial" : "")) + '">' + miniSvg(fill, lit) + "</i>";
      }
      var pipState = max + ":" + have + ":" + hits + ":" + need;
      if (pips.__bbState !== pipState) {
        pips.innerHTML = pipHtml;
        pips.__bbState = pipState;
      }
    }
    var btn = document.getElementById("btnBlock");
    if (btn) {
      btn.className = "hud-item place-btn" + (S.placeArmed ? (S.placePull ? " armed pull" : " armed") : "") +
        ((player && player.blockStock <= 0) ? " empty" : "") + (btn.classList.contains("deny") ? " deny" : "");
    }
    var hud = document.getElementById("hud");
    if (hud) {
      if (play) hud.classList.add("play");
      else hud.classList.remove("play");
    }
    var bot = document.getElementById("botbar");
    if (bot) bot.style.display = play ? "flex" : "none";
  }

  function toast(msg) {
    var box = document.getElementById("toasts");
    if (!box) return;
    var d = document.createElement("div");
    d.className = "toast";
    d.textContent = msg;
    box.appendChild(d);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 2200);
  }

  function hidePanels() {
    S.placeArmed = false;
    S.placeMode = false;
    S.placePull = false;
    S.placePid = null;
    ["splashPanel", "menuPanel", "pausePanel", "shopPanel", "floorPanel", "builderPanel", "feelPanel"].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.className = "panel";
    });
    if (typeof syncRotate === "function") syncRotate();
  }

  function releaseSplashArt() {
    /* Drop decoded splash/boss JPEGs so iOS can reclaim the bitmap during play. */
    var el = document.getElementById("splashCard");
    if (el) el.innerHTML = "";
  }

  function showBossSplash(done) {
    S.mode = "splash";
    S.pause = true;
    resize();
    hidePanels();
    var el = document.getElementById("splashCard");
    el.innerHTML =
      "<h1 class=\"splashTitle bossTitle\">THE SKULL LORD</h1>" +
      "<img class=\"splashArt bossArt\" alt=\"Skull Lord\" src=\"" + BOSS_ART + "\">" +
      "<div class=\"splashGo\">TAP TO FACE HIM</div>";
    var panel = document.getElementById("splashPanel");
    panel.className = "panel splash show";
    panel.onclick = function () {
      panel.onclick = null;
      hidePanels();
      releaseSplashArt();
      S.pause = false;
      S.mode = "play";
      resize();
      syncHud();
      if (done) done();
    };
    syncHud();
  }

  function showSplash() {
    S.mode = "splash";
    resize();
    hidePanels();
    var el = document.getElementById("splashCard");
    el.innerHTML =
      "<h1 class=\"splashTitle\">BLOCKBALL</h1>" +
      "<img class=\"splashArt\" alt=\"\" src=\"" + TITLE_ART + "\">" +
      "<h1 class=\"splashTitle\">DUNGEON</h1>" +
      "<div class=\"splashGo\">TAP TO START</div>" +
      "<div class='muted' style='margin-top:10px;font-size:12px'>" + BUILD + "</div>";

    panel.className = "panel splash show";

  function showMenu() {
    S.mode = "menu";
    resize();
    hidePanels();
    document.getElementById("menuPanel").className = "panel show";
    var el = document.getElementById("menuCard");
    var curDiff = store.difficulty || "easy";
    var profs = store.profiles.map(function (p, i) {
      return "<button class='bb" + (i === activeProfile ? " on" : "") + "' data-p='" + i + "'>" + p.token + "</button>";
    }).join("");
    var diffs = DIFF_KEYS.map(function (k) {
      var d = DIFFS[k];
      return "<button class='bb" + (k === curDiff ? " on" : "") + "' data-d='" + k + "'>" + d.label + "</button>";
    }).join("");
    var lookHead = "<h2 class='fold' id='cosHead'>LOOK <span class='foldArrow'>" + (cosOpen ? "\u25be" : "\u25b8") + "</span></h2>";
    el.className = "card menuCard" + (cosOpen ? " menuCosOpen" : "");
    /* BB-V7.30 — same four-column board in both orientations. LOOK still folds
       the dress-up (once-a-week) so RUN/DIFFICULTY/PROFILE/SEED stay on one screen. */
    if (cosOpen) {
      el.innerHTML = lookHead + "<div id='cosBox'></div>";
      paintCos();
      el.querySelector("#cosHead").onclick = function () { cosOpen = !cosOpen; showMenu(); };
      syncHud();
      return;
    }
    el.innerHTML =
      "<div class='menuHead'>" +
      "<h1 class=\"title tTop\">BLOCKBALL</h1>" +
      "<h1 class=\"title tBot\">DUNGEON</h1>" +
      "</div>" +
      "<div class='menuLay'>" +
      "<div class='menuBrand'>" +
      "<h2>RUN</h2>" +
      "<div class='row menuStack'>" +
      "<button class='bb pri' id='btnPlay'>PLAY</button>" +
      "</div>" +
      "</div>" +
      "<div class='menuCol menuDiff'>" +
      "<h2>DIFFICULTY</h2>" +
      "<div class='row menuStack' id='diffRow'>" + diffs + "</div>" +

  /* ---------- builder ---------- */
  var BLD = { grid: null, ents: [], tool: "wall", name: "MY DUNGEON", hover: null, wallH: 2 };

  function emptyLevel() {
    var t = "";
    for (var i = 0; i < COLS * ROWS; i++) t += "0";
    return { n: "MY DUNGEON", w: COLS, h: ROWS, t: t, e: [], wh: 2 };
  }
  function encodeShare(lv) {
    var raw = JSON.stringify({ n: lv.n, w: lv.w, h: lv.h, t: lv.t, e: lv.e, wh: clampWallH(lv.wh != null ? lv.wh : 2) });
    var b64 = btoa(unescape(encodeURIComponent(raw)));
    return b64.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
  }
  function decodeShare(code) {
    try {
      var s = String(code || "").trim().replace(/-/g, "+").replace(/_/g, "/");
      while (s.length % 4) s += "=";
      var raw = decodeURIComponent(escape(atob(s)));
      var lv = JSON.parse(raw);
      if (!lv || !lv.t) return null;
      lv.w = COLS; lv.h = ROWS;
      return lv;
    } catch (e) { return null; }
  }

  function openBuilder(lv) {
    hidePanels();
    S.mode = "builder";
    resize();
    lv = lv || emptyLevel();
    BLD.name = lv.n || "MY DUNGEON";
    BLD.ents = (lv.e || []).slice();
    BLD.wallH = clampWallH(lv.wh != null ? lv.wh : (lv.wallH != null ? lv.wallH : 2));
    BLD.grid = blankGrid(0);
    for (var i = 0; i < lv.t.length && i < COLS * ROWS; i++) {
      BLD.grid[Math.floor(i / COLS)][i % COLS] = lv.t.charAt(i) === "1" ? 1 : 0;
    }
    stampBorder(BLD.grid);
    document.getElementById("builderPanel").className = "panel show";
    renderBuilder();
  }

  function levelFromBld() {
    var t = "";
    for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) t += BLD.grid[y][x] ? "1" : "0";
    return { n: BLD.name, w: COLS, h: ROWS, t: t, e: BLD.ents.slice(), wh: clampWallH(BLD.wallH) };
  }

  function renderBuilder() {
    var tools = ["wall", "erase", "slime", "bat", "skel", "archer", "imp", "chest", "spawn"].map(function (t) {
      return "<button class='bb" + (BLD.tool === t ? " on" : "") + "' data-tool='" + t + "'>" + t + "</button>";
    }).join("");
    var whBtns = [1, 2, 3, 4].map(function (h) {
      return "<button class='bb" + (BLD.wallH === h ? " on" : "") + "' data-wh='" + h + "'>" + h + " " + WALL_H_NAME[h] + "</button>";
    }).join("");
    var code = encodeShare(levelFromBld());
    document.getElementById("builderCard").innerHTML =
      "<h1>DUNGEON BUILDER</h1>" +
      "<div class='row'><input class='bb' id='lvlName' value='" + BLD.name.replace(/"/g, "") + "' style='flex:1'>" +
      "<button class='bb pri' id='btnPlayLv'>PLAY</button>" +
      "<button class='bb' id='btnBldMenu'>MENU</button></div>" +
      "<h2>TOOLS</h2><div class='row' id='tools'>" + tools + "</div>" +
      "<h2>BACK WALL</h2><div class='row' id='wallHTools'>" + whBtns + "</div>" +
      "<canvas id='bld' width='960' height='540' style='width:100%;background:#14110e;touch-action:none;margin-top:8px'></canvas>" +
      "<h2>SHARE CODE</h2>" +
      "<textarea class='bb' id='copybox' readonly>" + code + "</textarea>" +
      "<div class='row'><button class='bb good' id='btnCopy'>COPY</button><button class='bb' id='btnClearB'>CLEAR</button></div>" +
      "<p class='muted'>Paint walls. Stamp enemies and a chest. Pick back-wall height (half→deep). Play it. The code is the level — screenshot it if storage dies.</p>";
    document.getElementById("lvlName").oninput = function () { BLD.name = this.value.slice(0, 24); };
    document.getElementById("tools").onclick = function (ev) {
      var b = ev.target.closest("button"); if (!b) return; BLD.tool = b.getAttribute("data-tool"); renderBuilder();
    };
    document.getElementById("wallHTools").onclick = function (ev) {
      var b = ev.target.closest("button"); if (!b) return;
      BLD.wallH = clampWallH(b.getAttribute("data-wh"));
      renderBuilder();
    };
    document.getElementById("btnPlayLv").onclick = function () {
      var lv = levelFromBld();
      hidePanels();
      startRun("BLK-CODE", lv);
    };
    document.getElementById("btnBldMenu").onclick = function () { S.mode = "menu"; hidePanels(); showMenu(); };
    document.getElementById("btnCopy").onclick = function () {
      var ta = document.getElementById("copybox");
      ta.select();
      try { document.execCommand("copy"); toast("COPIED"); } catch (e) { toast("SELECT AND COPY"); }
    };
    document.getElementById("btnClearB").onclick = function () { openBuilder(emptyLevel()); };
    var bc = document.getElementById("bld");
    paintBuilder(bc);
    function paintAt(ev) {
      var r = bc.getBoundingClientRect();
      var x = (ev.clientX - r.left) * (bc.width / r.width);
      var y = (ev.clientY - r.top) * (bc.height / r.height);
      var tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);
      if (tx <= 0 || ty <= 0 || tx >= COLS - 1 || ty >= ROWS - 1) return;
      if (BLD.tool === "wall") BLD.grid[ty][tx] = 1;
      else if (BLD.tool === "erase") {
        BLD.grid[ty][tx] = 0;
        BLD.ents = BLD.ents.filter(function (e) { return !(e.tx === tx && e.ty === ty); });
      } else if (BLD.tool === "chest") {
        BLD.ents = BLD.ents.filter(function (e) { return !(e.tx === tx && e.ty === ty); });
        BLD.ents.push({ kind: "chest", tx: tx, ty: ty });
      } else if (BLD.tool === "spawn") {
        BLD.ents = BLD.ents.filter(function (e) { return e.kind !== "spawn"; });
        BLD.ents.push({ kind: "spawn", tx: tx, ty: ty });
      } else {
        BLD.ents = BLD.ents.filter(function (e) { return !(e.tx === tx && e.ty === ty); });
        BLD.ents.push({ kind: "enemy", type: BLD.tool, tx: tx, ty: ty });
      }
      paintBuilder(bc);
    }
    var down = false;
    bc.onpointerdown = function (ev) { down = true; bc.setPointerCapture(ev.pointerId); paintAt(ev); };
    bc.onpointermove = function (ev) { if (down) paintAt(ev); };
    bc.onpointerup = function () {
      down = false;
      var ta = document.getElementById("copybox");
      if (ta) ta.value = encodeShare(levelFromBld());
    };
  }

  function paintBuilder(bc) {
    var g = bc.getContext("2d");
    g.fillStyle = DARK; g.fillRect(0, 0, bc.width, bc.height);
    for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) {
      g.fillStyle = BLD.grid[y][x] ? "#3a3328" : "#1c1814";
      g.fillRect(x * TILE, y * TILE, TILE - 1, TILE - 1);
    }
    BLD.ents.forEach(function (e) {
      var x = e.tx * TILE + 4, y = e.ty * TILE + 4;
      if (e.kind === "chest") g.fillStyle = "#c09030";
      else if (e.kind === "spawn") g.fillStyle = "#40c070";
      else g.fillStyle = "#c05040";
      g.fillRect(x, y, TILE - 8, TILE - 8);
      g.fillStyle = "#fff";
      g.font = "9px sans-serif";
      g.fillText((e.type || e.kind).slice(0, 4), x, y + 12);
    });
  }

  /* ---------- input ----------
     CHIEF BB-V5.1 — three pointers can be down at once: one on each ring and one on
     the field. Each is claimed by its pointerId at down and only that id can move or
     release it, so a thumb on the walk ring never steals the aim, and lifting one

        overshoot: t.overshoot, softWant: t.softWant, want: t.want, fit: t.fit,
        camX: cam.camX, camY: cam.camY, follow: S.camFollow ? { x: S.camFollow.x, y: S.camFollow.y, on: !!S.camFollow.on } : null,
        cols: playCols(), rows: playRows(), ww: playW(), hh: playH(),
        playerR: player ? player.r : null, ballR: ball ? ball.r : null, moveSpd: FEEL.spd, throwSpd: FEEL.throwSpd, aimMode: FEEL.aimMode, blockLife: BLOCK_LIFE, blockHits: BLOCK_HITS,
        difficulty: S.difficulty || store.difficulty || "easy",
        lastError: S.lastError ? { where: S.lastError.where, msg: S.lastError.msg } : null,
        uiPad: uiPad(),
        canvas: {
          w: canvas.width, h: canvas.height,
          dpr: +(canvas.width / Math.max(1, window.innerWidth)).toFixed(3),
          px: canvas.width * canvas.height,
          rgbaMB: +((canvas.width * canvas.height * 4) / 1e6).toFixed(2),
          parked: !needGameCanvas(),
          dprCap: uiPad() ? CANVAS_DPR_PAD : CANVAS_DPR_PHONE,
          maxPixels: CANVAS_MAX_PIXELS
        },
        stick: {
          radCss: G.rad / dpr, feelRadCss: G.feelRad / dpr,
          insetCss: G.L.cx / dpr, gapCss: (G.L.cx - G.rad) / dpr
        }
      };
    },
    /* Harness: teleport the hero (keeps follow smooth unless snap). */
    warpPlayer: function (x, y, snap) {
      if (!player) return null;
      player.x = x; player.y = y;
      if (snap && S.camFollow) S.camFollow.on = false;
      return { x: player.x, y: player.y };
    },
    difficulty: function () {
      var d = diff();
      return {
        run: S.difficulty || "easy",
        store: store.difficulty || "easy",
        label: d.label,
        hp: d.hp, dmg: d.dmg, killLoot: d.killLoot, gear: d.gear,
        rare: d.rare, epic: d.epic, legend: d.legend, fountain: d.fountain
      };
    },
    setDifficulty: function (id) {
      setDifficulty(id);
      if (S.mode === "play") S.difficulty = store.difficulty;
      return this.difficulty();
    },
    audio: function () {
      var session = null;
      try { session = navigator.audioSession ? navigator.audioSession.type : null; } catch (e) {}
      return {
        mix: store.mixAudio !== false,
        vol: sfxVol(),
        max: SFX_VOL_MAX,
        boost: SFX_GAIN,
        lastGain: lastBeepGain,
        session: session,
        ctx: audioCtx ? audioCtx.state : null
      };
    },
    setMix: function (on) {
      setMixAudio(on !== false);
      ensureAudio();
      return this.audio();
    },
    setVol: function (n) {
      setSfxVol(n);
      return this.audio();
    },
    sfx: function (name) {
      sfx(name || "ui");
      return this.audio();
    },
    feel: function () {
      return { spd: FEEL.spd, accel: FEEL.accel, brake: FEEL.brake, throwSpd: FEEL.throwSpd,
        aimMode: FEEL.aimMode, aimDead: FEEL.aimDead, aimHold: FEEL.aimHold };
    },
    walkFloor: walkFloor,
    pathOk: function () {
      if (!room || !room.spec) return null;
      var spec = room.spec, g = spec.grid, spawn = spec.spawn || { tx: 2, ty: doorY(g) };
      var cols = gCols(g), rows = gRows(g), doors = [], y;
      for (y = 0; y < rows; y++) {
        if (!g[y][0]) doors.push({ tx: 0, ty: y });
        if (!g[y][cols - 1]) doors.push({ tx: cols - 1, ty: y });
      }
      return { ok: roomPathOk(g, spawn, doors), spawn: spawn, doors: doors.length, cols: cols, rows: rows, piece: spec.piece, pathOk: spec.pathOk };
    },
    auditGen: function (floors) {
      var saved = S.seed, fails = 0, roomsN = 0, sizes = {}, pieces = {}, f, i, list, spec, g, spawn, cols, rows, y, doors;
      S.seed = "AUDIT-77";
      for (f = 1; f <= (floors || 24); f++) {
        list = buildFloor(f);
        for (i = 0; i < list.length; i++) {
          roomsN++;
          spec = list[i];
          g = spec.grid; spawn = spec.spawn; cols = gCols(g); rows = gRows(g); doors = [];
          for (y = 0; y < rows; y++) {
            if (!g[y][0]) doors.push({ tx: 0, ty: y });
            if (!g[y][cols - 1]) doors.push({ tx: cols - 1, ty: y });
          }
          if (!roomPathOk(g, spawn, doors) || !spec.pathOk) fails++;
          sizes[spec.cols + "x" + spec.rows] = (sizes[spec.cols + "x" + spec.rows] || 0) + 1;
          pieces[spec.piece] = (pieces[spec.piece] || 0) + 1;
        }
      }
      S.seed = saved;
      return { rooms: roomsN, fails: fails, sizes: sizes, pieces: pieces };
    },
    scaleProbe: function (on) { S.scaleProbe = !!on; },
    /* Paint-only back-wall HEIGHT: 1 half · 2 wall · 3 high · 4 deep (or name string). */
    wallBackStack: function (n) { return setBackWallH(n == null ? BACK_WALL_H : n); },
    wallBackH: function (n) {
      if (n != null) {
        setBackWallH(n);
        if (room) {
          room.wallH = BACK_WALL_H;
          if (room.spec) room.spec.wallH = BACK_WALL_H;
          /* remount hoop when the implied back-wall height changes */
          if (room.hoop) {
            var kept = { swished: room.hoop.swished, netT: room.hoop.netT, beamT: room.hoop.beamT, glow: room.hoop.glow };
            room.hoop = makeBossHoop(room.spec || { cols: playCols(), grid: room.grid, wallH: BACK_WALL_H });
            room.hoop.swished = kept.swished; room.hoop.netT = kept.netT;
            room.hoop.beamT = kept.beamT; room.hoop.glow = kept.glow;
          }
        }
      }
      return { h: BACK_WALL_H, name: WALL_H_NAME[BACK_WALL_H], room: room ? room.wallH : null };
    },
    wallHeights: function () {
      return { min: WALL_H_MIN, max: WALL_H_MAX, current: BACK_WALL_H, names: WALL_H_NAME };
    },
    floorWallH: function () {
      if (!S.rooms) return [];
      return S.rooms.map(function (r, i) {
        return { i: i, kind: r.kind, piece: r.piece, cols: r.cols, rows: r.rows, wallH: r.wallH, name: WALL_H_NAME[r.wallH] };
      });
    },
    gotoRoom: function (i) {
      if (!S.rooms || i < 0 || i >= S.rooms.length) return null;
      loadRoom(i);
      return this.floorWallH()[i];
    },
    placeGhost: placeGhostCell,
    placeNow: tryPlaceAtGhost,
    setStock: function (n, max) {
      if (!player) return;
      if (max != null) player.blockMax = Math.max(3, Math.min(PLACE_MAX_HARD, max));
      player.blockStock = Math.max(0, Math.min(player.blockMax, n));
      syncHud();
    },
    spawnAt: function (type, dx, dy) {
      if (!room || !player) return null;
      var e = spawnEnemy(type || "minibone", player.x + (dx == null ? 90 : dx), player.y + (dy || 0), S.floor, true);
      e.spd = 0; e.cd = 99; e.tell = 0; e.knivesLeft = 0;
      room.enemies.push(e);
      return { x: Math.round(e.x), y: Math.round(e.y), r: e.r, artR: artR(e), bodyR: bodyR(e), hitR: e.hitR || e.r, hitLift: e.hitLift || 0, boss: e.boss };
    },
    /* harness-only: start a kit attack on the most recently spawned live enemy */
    forceKnightAtk: function (kind) {
      if (!room || !room.enemies.length || !player) return null;
      var e = room.enemies[room.enemies.length - 1];
      if (!e.alive || e.boss !== "mini") return null;
      var dx = player.x - e.x, dy = player.y - e.y;
      var dist = Math.hypot(dx, dy) || 1;
      e.spd = 0; e.disarm = false; e.thrown = null; e.rearm = 0;
      startKnightAtk(e, kind || "throw", dx, dy, dist);
      return { type: e.type, atk: e.atk, wind: e.atkWind, active: e.atkActive };
    },
    knightState: function () {
      if (!room || !room.enemies.length) return null;
      var e = null, i;
      for (i = room.enemies.length - 1; i >= 0; i--) {
        if (room.enemies[i].alive && room.enemies[i].boss === "mini") { e = room.enemies[i]; break; }
      }
      if (!e) return null;
      return {
        type: e.type, name: e.name, atk: e.atk, atkT: e.atkT,
        tell: e.tell, disarm: !!e.disarm, kitRing: !!e.kitRing,
        kitRingR: e.kitRingR, ghost: e.ghost, swing: e.swing,
        bladeLift: e.bladeLift, shots: S.shots.map(function (s) { return s.kind; })
      };
    },
    /* harness-only: mutate the most recently spawned live enemy (for pose screenshots) */
    mutLast: function (patch) {
      if (!room || !room.enemies.length) return null;
      var e = room.enemies[room.enemies.length - 1], k;
      for (k in patch) e[k] = patch[k];
      return { type: e.type, name: e.name, atk: e.atk, atkT: e.atkT, hp: e.hp, maxHp: e.maxHp };
    },
    clearTrash: function () {
      if (!room) return 0;
      var n = 0, i;
      for (i = 0; i < room.enemies.length; i++) {
        var e = room.enemies[i];
        if (e.boss) continue;
        if (e.alive) n++;
        e.alive = false;
        e.deadT = 0;
      }
      S.shots = [];
      return n;
    },
    clearAll: function () {
      if (!room) return 0;
      var n = 0, i;
      for (i = 0; i < room.enemies.length; i++) {
        if (room.enemies[i].alive) n++;
        room.enemies[i].alive = false;
        room.enemies[i].deadT = 0;
      }
      room.enemies = [];
      S.shots = [];
      return n;
    },
    hideChrome: function () {
      ["toast","hudLeft","hudRight","sticks","padAim","btnPause"].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.style.visibility = "hidden";
      });
      document.querySelectorAll(".stick,.pad,#hint,#seedTag").forEach(function (el) {
        el.style.visibility = "hidden";
      });
    },
    hoop: function () {
      return room && room.hoop ? {
        x: Math.round(room.hoop.x), y: Math.round(room.hoop.y), r: room.hoop.r,
        boardY: Math.round(room.hoop.boardY), wallH: room.hoop.wallH || null,
        swished: !!room.hoop.swished, ready: !!S.hoopReady, beamT: room.hoop.beamT
      } : null;
    },
    armHoop: function () {
      if (!room) return null;
      if (!room.hoop) {
        room.hoop = makeBossHoop(room.spec || {
          cols: playCols(), grid: room.grid, wallH: room.wallH || BACK_WALL_H
        });
      }
      S.hoopReady = true;
      room.cleared = true;
      S.bossBeat = Math.max(S.bossBeat, 8);
      S.pause = false;
      if (ball) { ball.live = false; ball.ret = false; resetBallHome(); }
      return this.hoop();
    },
    setPause: function (v) { S.pause = !!v; return S.pause; },
    forceSwish: function () {
      if (!room || !room.hoop) return null;
      S.hoopReady = true;
      triggerHoopSwish(room.hoop);
      return this.hoop();
    },
    cine: function () {
      return S.cine && S.cine.active ? {
        mode: S.cine.mode,
        zoom: Math.round(S.cine.zoom * 100) / 100,
        focusX: Math.round(S.cine.focusX),
        focusY: Math.round(S.cine.focusY),
        slow: S.cine.slow || 1,
        hold: Math.round((S.cine.hold || 0) * 100) / 100
      } : null;
    },
    throwAtHoop: function (opts) {
      /* harness: opts.spd, opts.aimX/aimY (world aim point), opts.lead (px past rim) */
      if (!room) return { err: "no-room" };
      if (!room.hoop) return { err: "no-hoop" };
      if (!player) return { err: "no-player" };
      if (!ball) return { err: "no-ball" };
      opts = opts || {};
      S.hoopReady = true;
      S.bossBeat = Math.max(S.bossBeat, 6);
      var h = room.hoop;
      h.swished = false; h.netT = 0; h.beamT = 0;
      ball.live = true; ball.ret = false;
      ball.x = player.x; ball.y = player.y - 8;
      var tx = opts.aimX != null ? opts.aimX : h.x;
      var ty = opts.aimY != null ? opts.aimY : h.y;
      var dx = tx - ball.x, dy = ty - ball.y;
      var d = Math.hypot(dx, dy) || 1;
      if (opts.lead) { dx += (dx / d) * opts.lead; dy += (dy / d) * opts.lead; d = Math.hypot(dx, dy) || 1; }
      var spd = opts.spd != null ? opts.spd : 520;
      ball.vx = dx / d * spd; ball.vy = dy / d * spd;
      ball.life = opts.life != null ? opts.life : 2.8;
      ball.trail = []; ball.bounces = 0; ball.hits = []; ball.ret = false;
      return { ball: this.ballState(), hoop: this.hoop(), spd: spd };
    },
    /* sprinkle post-boss loot / residual shake for celebration previews */
    dressAftermath: function () {
      if (!room || !player) return 0;
      S.shake = Math.max(S.shake, 0.25);
      S.bossBeat = Math.max(S.bossBeat, 5);
      var n = 0, i, a, r;
      for (i = 0; i < 8; i++) {
        a = (i / 8) * Math.PI * 2;
        r = 40 + (i % 3) * 28;
        dropLoot(player.x + Math.cos(a) * r, player.y + Math.sin(a) * r * 0.55, i % 2 === 0);
        n++;
      }
      return n;
    },
    killBossCleanup: function () {
      if (!room) return null;
      var boss = null, i;
      for (i = 0; i < room.enemies.length; i++) if (room.enemies[i].boss === "lord" && room.enemies[i].alive) boss = room.enemies[i];
      if (!boss) return null;
      /* plant a dummy shot then run the real death path */
      S.shots.push({ x: boss.x, y: boss.y, vx: 40, vy: 0, r: 4, life: 2, dmg: 1, kind: "knife" });
      var trashBefore = room.enemies.filter(function (e) { return e.alive && !e.boss; }).length;
      var shotsBefore = S.shots.length;
      killEnemy(boss, false);
      return {
        trashBefore: trashBefore,
        trashAlive: room.enemies.filter(function (e) { return e.alive && !e.boss; }).length,
        shots: S.shots.map(function (s) { return { inert: !!s.inert, dmg: s.dmg, vx: s.vx }; }),
        bossBeat: S.bossBeat
      };
    },
    triggerWave: function (ratio) {
      if (!room) return null;
      var e = null, i;
      for (i = 0; i < room.enemies.length; i++) if (room.enemies[i].boss === "lord" && room.enemies[i].alive) e = room.enemies[i];
      if (!e) return null;
      ensureSkullLord(e);
      e.hp = Math.floor(e.maxHp * ratio);
      skullLordWaves(e);
      return { hp: e.hp, maxHp: e.maxHp, flags: e.waveFlags.slice(), alive: room.enemies.filter(function (o) { return o.alive; }).length };
    },
    skullState: function () {
      if (!room) return null;
      var e = null, i;
      for (i = 0; i < room.enemies.length; i++) if (room.enemies[i].boss === "lord") e = room.enemies[i];
      if (!e) return null;
      return {
        atk: e.atk, atkT: Math.round((e.atkT || 0) * 100) / 100,
        wind: e.atkWind, active: e.atkActive, recover: e.atkRecover,
        dashLen: Math.round(e.dashLen || 0), dashCommit: !!e.dashCommit,
        x: Math.round(e.x), y: Math.round(e.y), spd: e.spd,
        hp: e.hp, maxHp: e.maxHp, cd: Math.round((e.cd || 0) * 100) / 100
      };
    },
    gotoSkullLair: function (seed) {
      startRun(seed || "SKULL-ARENA");
      S.floor = SKULL_LORD_FLOOR;
      S.rooms = buildFloor(SKULL_LORD_FLOOR);
      var i, idx = S.rooms.length - 1;
      for (i = 0; i < S.rooms.length; i++) if (S.rooms[i].kind === "boss") idx = i;
      loadRoom(idx);
      S.mode = "play";
      S.pause = false;
      resize();
      hidePanels();
      if (player) { player.inv = 8; player.hp = player.maxHp; }
      return {
        cols: playCols(), rows: playRows(),
        piece: room && room.spec ? room.spec.piece : null,
        kind: room && room.kind, hoop: !!(room && room.hoop),
        tileset: room && room.tileset ? room.tileset.id : null,
        rooms: S.rooms.map(function (r) { return { kind: r.kind, piece: r.piece }; }),
        boss: this.enemies().filter(function (en) { return en.boss === "lord"; })[0] || null
      };
    },
    /* Jump to the end-of-floor knight chamber (mini) on floor 1 by default. */
    gotoKnight: function (seed, fl) {
      startRun(seed || "KNIGHT-HOOP");
      S.floor = fl || 1;
      S.rooms = buildFloor(S.floor);
      var i, idx = S.rooms.length - 1;
      for (i = 0; i < S.rooms.length; i++) if (S.rooms[i].kind === "mini") idx = i;
      loadRoom(idx);
      S.mode = "play";
      S.pause = false;
      resize();
      hidePanels();
      if (player) { player.inv = 8; player.hp = player.maxHp; }
      return {
        floor: S.floor, cols: playCols(), rows: playRows(),
        piece: room && room.spec ? room.spec.piece : null,
        kind: room && room.kind, hoop: !!(room && room.hoop),
        wallH: room ? room.wallH : null,
        hoopState: this.hoop()
      };
    },
    auditProgression: function () {
      var out = [], f, list, last, kinds;
      for (f = 1; f <= 16; f++) {
        list = buildFloor(f);
        kinds = list.map(function (r) { return r.kind; });
        last = list[list.length - 1];
        out.push({
          f: f, n: list.length, kinds: kinds,
          last: last.kind + "/" + last.piece,
          boss: (last.ents.filter(function (e) { return e.kind === "enemy"; })[0] || {}).type,
          center: last.centerTileset && last.centerTileset.id,
          intro: !!last.bossIntro
        });
      }
      return out;
    }
  };
})();
</script>
