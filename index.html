    var armLen = Math.max(5, h.y - boardBot + 3);
    cube(g, h.x - 5, boardBot - 2, 10, armLen, 5, "#d06020");
    cube(g, h.x - 8, h.y - 6, 16, 8, 5, "#e87028");
    /* orange rim */
    g.save();
    g.strokeStyle = "#e86020";
    g.lineWidth = 5;
    if (ellipseOk(h.r, h.r * 0.42)) {
      g.beginPath();
      g.ellipse(h.x, h.y, h.r, h.r * 0.42, 0, 0, 6.3);
      g.stroke();
    }
    g.strokeStyle = "#ff9040";
    g.lineWidth = 2;
    if (ellipseOk(h.r - 3, h.r * 0.42 - 1.5)) {
      g.beginPath();
      g.ellipse(h.x, h.y, h.r - 3, h.r * 0.42 - 1.5, 0, 0, 6.3);
      g.stroke();
    }
    /* net — hangs south into the room; flutters after a swish */
    var flutter = h.netT > 0 ? Math.sin(S.t * 22) * 3.5 * Math.min(1, h.netT) : 0;
    g.strokeStyle = "rgba(240,240,240,0.9)";
    g.lineWidth = 1.4;
    var i, a, x0, y0, x1, y1;
    for (i = 0; i < 8; i++) {
      a = (i / 8) * Math.PI * 2;
      x0 = h.x + Math.cos(a) * (h.r - 2);
      y0 = h.y + Math.sin(a) * (h.r * 0.42 - 1);
      x1 = h.x + Math.cos(a) * (h.r * 0.35) + flutter * Math.sin(a * 2);
      y1 = h.y + h.r * 0.95 + Math.abs(Math.sin(a)) * 4;
      g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    }
    /* cross-net weave */
    g.strokeStyle = "rgba(220,220,220,0.7)";
    g.lineWidth = 1;
    for (i = 0; i < 3; i++) {
      var yy = h.y + 8 + i * 8;
      var nrx = h.r * (0.72 - i * 0.14);
      if (!ellipseOk(nrx, 3.5)) continue;
      g.beginPath();
      g.ellipse(h.x + flutter * 0.3, yy, nrx, 3.5, 0, 0, 6.3);
      g.stroke();
    }
    g.restore();
    /* title-art golden beam on swish */
    if (h.beamT > 0) {
      var aBeam = Math.min(1, h.beamT / 0.6) * Math.min(1, h.beamT);
      g.save();
      g.globalAlpha = 0.22 + aBeam * 0.45;
      var grd = g.createLinearGradient(h.x, 0, h.x, h.y + 80);
      grd.addColorStop(0, "rgba(255,230,120,0)");
      grd.addColorStop(0.35, "rgba(255,210,60,0.95)");
      grd.addColorStop(1, "rgba(255,180,40,0)");
      g.fillStyle = grd;
      g.fillRect(h.x - 18, 0, 36, h.y + 90);
      g.globalAlpha = 0.5 * aBeam;
      g.fillStyle = "#fff6c0";
      g.fillRect(h.x - 6, 0, 12, h.y + 70);
      g.restore();
    }
    /* soft idle glow once the hoop is live for a shot */
    if (S.hoopReady && !h.swished) {
      g.save();
      g.globalAlpha = 0.2 + 0.15 * Math.sin(S.t * 4);
      g.strokeStyle = "#f0c030";
      g.lineWidth = 2;
      g.beginPath();
      if (ellipseOk(h.r + 6, h.r * 0.42 + 3)) {
        g.ellipse(h.x, h.y, h.r + 6 + Math.sin(S.t * 5) * 2, h.r * 0.42 + 3, 0, 0, 6.3);
      }
      g.stroke();
      g.restore();
    }
  }

  function loadRoom(idx) {
    S.roomI = idx;
    var spec = S.rooms[idx];
    var ents = [];
    var chests = [];
    for (var i = 0; i < spec.ents.length; i++) {
      var e = spec.ents[i];
      var x = (e.tx + 0.5) * TILE, y = (e.ty + 0.5) * TILE;
      if (e.kind === "enemy") {
        ents.push(spawnEnemy(e.type, x, y, S.floor, spec.kind === "boss", {
          hpMul: e.hpMul || 0
        }));
        if (e.revive && ents.length) ents[ents.length - 1].revive = true;
      } else if (e.kind === "chest") chests.push({ x: x, y: y, open: false, r: 14 });
    }
    room = {
      spec: spec,
      grid: spec.grid,
      enemies: ents,
      chests: chests,
      blocks: spec.blocks.slice(),
      kind: spec.kind,
      cleared: spec.cleared,
      doorReady: spec.cleared,
      spawnX: spec.spawn ? (spec.spawn.tx + 0.5) * TILE : 2.5 * TILE,
      spawnY: spec.spawn ? (spec.spawn.ty + 0.5) * TILE : (doorY(spec.grid) + 0.5) * TILE,
      hoop: null,
      tileset: spec.tileset || null,
      centerTileset: spec.centerTileset || null,
      wallH: applySpecWallH(spec)
    };
    S.lordZoom = null;
    if (roomWantsHoop(spec)) room.hoop = makeBossHoop(spec);
    var spawnEnt = spec.ents.filter(function (e) { return e.kind === "spawn"; })[0];
    if (spawnEnt) {
      room.spawnX = (spawnEnt.tx + 0.5) * TILE;
      room.spawnY = (spawnEnt.ty + 0.5) * TILE;
    }
    player.x = room.spawnX; player.y = room.spawnY;
    player.inv = 0.6;
    resetBallHome();
    S.camFollow = { x: 0, y: 0, on: false };
    S.placeMode = false;
    S.placeArmed = false;
    S.shots = []; S.splits = [];
    room.clearWait = 0;
    if (!ents.length) { room.cleared = true; room.doorReady = true; }
    if (!S.seenAimHelp) toast("LEFT RING to walk · DRAG anywhere to throw");
  }

  function startRun(seed, custom) {
    S.seed = parseSeed(seed || makeSeed());
    S.difficulty = store.difficulty || "easy";
    S.floor = 1;
    S.score = 0;
    S.runTricks = 0;
    S.hoopReady = false;
    S.bossBeat = 0;
    S.cine = null;
    S.downed = null;
    S.customPlay = !!custom;
    S.builderLevel = custom || null;
    player = freshPlayer();
    player.ballAffix = [];
    if (custom) {
      S.rooms = [customToRoom(custom)];
    } else {
      S.rooms = buildFloor(1);
    }
    loadRoom(0);
    S.mode = "play";
    resize();
    hidePanels();
    releaseSplashArt();
    syncHud();
    /* BB-V7.29 — no SEED/difficulty toast over the field; the pause card carries both. */
  }

  function customToRoom(lv) {
    var g = blankGrid(0);
    var ents = [];
    var data = lv.t || "";
    for (var i = 0; i < COLS * ROWS; i++) {
      var x = i % COLS, y = Math.floor(i / COLS);
      var ch = data.charAt(i);
      if (ch === "1") g[y][x] = 1;
      else g[y][x] = 0;
    }
    stampBorder(g);
    (lv.e || []).forEach(function (e) {
      ents.push(e);
    });
    return {
      piece: "custom", kind: "room", grid: g, ents: ents, cleared: false, blocks: [],
      name: lv.n || "CUSTOM", cols: COLS, rows: ROWS,
      spawn: { tx: 2, ty: doorY(g) }, pathOk: true,
      wallH: clampWallH(lv.wh != null ? lv.wh : (lv.wallH != null ? lv.wallH : 2))
    };
  }

  function nextRoomOrFloor() {
    S.rooms[S.roomI].cleared = true;
    if (S.roomI < S.rooms.length - 1) {
      var nxt = S.rooms[S.roomI + 1];
      if (nxt && nxt.bossIntro) {
        showBossSplash(function () {
          loadRoom(S.roomI + 1);
          toast("SKULL LORD");
        });
        return;
      }
      loadRoom(S.roomI + 1);
      toast("NEXT HALL");
      return;
    }
    if (S.customPlay) {
      toast("LEVEL CLEAR");
      S.mode = "menu";
    if (typeof syncRotate === "function") syncRotate();
      showMenu();
      return;
    }
    var wasBoss = S.rooms[S.roomI].kind === "boss";
    if (S.floor > store.bestFloor) store.bestFloor = S.floor;
    saveStore();
    S.floor += 1;
    S.rooms = buildFloor(S.floor);
    S.floorHeal = healPlayer(wasBoss ? 2 : 1);
    showFloorCard(wasBoss);
  }

  /* ---------- combat ---------- */
  function hurtPlayer(n) {
    if (S.downed || player.inv > 0) return;
    n = Math.max(1, Math.round(n * diff().dmg));
    player.hp -= n;
    player.inv = 0.9;
    S.shake = 0.25;
    sfx("hurt");
    floatTxt(player.x, player.y - 24, "-" + n, "#ff8060");
    if (player.hp <= 0) {
      player.hp = 0;
      startDowned();
    }
  }

  /* BB-V7.21 — death used to snap-heal and reload the room in one frame, which
     read as "nothing happened." Soft path: hold a short DOWN beat (no run wipe,
     no frag loss), then reset the room with loot kept. Weight without a stiff
     penalty. */
  function startDowned() {
    if (S.downed) return;
    clearSticks();
    S.aim = null;
    S.placeArmed = false;
    S.placeMode = false;
    player.vx = player.vy = 0;
    player.hp = 0;
    if (ball) { ball.live = false; ball.ret = false; }
    S.shots = [];
    S.splits = [];
    S.shake = Math.max(S.shake, 0.55);
    S.downed = { t: 0, dur: 1.55 };
    sfx("down");
    syncHud();
  }

  function updateDowned(dt) {
    if (!S.downed) return;
    S.downed.t += dt;
    if (S.downed.t >= S.downed.dur) finishDowned();
  }

  function finishDowned() {
    if (!S.downed) return;
    S.downed = null;
    player.hp = player.maxHp;
    loadRoom(S.roomI);
    player.inv = 1.4;
    toast("UP — room reset, loot kept");
    syncHud();
  }

  function drawDowned(g) {
    if (!S.downed || S.mode !== "play") return;
    var cw = canvas.width, ch = canvas.height;
    var u = Math.min(1, S.downed.t / S.downed.dur);
    var fadeIn = Math.min(1, S.downed.t / 0.18);
    var pulse = 0.55 + 0.45 * Math.sin(S.downed.t * 7);
    g.save();
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = "rgba(12, 8, 6, " + (0.42 * fadeIn) + ")";
    g.fillRect(0, 0, cw, ch);
    var grd = g.createRadialGradient(cw * 0.5, ch * 0.48, ch * 0.08, cw * 0.5, ch * 0.5, ch * 0.72);
    grd.addColorStop(0, "rgba(80, 20, 16, 0)");
    grd.addColorStop(1, "rgba(40, 8, 6, " + (0.55 * fadeIn) + ")");
    g.fillStyle = grd;
    g.fillRect(0, 0, cw, ch);
    g.globalAlpha = fadeIn;
    g.fillStyle = "#f0c8b0";
    g.font = "700 " + Math.round(Math.min(cw, ch) * 0.09) + "px Georgia, 'Times New Roman', serif";
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.fillText("DOWN", cw * 0.5, ch * 0.44);
    g.globalAlpha = fadeIn * (0.55 + 0.35 * pulse);
    g.fillStyle = "#d8c4a8";
    g.font = "600 " + Math.round(Math.min(cw, ch) * 0.028) + "px system-ui, sans-serif";
    g.fillText("room reset · loot kept", cw * 0.5, ch * 0.52);
    /* thin recover meter so the beat is readable, not a freeze */
    var barW = Math.min(220, cw * 0.28), barH = Math.max(3, ch * 0.006);
    var bx = (cw - barW) * 0.5, by = ch * 0.58;
    g.globalAlpha = fadeIn * 0.35;
    g.fillStyle = "#f0e6d4";
    g.fillRect(bx, by, barW, barH);
    g.globalAlpha = fadeIn * 0.9;
    g.fillStyle = "#e07058";
    g.fillRect(bx, by, barW * u, barH);
    g.restore();
  }

  function healPlayer(n) {
    if (!player || n <= 0) return 0;
    var roomHp = player.maxHp - player.hp;
    var got = Math.min(n, roomHp);
    if (got <= 0) return 0;
    player.hp += got;
    syncHud();
    return got;
  }

  function killEnemy(en, trick) {
    en.alive = false;
    en.deadT = 1.2;
    S.score += 10 * S.floor * (trick ? 3 : 1);
    /* BB-V7.20 — kill frags were stacking with loot shards; keep a small
       floor bonus but cut the guaranteed dump.
       BB-V7.22 — frag yield scales with difficulty. */
    var fragGain = 1 + Math.floor(S.floor / 5);
    player.frag += Math.max(1, Math.round(fragGain * diff().frag));
    sfx(trick ? "trick" : "kill");
    burst(en.x, en.y, en.col, trick ? 22 : 10);
    if (rnd() < 0.32 * diff().killLoot || en.boss) dropLoot(en.x, en.y, !!en.boss);
    maybeDropHeart(en.x, en.y, en);
    if (en.boss === "mini") startMiniDeath(en);
    else if (en.boss === "ash" || en.boss === "bone" || en.boss === "slag" || en.boss === "lord" || en.boss === "thorn") startBossDeath(en);
  }

  /* BB-V7.3 — a mini kill was indistinguishable from killing a slime: no beat, no
     fountain, no shake. It gets its own, deliberately smaller than a floor boss's
     so the floor-5 king still out-peaks the floor-1 knight.
     BB-V7.23 — knight chambers carry a lair hoop; arm a short optional swish
     window (boss rooms still hold until the make). */
  function startMiniDeath(en) {
    S.bossBeat = room && room.hoop ? 5.2 : 1.1;
    S.hoopReady = !!(room && room.hoop);
    S.muteFx = 0.25;
    S.shake = 0.38;
    sfx("boss");
    if (ball) {
      if (ball.live) ball.ret = true;
      else resetBallHome();
    }
    if (S.hoopReady) toast("SWISH THE HOOP");
    /* BB-V7.20 — mini fountain was 4 rich balls; cut to 2.
       BB-V7.22 — fountain count scales with difficulty (EASY keeps 2). */
    var n = Math.max(1, Math.round(2 * diff().fountain));
    for (var i = 0; i < n; i++) {
      (function (k) {
        setTimeout(function () { dropLoot(en.x + irnd(-26, 26), en.y + irnd(-20, 20), true); }, 90 * k);
      })(i);
    }
  }

  function startBossDeath(en) {
    /* BB-V7.13 — hold the floor card long enough for a post-boss swish at the
       lair hoop. Ball snaps home as soon as it can so the shot is available. */
    S.bossBeat = 7.5;
    S.hoopReady = !!(room && room.hoop);
    S.muteFx = 0.5;
    S.shake = 0.6;
    sfx("boss");
    if (ball) {
      if (ball.live) ball.ret = true;
      else resetBallHome();
    }
    if (S.hoopReady) toast("SWISH THE HOOP");
    /* BB-V7.12 — on floor-boss death the arena goes quiet: trash drops, shots
       freeze mid-flight so the beat is not stepped on by leftover knives. */
    if (room && room.enemies) {
      for (var ti = 0; ti < room.enemies.length; ti++) {
        var tr = room.enemies[ti];
        if (tr === en || !tr.alive || tr.boss) continue;
        tr.alive = false;
        tr.deadT = 0.55;
        burst(tr.x, tr.y, tr.col, 8);
      }
    }
    for (var si = 0; si < S.shots.length; si++) {
      S.shots[si].inert = true;
      S.shots[si].vx = 0;
      S.shots[si].vy = 0;
      S.shots[si].dmg = 0;
      S.shots[si].life = Math.min(S.shots[si].life, 0.5);
    }
    /* BB-V7.20 — floor-boss fountain was 10 rich balls; cut to 4.
       BB-V7.22 — fountain count scales with difficulty (EASY keeps 4). */
    var n = Math.max(1, Math.round(4 * diff().fountain));
    for (var i = 0; i < n; i++) {
      (function (k) {
        setTimeout(function () { dropLoot(en.x + irnd(-40, 40), en.y + irnd(-30, 30), true); }, 80 * k);
      })(i);
    }
  }

  /* BB-V7.20 — overall loot was too generous: trash kills spilled balls, rich
     tables were epic/legendary-only, and frag piles fed the upgrade menu too
     fast. Prefer shards over gear, and make power rarer when gear does drop.
     BB-V7.22 — gear chance + rarity thresholds scale with difficulty.
     BB-V7.22 — restY anchors the hop settle at the drop point (enemy/chest),
     not the bottom of the playfield.
     BB-V7.28 — knight/boss rich rarity uses absolute richLeg/richEpic per
     difficulty (rare fills the rest); HARD ≈ 4% / 15% / 81%. */
  function dropLoot(x, y, rich) {
    var d = diff();
    var table = rnd();
    var gearFloor = 1 - 0.22 * d.gear;
    var it;
    if (rich || table > gearFloor) {
      var aff = [];
      var n = rich ? (rnd() < 0.45 * d.affix ? 1 : 0) : (rnd() < 0.22 * d.affix ? 1 : 0);
      for (var i = 0; i < n; i++) aff.push(pick(AFFIX));
      var rar;
      if (rich) {
        var rr = rnd();
        var legT = d.richLeg;
        var epicT = legT + d.richEpic;
        rar = rr < legT ? "legendary" : (rr < epicT ? "epic" : "rare");
      } else {
        rar = rarityForFloor(S.floor);
      }
      it = { kind: "ball", x: x, y: y, restY: y, r: 13, vy: -40, life: 12, rar: rar, affix: aff, taken: false };
    } else {
      it = { kind: "frag", x: x, y: y, restY: y, r: 8, vy: -30, life: 10, rar: "common", n: 1, taken: false };
    }
    S.loot.push(it);
    sfx("loot");
  }

  function dropHeart(x, y) {
    S.loot.push({ kind: "heart", x: x, y: y, restY: y, r: 10, vy: -52, life: 12, rar: "heart", n: 1, taken: false });
    sfx("loot");
  }

  function maybeDropHeart(x, y, en) {
    if (!player) return;
    var p = 0.16 * diff().heart;
    if (en && en.boss) p = 1;
    else if (player.hp >= player.maxHp) return;
    if (rnd() < p) dropHeart(x, y);
  }

  function takeLoot(it) {
    if (it.taken) return;
    it.taken = true;
    sfx("pickup");
    if (it.kind === "frag") {
      player.frag += it.n || 1;
      floatTxt(it.x, it.y, "+" + (it.n || 1) + " FRAG", "#f0d080");
    } else if (it.kind === "heart") {
      if (healPlayer(it.n || 1)) floatTxt(it.x, it.y, "+♥", "#e05040");
      else { player.frag += 1; floatTxt(it.x, it.y, "+1 FRAG", "#f0d080"); }
    } else {
      var aff = it.affix || [];
      var rar = it.rar || "common";
      player.ballAffix = aff.slice();
      store.stash.unshift({ affix: aff.slice(), rar: rar });
      if (store.stash.length > 8) store.stash.pop();
      saveStore();
      floatTxt(it.x, it.y, (aff[0] || "BALL") + " " + String(rar).toUpperCase(),
        (RARITY[rar] && RARITY[rar].c) || "#ccc");
      toast((aff.join("+") || "PLAIN") + " · " + rar);
    }
  }

  function hasAff(name) {
    if (name === "Fire" && player && player.permaFire) return true;
    return !!(ball && ball.affix && ball.affix.indexOf(name) >= 0);
  }

  function hitEnemy(en, src, dmg, isSplit) {
    if (!en.alive) return;
    if (src.hits && src.hits.indexOf(en) >= 0 && !isSplit) return;
    if (src.hits) src.hits.push(en);
    var mul = 1;
    if (hasAff("Heavy") && src === ball) mul += 0.7;
    var dealt = Math.max(1, Math.floor(dmg * mul));
    en.hp -= dealt;
    en.stun = Math.max(en.stun, 0.12);
    floatTxt(en.x, en.y - en.r - 8, fmt(dealt), "#fff2c0");
    sfx("hit");
    burst(en.x, en.y, "#f0c070", 4);
    if (src === ball || isSplit) gainPlaceHit();
    if (hasAff("Fire") && src === ball) en.burn = Math.max(en.burn, 2.2);
    if (hasAff("Chain") && src === ball) {
      var nxt = nearestEnemy(en.x, en.y, en);
      if (nxt) {
        var bolt = { x: nxt.x, y: nxt.y, from: en, to: nxt, t: 0.15 };
        S.pops.push(bolt);
        hitEnemy(nxt, { hits: [en] }, Math.floor(dealt * 0.6), true);
      }
    }
    if (en.hp <= 0) {
      var trick = src === ball && ball.hits && ball.hits.length >= 2;
      if (trick) {
        S.runTricks += 1;
        store.trickKills += 1;
        S.trickAll = store.trickKills;
        saveStore();
        floatTxt(en.x, en.y - 36, "TRICK KILL", "#ffd24a");
        S.shake = 0.35;
      }
      killEnemy(en, trick);
    }
  }

  function nearestEnemy(x, y, skip) {
    var best = null, bd = 90;
    for (var i = 0; i < room.enemies.length; i++) {
      var e = room.enemies[i];
      if (!e.alive || e === skip) continue;
      var d = Math.hypot(e.x - x, e.y - y);
      if (d < bd) { bd = d; best = e; }
    }
    return best;
  }

  function enemyHurtBox(e) {
    return { x: e.x, y: e.y - (e.hitLift || 0), r: e.hitR || e.r };
  }

  function sweptHits(x0, y0, x1, y1, cx, cy, rad) {
    var dx = x1 - x0, dy = y1 - y0;
    var fx = x0 - cx, fy = y0 - cy;
    var a = dx * dx + dy * dy;
    var b = 2 * (fx * dx + fy * dy);
    var c = fx * fx + fy * fy - rad * rad;
    if (c <= 0) return true;
    if (a < 1e-8) return false;
    var disc = b * b - 4 * a * c;
    if (disc < 0) return false;
    var t = (-b - Math.sqrt(disc)) / (2 * a);
    return t >= 0 && t <= 1;
  }

  var PLACE_HITS_PER = 5;
  var PLACE_MAX_HARD = 6;
  /* BB-V7.35 — discrete rectangles through 8, ticked bar through 16, then a plain bar. */
  var HP_PIPS_MAX = 8;
  var HP_TICKS_MAX = 16;
  function placeHitsNeed() {
    return Math.max(3, PLACE_HITS_PER - (player && player.placeRateLv ? player.placeRateLv : 0));
  }
  function gainPlaceHit() {
    if (!player) return;
    if (player.blockStock >= player.blockMax) { player.placeHits = 0; return; }
    player.placeHits = (player.placeHits || 0) + 1;
    if (player.placeHits >= placeHitsNeed()) {
      player.placeHits = 0;
      player.blockStock = Math.min(player.blockMax, player.blockStock + 1);
      sfx("pickup");
      syncHud();
    }
  }

  function throwBall(ang, pow) {
    if (!ball || ball.live || S.downed) return;
    S.throws = (S.throws || 0) + 1;
    var spd = throwSpeed() * pow;
    ball.live = true; ball.ret = false; ball.pierced = false;
    ball.x = player.x + Math.cos(ang) * 20;
    ball.y = player.y + Math.sin(ang) * 20;
    ball.vx = Math.cos(ang) * spd;
    ball.vy = Math.sin(ang) * spd;
    ball.life = 2.6; ball.bounces = 0; ball.hits = [];
    ball.dmg = currentDmg();
    ball.affix = (player.ballAffix || []).slice();
    ball.trail = [];
    ball.lift = 0; ball.squash = 0; ball.dribble = 0;
    sfx("throw");
    if (!S.seenAimHelp) { S.seenAimHelp = true; store.aimHelp = true; saveStore(); }
  }

  function updateBall(dt) {
    if (!ball) return;
    if (!ball.live) {
      /* CHIEF BB-V5.3 — the ball at rest used to be drawn over the hero's face.
         It now sits in the throwing hand, out to the side and low.
         BB-V7.19 — match the hero's south-wall ground bias so the held ball
         does not sit on the wall's lifted top while he stands on the floor.
         BB-V7.23 — dribble while walking (bounce + soft tap); cradle when aiming
         or downed so the shot read stays clean. */
      var handBias = 0;
      if (room && room.grid) {
        var ptx = Math.floor(player.x / TILE), pty = Math.floor(player.y / TILE);
        if (pty + 1 < playRows() && room.grid[pty + 1] && room.grid[pty + 1][ptx]) {
          handBias = -Math.round(TILE * WALL_Z);
        }
      }
      var moving = Math.hypot(player.vx || 0, player.vy || 0) > 12;
      var groundY = player.y - 8 + handBias;
      var side = player.facing * 30;
      var lift = 0;
      var squash = 0;
      ball.dribble = ball.dribble || 0;
      if (S.aim || S.downed) {
        /* pick up into a throw cradle; freeze the bounce clock */
        lift = S.downed ? 4 : 18;
        side = player.facing * 22;
        ball.dribble = 0;
      } else if (moving) {
        var top = player.spd * (1 + player.spdLv * 0.05) || 1;
        var sp = Math.hypot(player.vx, player.vy);
        var rate = 9.5 + (sp / top) * 4.5;
        var prevPhase = ball.dribble;
        ball.dribble += dt * rate;
        /* sin² bounce: soft hang at the top, snappy floor contact */
        var wave = Math.sin(ball.dribble);
        var bounce = wave * wave;
        lift = 4 + bounce * 22;
        squash = bounce < 0.08 ? (1 - bounce / 0.08) * 0.22 : 0;
        side = player.facing * (26 + bounce * 4);
        /* soft tap each time the ball kisses the floor */
        var crossed = Math.floor(prevPhase / Math.PI) !== Math.floor(ball.dribble / Math.PI);
        if (crossed && bounce < 0.15) sfx("dribble");
      } else {
        /* idle: gentle pocket bounce so the held ball still has life */
        ball.dribble += dt * 3.2;
        var idle = Math.sin(ball.dribble) * Math.sin(ball.dribble);
        lift = 10 + idle * 5;
        side = player.facing * 28;
      }
      ball.lift = lift;
      ball.squash = squash;
      ball.groundY = groundY;
      ball.x = player.x + side;
      ball.y = groundY - lift;
      return;
    }
    if (ball.ret) {
      var dx = player.x - ball.x, dy = player.y - 18 - ball.y;
      var d = Math.hypot(dx, dy) || 1;
      ball.vx = dx / d * 520; ball.vy = dy / d * 520;
      ball.x += ball.vx * dt; ball.y += ball.vy * dt;
      if (d < 30) { ball.live = false; ball.ret = false; }
      return;
    }
    if (hasAff("Homing")) {
      var t = nearestEnemy(ball.x, ball.y, null);
      if (t) {
        var ang = Math.atan2(t.y - ball.y, t.x - ball.x);
        var spd = Math.hypot(ball.vx, ball.vy);
        var cx = Math.cos(ang) * spd, cy = Math.sin(ang) * spd;
        ball.vx = ball.vx * 0.92 + cx * 0.08;
        ball.vy = ball.vy * 0.92 + cy * 0.08;
      }
    }
    var prevX = ball.x, prevY = ball.y;
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;
    ball.life -= dt;
    checkHoopSwish(prevX, prevY);
    var ballBlock = blockAt(room.blocks, ball.x, ball.y, ball.r);
    if (resolveBallCircle(room.grid, room.blocks, ball)) {
      ball.bounces += 1;
      sfx("bounce");
      if (ballBlock >= 0) hurtBlockAt(ballBlock, BLOCK_HITS);
      if (hasAff("Split") && ball.bounces === 1) spawnSplit();
    }
    for (var i = 0; i < room.enemies.length; i++) {
      var e = room.enemies[i];
      if (!e.alive) continue;
      var box = enemyHurtBox(e);
      var rad = box.r + ball.r;
      if (Math.hypot(box.x - ball.x, box.y - ball.y) < rad ||
          sweptHits(prevX, prevY, ball.x, ball.y, box.x, box.y, rad)) {
        var wasAlive = e.alive;
        hitEnemy(e, ball, ball.dmg, false);
        if (hasAff("Split") && ball.hits.length === 1) spawnSplit();
        /* CHIEF BB-V6.4 — the ball used to sail straight through a live enemy, which
           made a body no different from empty floor and quietly deleted the reason to
           aim. It now rebounds off anything still standing, exactly as it does off a
           wall, and that rebound counts as a bounce — so hitting an enemy and then
           banking into a second one is a TRICK KILL. Heavy is the affix that buys
           the old behaviour: it pierces the first enemy it meets and carries on.
           A body that dies on the hit never blocks: you punch through the kill. */
        var pierce = hasAff("Heavy") && !ball.pierced;
        if (pierce) { ball.pierced = true; ball.vx *= 0.85; ball.vy *= 0.85; }
        else if (wasAlive && e.alive) {
          var dx = ball.x - box.x, dy = ball.y - box.y;
          var d = Math.hypot(dx, dy) || 1;
          var nx = dx / d, ny = dy / d;
          var into = ball.vx * nx + ball.vy * ny;
          if (into < 0) { ball.vx -= 1.85 * into * nx; ball.vy -= 1.85 * into * ny; }
          ball.x = box.x + nx * (box.r + ball.r + 1);
          ball.y = box.y + ny * (box.r + ball.r + 1);
          ball.bounces += 1;
          sfx("bounce");
          burst(ball.x, ball.y, "#ffe0a0", 3);
        }
      }
    }
    ball.trail.push({ x: ball.x, y: ball.y, t: 0.25 });
    if (ball.trail.length > 14) ball.trail.shift();
    if (ball.life <= 0 || ball.bounces >= 9 || Math.hypot(ball.vx, ball.vy) < 40) ball.ret = true;
  }

  function spawnSplit() {
    for (var i = -1; i <= 1; i += 2) {
var a = Math.atan2(ball.vy, ball.vx) + i * 0.5;
      S.splits.push({ x: ball.x, y: ball.y, vx: Math.cos(a) * 380, vy: Math.sin(a) * 380, r: 6, life: 0.7, hits: [] });
    }
  }

  function updateSplits(dt) {
    for (var i = S.splits.length - 1; i >= 0; i--) {
      var s = S.splits[i];
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      var splitBlock = blockAt(room.blocks, s.x, s.y, s.r);
      if (resolveCircle(room.grid, room.blocks, s) && splitBlock >= 0) hurtBlockAt(splitBlock, BLOCK_HITS);
      for (var j = 0; j < room.enemies.length; j++) {
        var e = room.enemies[j];
        var box = enemyHurtBox(e);
        if (e.alive && Math.hypot(box.x - s.x, box.y - s.y) < box.r + s.r) hitEnemy(e, s, Math.floor(currentDmg() * 0.45), true);
      }
      if (s.life <= 0) S.splits.splice(i, 1);
    }
  }

  function aimGuide(ang, pow) {
    var pts = [];
    var x = player.x + Math.cos(ang) * 20, y = player.y + Math.sin(ang) * 20;
    var vx = Math.cos(ang), vy = Math.sin(ang);
    pts.push({ x: x, y: y });
    var bounced = false;
    var probe = (S.hoopReady && room && room.hoop && !room.hoop.swished) ? tileAtBall : tileAt;
    for (var i = 0; i < 90; i++) {
      x += vx * 8; y += vy * 8;
      if (probe(room.grid, x, y) || blockHit(room.blocks, x, y, 6, true)) {
        var hx = probe(room.grid, x + vx * 8, y) || blockHit(room.blocks, x + 4, y, 6, true);
        var hy = probe(room.grid, x, y + vy * 8) || blockHit(room.blocks, x, y + 4, 6, false);
        if (hx) vx *= -1;
        if (hy) vy *= -1;
        if (!hx && !hy) { vx *= -1; vy *= -1; }
        bounced = true;
        pts.push({ x: x, y: y, bounce: true });
        if (pts.length > 2) break;
      }
      if (i % 2 === 0) pts.push({ x: x, y: y });
      if (bounced && pts.length > 8) break;
    }
    return pts;
  }

  /* ---------- AI ---------- */
  function updateEnemies(dt) {
    var living = 0;
    for (var i = 0; i < room.enemies.length; i++) {
      var e = room.enemies[i];
      if (!e.alive) {
        e.deadT -= dt;
        continue;
      }
      living++;
      if (e.burn > 0) {
        e.burn -= dt;
        if (Math.floor(e.burn * 8) !== Math.floor((e.burn + dt) * 8)) {
          e.hp -= Math.max(1, Math.floor(currentDmg() * 0.08));
          if (e.hp <= 0) killEnemy(e, false);
        }
      }
      if (e.stun > 0) { e.stun -= dt; continue; }
      e.cd -= dt;
      if (e.blockHitCd > 0) e.blockHitCd -= dt;
      var dx = player.x - e.x, dy = player.y - e.y;
      var dist = Math.hypot(dx, dy) || 1;
      e.facing = dx < 0 ? -1 : 1;
      if (e.boss) { updateBoss(e, dt, dx, dy, dist); }
      else if (e.kind === "chase") moveToward(e, dx / dist, dy / dist, e.spd, dt);
      else if (e.kind === "swoop") {
        e.phase += dt;
        moveToward(e, Math.cos(e.phase * 3) * 0.6 + dx / dist, Math.sin(e.phase * 2) * 0.6 + dy / dist, e.spd, dt);
      } else if (e.kind === "orbit") {
        e.phase += dt;
        var ox = Math.cos(e.phase) * 80, oy = Math.sin(e.phase) * 80;
        moveToward(e, (player.x + ox - e.x) / 40, (player.y + oy - e.y) / 40, e.spd, dt);
      } else if (e.kind === "charge") {
        if (e.cd <= 0) { e.vx = dx / dist * e.spd * 3; e.vy = dy / dist * e.spd * 3; e.cd = 1.8; }
        e.x += e.vx * dt; e.y += e.vy * dt;
        e.vx *= 0.98; e.vy *= 0.98;
        var chargeBlock = blockAt(room.blocks, e.x, e.y, e.r);
        resolveCircle(room.grid, room.blocks, e);
        if (chargeBlock >= 0) enemyBumpBlock(e, chargeBlock);
      } else if (e.kind === "range") {
        if (dist < 90) moveToward(e, -dx / dist, -dy / dist, e.spd, dt);
        if (e.cd <= 0) {
          fireShot(e.x, e.y, dx / dist, dy / dist, 160, 1, "knife", { owner: e });
          e.cd = 1.6 + rnd() * 0.6;
        }
      }
      /* Skull Lord / knight authored melee owns damage during active frames —
         body bump would stack and muddy the animation read.
         (lord = Skull Lord; bone is Bone King again and has no melee clock.) */
      var authoredAtk = (e.boss === "lord" || e.boss === "mini") && e.atk &&
        e.atkT >= e.atkWind && e.atkT < e.atkWind + e.atkActive &&
        (e.boss === "lord" || e.atk === "reap" || e.atk === "charge" ||
         e.atk === "blink" || e.atk === "slam" || e.atk === "briar");
      if (!authoredAtk && Math.hypot(e.x - player.x, e.y - player.y) < bodyR(e) + player.r - 2) {
        hurtPlayer(1 + Math.floor(S.floor / 6));
        var px = player.x - e.x, py = player.y - e.y, pd = Math.hypot(px, py) || 1;
        /* CHIEF FIX BB-V6.10 — THE clipping cause, found by instrumenting rather
           than by theory. This knock-back from an enemy hit moved the player 18px
           with no wall test at all, so any hit taken with a wall behind you put you
           inside the stone — and enemies are 45% faster now, so they crowd you into
           walls constantly. It goes through the same slide the walk does, and what
           will not fit is simply not applied. */
        var kr = player.r * 0.6;
        slide("x", px / pd * 18, kr);
        slide("y", py / pd * 18, kr);
      }
    }
    if (living === 0 && room && !room.cleared && room.enemies.length) {
      room.cleared = true;
      room.doorReady = true;
      room.clearWait = room.kind === "boss" ? 99 : 0.7;
      S.rooms[S.roomI].cleared = true;
      if (room.kind === "boss" && S.bossBeat > 0) { /* floor card waits on beat */ }
      else if (S.hoopReady) { /* SWISH THE HOOP toast already up from death beat */ }
      else toast("ROOM CLEAR");
    }
  }

  function moveToward(e, ux, uy, spd, dt) {
    e.vx = ux * spd; e.vy = uy * spd;
    e.x += e.vx * dt; e.y += e.vy * dt;
    var bi = blockAt(room.blocks, e.x, e.y, e.r);
    resolveCircle(room.grid, room.blocks, e);
    if (bi >= 0) enemyBumpBlock(e, bi);
  }

  function fireShot(x, y, ux, uy, spd, dmg, kind, extra) {
    extra = extra || {};
    kind = kind || "knife";
    var s = {
      x: x, y: y, vx: ux * spd, vy: uy * spd,
      r: extra.r != null ? extra.r : (kind === "knife" ? 4.5 : 5),
      life: extra.life != null ? extra.life : 3,
      dmg: dmg, kind: kind
    };
    if (extra.weap) s.weap = extra.weap;
    if (extra.owner) s.owner = extra.owner;
    if (extra.col) s.col = extra.col;
    if (extra.accent) s.accent = extra.accent;
    if (extra.body) s.body = extra.body;
    S.shots.push(s);
    return s;
  }

  function weaponFlying(e) {
    return e.thrown && S.shots.indexOf(e.thrown) >= 0;
  }

  function throwKnightWeapon(e, ux, uy) {
    var k = KNIGHT[e.type] || KNIGHT.minibone;
    var face = (player && player.x < e.x) ? -1 : 1;
    var u = artR(e) * 1.35;
    var sx = e.x + face * u * 0.74;
    var sy = e.y - u * 0.85;
    var ax = (player ? player.x : sx + ux) - sx;
    var ay = (player ? player.y : sy + uy) - sy;
    var n = Math.hypot(ax, ay) || 1;
    /* 160 px/s vs the hero's move: walk-dodgeable on a phone, big enough to read. */
    var s = fireShot(sx, sy, ax / n, ay / n, 160, 3, "weapon", {
      r: 13, life: 2.6, weap: k.weap, owner: e,
      col: k.trim, accent: k.accent, body: k.body
    });
    e.disarm = true;
    e.thrown = s;
    e.rearm = 1.15;
    sfx("throw");
    burst(sx, sy, k.accent, 8);
    return s;
  }

  /* BB-V7.18 — each mini knight gets a real kit: one special, one normal, one
     theme wild-card. Shared wind/active/recover clock; drawKnight reads poses. */
  function ensureKnight(e) {
    if (e.knightReady) return;
    e.knightReady = true;
    e.atk = null;
    e.atkT = 0;
    e.atkWind = 0;
    e.atkActive = 0;
    e.atkRecover = 0;
    e.atkHit = false;
    e.aimX = 1;
    e.aimY = 0;
    e.lean = 0;
    e.crouch = 0;
    e.bladeLift = 0;
    e.swing = 0;
    e.ghost = 1;
    e.slashTrail = [];
    e.volleysLeft = 0;
    e.volleyCd = 0;
    e.spireStep = -1;
    e.dashLen = 0;
    e.dashFromX = 0;
    e.dashFromY = 0;
    e.dashToX = 0;
    e.dashToY = 0;
    e.blinkX = 0;
    e.blinkY = 0;
    e.blinkArmed = false;
    e.kitRing = false;
    e.kitRingR = 0;
    e.kitRingHit = false;
    e.kitRingMax = 0;
    e.kitRingCol = "#ff6030";
  }

  function knightAim(e, dx, dy, dist) {
    var n = dist || 1;
    e.aimX = dx / n;
    e.aimY = dy / n;
  }

  function startKnightAtk(e, kind, dx, dy, dist) {
    ensureKnight(e);
    e.atk = kind;
    e.atkT = 0;
    e.atkHit = false;
    e.slashTrail = [];
    e.spireStep = -1;
    e.blinkArmed = false;
    knightAim(e, dx, dy, dist);
    e.kitRing = false;
    e.kitRingHit = false;
    if (kind === "throw") {
      e.atkWind = 0.78; e.atkActive = 0.08; e.atkRecover = 0.35;
      e.tell = e.atkWind; e.tellMax = e.atkWind;
    } else if (kind === "knives" || kind === "embers" || kind === "needles") {
      e.atkWind = 0.22; e.atkActive = 0.55; e.atkRecover = 0.28;
      e.volleysLeft = kind === "needles" ? 1 : (1 + (rnd() < 0.55 ? 1 : 0));
      e.volleyCd = 0;
      e.tell = 0; e.tellMax = 0;
    } else if (kind === "spire") {
      e.atkWind = 0.72; e.atkActive = 0.55; e.atkRecover = 0.4;
      e.tell = e.atkWind; e.tellMax = e.atkWind;
    } else if (kind === "slam") {
      e.atkWind = 0.95; e.atkActive = 0.85; e.atkRecover = 0.45;
      e.kitRingMax = 132; e.kitRingCol = "#ff7040";
      e.tell = e.atkWind; e.tellMax = e.atkWind;
    } else if (kind === "reap") {
      e.atkWind = 0.55; e.atkActive = 0.32; e.atkRecover = 0.42;
      e.tell = e.atkWind; e.tellMax = e.atkWind;
    } else if (kind === "blink") {
      e.atkWind = 0.48; e.atkActive = 0.38; e.atkRecover = 0.4;
      e.tell = e.atkWind; e.tellMax = e.atkWind;
    } else if (kind === "charge") {
      e.atkWind = 0.7; e.atkActive = 0.28; e.atkRecover = 0.48;
      e.dashLen = Math.max(110, Math.min(210, (dist || 140) + 40));
      e.dashFromX = e.x; e.dashFromY = e.y;
      e.dashToX = e.x + e.aimX * e.dashLen;
      e.dashToY = e.y + e.aimY * e.dashLen;
      e.tell = e.atkWind; e.tellMax = e.atkWind;
    } else if (kind === "briar") {
      e.atkWind = 0.7; e.atkActive = 0.7; e.atkRecover = 0.4;
      e.kitRingMax = 108; e.kitRingCol = "#60c050";
      e.tell = e.atkWind; e.tellMax = e.atkWind;
    } else {
      e.atkWind = 0.4; e.atkActive = 0.3; e.atkRecover = 0.3;
    }
  }

  function pickKnightAtk(e, dist) {
    var t = e.type;
    var roll = rnd();
    /* Distance nudges: close → melee/slam; far → throw/volleys. */
    if (t === "minibone") {
      if (dist < 95 && roll < 0.45) return "spire";
      if (roll < 0.36) return "throw";
      if (roll < 0.72) return "knives";
      return "spire";
    }
    if (t === "miniforge") {
      if (dist < 110 && roll < 0.5) return "slam";
      if (roll < 0.34) return "slam";
      if (roll < 0.7) return "embers";
      return "throw";
    }
    if (t === "miniash") {
      if (dist < 100 && roll < 0.48) return "reap";
      if (roll < 0.34) return "reap";
      if (roll < 0.68) return "knives";
      return "blink";
    }
    /* minithorn */
    if (dist > 100 && roll < 0.5) return "charge";
    if (roll < 0.34) return "charge";
    if (roll < 0.7) return "needles";
    return "briar";
  }

  function fireKnightVolley(e, kind) {
    var k = KNIGHT[e.type] || KNIGHT.minibone;
    var ux = e.aimX, uy = e.aimY;
    var n = Math.hypot(ux, uy) || 1;
    ux /= n; uy /= n;
    if (kind === "knives") {
      fireShot(e.x, e.y, ux, uy, 210, 1, "knife", {
        owner: e, col: k.trim, accent: k.accent, body: k.accent
      });
      sfx("throw");
    } else if (kind === "embers") {
      var j = (rnd() - 0.5) * 0.28;
      var j2 = (rnd() - 0.5) * 0.28;
      fireShot(e.x, e.y, ux + j, uy + j * 0.4, 150, 1, "ember", {
        owner: e, r: 7, life: 2.4, col: k.accent, accent: "#ff4020"
      });
      fireShot(e.x, e.y, ux + j2, uy + j2 * 0.4, 130, 1, "ember", {
        owner: e, r: 6, life: 2.2, col: "#ff9040", accent: "#ff6030"
      });
      sfx("throw");
      burst(e.x + ux * 18, e.y + uy * 18, k.accent, 5);
    } else if (kind === "needles") {
      var spreads = [-0.32, 0, 0.32];
      for (var i = 0; i < spreads.length; i++) {
        var a = Math.atan2(uy, ux) + spreads[i];
        fireShot(e.x, e.y, Math.cos(a), Math.sin(a), 230, 1, "needle", {
          owner: e, r: 4, life: 2.2, col: k.trim, accent: k.accent
        });
      }
      sfx("throw");
    }
  }

  function fireBoneSpire(e, step) {
    var k = KNIGHT[e.type] || KNIGHT.minibone;
    var dist = 42 + step * 38;
    var sx = e.x + e.aimX * dist;
    var sy = e.y + e.aimY * dist;
    fireShot(sx, sy, e.aimX, e.aimY, 28, 2, "bone", {
      owner: e, r: 9, life: 0.7, col: k.body, accent: k.accent, body: k.trim
    });
    burst(sx, sy, k.accent, 6);
    sfx("spire");
    S.shake = Math.max(S.shake, 0.18);
  }

  function knightReapHit(e) {
    if (e.atkHit || !player) return;
    var px = player.x - e.x, py = player.y - e.y;
    var pr = Math.hypot(px, py) || 1;
    var reach = artR(e) * 2.55;
    if (pr > reach + player.r) return;
    var pang = Math.atan2(py, px);
    var base = Math.atan2(e.aimY, e.aimX);
    var face = e.aimX < 0 ? -1 : 1;
    var sweep = face > 0
      ? (-1.05 + e.swing * 2.2)
      : (1.05 - e.swing * 2.2);
    var blade = base + sweep;
    var ad = Math.abs(Math.atan2(Math.sin(pang - blade), Math.cos(pang - blade)));
    if (ad < 0.78) {
      e.atkHit = true;
      hurtPlayer(2 + Math.floor(S.floor / 5));
      S.shake = Math.max(S.shake, 0.36);
      burst(player.x, player.y, "#a8dce4", 12);
      sfx("cleave");
    }
  }

  function knightChargeHit(e) {
    if (e.atkHit || !player) return;
    var tipX = e.x + e.aimX * artR(e) * 1.8;
    var tipY = e.y + e.aimY * artR(e) * 1.8;
    if (Math.hypot(player.x - tipX, player.y - tipY) < player.r + artR(e) * 0.85 ||
        Math.hypot(player.x - e.x, player.y - e.y) < player.r + bodyR(e) * 1.2) {
      e.atkHit = true;
      hurtPlayer(2 + Math.floor(S.floor / 4));
      S.shake = Math.max(S.shake, 0.4);
      burst(player.x, player.y, "#c0e070", 14);
      sfx("lunge");
    }
  }

  function knightBlinkHit(e) {
    if (e.atkHit || !player) return;
    if (Math.hypot(player.x - e.x, player.y - e.y) < player.r + artR(e) * 1.7) {
      e.atkHit = true;
      hurtPlayer(2 + Math.floor(S.floor / 5));
      S.shake = Math.max(S.shake, 0.34);
      burst(player.x, player.y, "#9fe8f0", 12);
      sfx("cleave");
    }
  }

  function updateKitRing(e, dt, dmg) {
    e.kitRingR += 160 * dt;
    if (!e.kitRingHit && player) {
      var pr = Math.hypot(player.x - e.x, player.y - e.y);
      if (Math.abs(pr - e.kitRingR) < 16) {
        e.kitRingHit = true;
        hurtPlayer(dmg);
        S.shake = Math.max(S.shake, 0.3);
        burst(player.x, player.y, e.kitRingCol, 10);
        sfx("hit");
      }
    }
    if (e.kitRingR >= e.kitRingMax) {
      e.kitRing = false;
    }
  }

  function endKnightAtk(e) {
    e.atk = null;
    e.tell = 0;
    e.tellMax = 0;
    e.bladeLift = 0;
    e.lean = 0;
    e.crouch = 0;
    e.swing = 0;
    e.ghost = 1;
    e.slashTrail = [];
    e.cd = 0.55 + rnd() * 0.35;
  }

  function updateKnight(e, dt, dx, dy, dist) {
    ensureKnight(e);
    var k = KNIGHT[e.type] || KNIGHT.minibone;
    if (e.rearm > 0) e.rearm -= dt;
    if (e.disarm && e.rearm <= 0 && !weaponFlying(e)) {
      e.disarm = false;
      e.thrown = null;
    }

    if (e.atk) {
      e.atkT += dt;
      var wind = e.atkWind, active = e.atkActive, recover = e.atkRecover;
      var t = e.atkT;
      var face = e.aimX < 0 ? -1 : 1;

      if (e.atk === "throw") {
        if (t < wind) {
          var w = t / wind;
          e.bladeLift = w;
          e.crouch = w * 0.12;
          e.tell = wind - t;
          if (dist > 50) moveToward(e, dx / dist * 0.25, dy / dist * 0.25, e.spd * 0.4, dt);
        } else if (t < wind + active) {
          if (!e.atkHit) {
            e.atkHit = true;
            e.tell = 0;
            throwKnightWeapon(e, e.aimX, e.aimY);
          }
        } else if (t < wind + active + recover) {
          e.bladeLift = Math.max(0, 1 - (t - wind - active) / recover);
        } else endKnightAtk(e);
      } else if (e.atk === "knives" || e.atk === "embers" || e.atk === "needles") {
        var chaseN = 0.7;
        moveToward(e, dx / dist * chaseN, dy / dist * chaseN, e.spd, dt);
        knightAim(e, dx, dy, dist);
        e.bladeLift = 0.2;
        if (t < wind) {
          e.bladeLift = 0.35 * (t / wind);
        } else if (t < wind + active) {
          if (e.volleyCd > 0) e.volleyCd -= dt;
          if (e.volleysLeft > 0 && e.volleyCd <= 0) {
            fireKnightVolley(e, e.atk);
            e.volleysLeft--;
            e.volleyCd = e.atk === "needles" ? 0.55 : 0.42;
          }
        } else endKnightAtk(e);
      } else if (e.atk === "spire") {
        if (t < wind) {
          var ws = t / wind;
          e.crouch = ws * 0.22;
          e.bladeLift = ws * 0.55;
          e.tell = wind - t;
          knightAim(e, dx, dy, dist);
        } else if (t < wind + active) {
          e.tell = 0;
          e.crouch = 0.18;
          var step = Math.floor((t - wind) / 0.12);
          if (step > e.spireStep && step < 5) {
            e.spireStep = step;
            fireBoneSpire(e, step);
          }
        } else if (t < wind + active + recover) {
          e.crouch *= 0.9;
        } else endKnightAtk(e);
      } else if (e.atk === "slam" || e.atk === "briar") {
        if (t < wind) {
          var wl = t / wind;
          e.bladeLift = wl * 1.15;
          e.crouch = wl * 0.28;
          e.tell = wind - t;
          if (dist > 40) moveToward(e, dx / dist * 0.2, dy / dist * 0.2, e.spd * 0.3, dt);
        } else if (t < wind + active) {
          if (!e.kitRing) {
            e.kitRing = true;
            e.kitRingR = 24;
            e.kitRingHit = false;
            e.tell = 0;
            e.bladeLift = 0.15;
            e.crouch = 0.08;
            sfx(e.atk === "slam" ? "slam" : "briar");
            burst(e.x, e.y, e.kitRingCol, 14);
            S.shake = Math.max(S.shake, 0.38);
          }
          updateKitRing(e, dt, e.atk === "slam" ? (2 + Math.floor(S.floor / 4)) : (2 + Math.floor(S.floor / 5)));
        } else {
          e.kitRing = false;
          endKnightAtk(e);
        }
      } else if (e.atk === "reap") {
        if (t < wind) {
          var wr = t / wind;
          e.bladeLift = wr * 0.9;
          e.lean = -face * wr * 0.45;
          e.swing = 0;
          e.tell = wind - t;
          if (dist > 45) moveToward(e, dx / dist * 0.2, dy / dist * 0.2, e.spd * 0.35, dt);
          knightAim(e, dx, dy, dist);
        } else if (t < wind + active) {
          var sr = (t - wind) / active;
          e.swing = sr;
          e.bladeLift = 0.9 - sr * 0.7;
          e.lean = face * (-0.45 + sr * 1.15);
          e.tell = 0;
          if (!e.slashTrail) e.slashTrail = [];
          var rad = artR(e) * 2.2;
          var bang = Math.atan2(e.aimY, e.aimX) + (face > 0 ? (-1.05 + sr * 2.2) : (1.05 - sr * 2.2));
          e.slashTrail.push({
            x: e.x + Math.cos(bang) * rad,
            y: e.y + Math.sin(bang) * rad - artR(e) * 0.3,
            a: 1 - sr
          });
          if (e.slashTrail.length > 12) e.slashTrail.shift();
          knightReapHit(e);
          if (sr > 0.1 && sr < 0.5) burst(e.x + Math.cos(bang) * rad * 0.7, e.y + Math.sin(bang) * rad * 0.7, k.accent, 1);
        } else if (t < wind + active + recover) {
          e.lean *= 0.85;
          e.bladeLift *= 0.85;
        } else endKnightAtk(e);
      } else if (e.atk === "blink") {
        if (t < wind) {
          var wb = t / wind;
          e.ghost = 1 - wb * 0.85;
          e.bladeLift = wb * 0.5;
          e.tell = wind - t;
          if (wb > 0.55 && !e.blinkArmed) {
            var ang = Math.atan2(dy, dx) + (rnd() < 0.5 ? 2.2 : -2.2);
            e.blinkX = player.x + Math.cos(ang) * 58;
            e.blinkY = player.y + Math.sin(ang) * 58;
            e.blinkArmed = true;
            burst(e.x, e.y, k.accent, 10);
            sfx("blink");
          }
        } else if (t < wind + active) {
          if (e.blinkArmed) {
            e.x = e.blinkX; e.y = e.blinkY;
            resolveCircle(room.grid, room.blocks, e);
            e.blinkArmed = false;
            e.ghost = 1;
            e.tell = 0;
            knightAim(e, player.x - e.x, player.y - e.y, Math.hypot(player.x - e.x, player.y - e.y) || 1);
            burst(e.x, e.y, k.accent, 10);
          }
          var sb = (t - wind) / active;
          e.swing = sb;
          e.bladeLift = 0.7 - sb * 0.5;
          knightBlinkHit(e);
        } else endKnightAtk(e);
      } else if (e.atk === "charge") {
        if (t < wind) {
          var wc = t / wind;
          e.bladeLift = 0.15;
          e.crouch = wc * 0.2;
          e.lean = face * wc * 0.35;
          e.tell = wind - t;
          /* square up; keep aim locked from start for readable lane */
        } else if (t < wind + active) {
          var sc = (t - wind) / active;
          /* ease-out dash along committed lane */
          var ease = 1 - (1 - sc) * (1 - sc);
          e.x = e.dashFromX + (e.dashToX - e.dashFromX) * ease;
          e.y = e.dashFromY + (e.dashToY - e.dashFromY) * ease;
          resolveCircle(room.grid, room.blocks, e);
          e.crouch = 0.08;
          e.lean = face * 0.5;
          e.tell = 0;
          knightChargeHit(e);
          if (sc < 0.5) burst(e.x - e.aimX * 10, e.y - e.aimY * 10, "#6a5a44", 1);
        } else if (t < wind + active + recover) {
          e.lean *= 0.88;
          e.crouch *= 0.88;
        } else endKnightAtk(e);
      } else {
        endKnightAtk(e);
      }
      return;
    }

    /* idle chase — slow while disarmed or rearming */
    var chase = (e.disarm || e.rearm > 0) ? 0.55 : 1;
    moveToward(e, dx / dist * chase, dy / dist * chase, e.spd, dt);
    e.bladeLift = 0;
    e.lean = Math.sin(e.phase * 2.2) * 0.04;
    e.crouch = 0;
    e.ghost = 1;
    if (e.disarm) return; /* wait for weapon to land before next kit pick */
    if (e.cd <= 0) {
      startKnightAtk(e, pickKnightAtk(e, dist), dx, dy, dist);
    }
  }

  /* BB-V7.12 — Skull Lord (was Bone King): melee only. Two attacks with long
     multi-phase animation clocks that drawSkullLord reads. Trash waves fire once
     each at 75/50/25% of max HP.
     BB-V7.16 — blade sweeps the telegraph fan; lunge actually covers the
     dashed lane (was ~40px of travel vs a 400px tell). Ease-in slash, ease-out
     dash, stride/cape on the pose clock.
     BB-V7.21 — lunge telegraph: longer wind + early aim lock so the dashed
     lane freezes with enough time to walk-dodge (was tracking until 78%);
     attack pick mixes cleave walk-ins and caps lunge streaks. */
  var SKULL_CLEAVE_BACK = 1.32;
  var SKULL_CLEAVE_FWD = 1.18;

  function skullAimAng(e) {
    return Math.atan2(e.aimY || 0, e.aimX || 1);
  }
  /* canvas rotate 0 = blade graphic pointing up; tip world angle = -PI/2 + bang */
  function skullBladeBang(aimAng, sweep) {
    return aimAng + sweep + Math.PI / 2;
  }
  function skullTipAng(e) {
    return (e.bladeAng || 0) - Math.PI / 2;
  }
  function skullCleaveReach(e) {
    return artR(e) * 1.48 * 3.05;
  }
  function skullDashLen(e, dist) {
    var ar = artR(e);
    return Math.max(ar * 4.4, Math.min(ar * 8.2, (dist || 0) + 70));
  }

  function ensureSkullLord(e) {
    if (e.skullReady) return;
    e.skullReady = true;
    e.waveFlags = [false, false, false];
    e.atk = null;
    e.atkT = 0;
    e.atkHit = false;
    e.atkSwingSfx = false;
    e.aimX = 1;
    e.aimY = 0;
    e.slashTrail = [];
    e.dustT = 0;
    e.face = 1;
    e.lean = 0;
    e.bladeAng = -0.55;
    e.bladeLift = 0;
    e.crouch = 0;
    e.shieldFwd = 0;
    e.capesway = 0;
    e.capeFlare = 0;
    e.stride = 0;
    e.stridePhase = 0;
    e.dashLen = 0;
    e.dashFromX = 0;
    e.dashFromY = 0;
    e.dashToX = 0;
    e.dashToY = 0;
    e.dashCommit = false;
    e.prevX = e.x;
    e.prevY = e.y;
    e.lastAtk = null;
    e.lungeStreak = 0;
  }

  function spawnSkullAdds(boss, n) {
    if (!room || !room.grid) return;
    var roster = ["skel", "slime", "bat", "skel"];
    var open = reachableTiles(room.grid, {
      tx: Math.floor(boss.x / TILE),
      ty: Math.floor(boss.y / TILE)
    }, 2);
    var spawned = 0, i, t, type, en, ang, tries;
    for (i = 0; i < n && open.length; i++) {
      t = null;
      for (tries = 0; tries < 12 && open.length; tries++) {
        t = open.pop();
        if (Math.hypot((t.tx + 0.5) * TILE - player.x, (t.ty + 0.5) * TILE - player.y) < 70) continue;
        if (Math.hypot((t.tx + 0.5) * TILE - boss.x, (t.ty + 0.5) * TILE - boss.y) < 55) continue;
        break;
      }
      if (!t) {
        ang = (i / n) * Math.PI * 2 + rnd();
        t = {
          tx: Math.max(2, Math.min(playCols() - 3, Math.floor((boss.x + Math.cos(ang) * 160) / TILE))),
          ty: Math.max(2, Math.min(playRows() - 3, Math.floor((boss.y + Math.sin(ang) * 120) / TILE)))
        };
        if (room.grid[t.ty]) room.grid[t.ty][t.tx] = 0;
      }
      type = roster[i % roster.length];
      en = spawnEnemy(type, (t.tx + 0.5) * TILE, (t.ty + 0.5) * TILE, S.floor, false);
      room.enemies.push(en);
      burst(en.x, en.y, en.col, 10);
      spawned++;
    }
    if (spawned) {
      toast("THE GRAVE STIRS");
      sfx("boss");
      S.shake = Math.max(S.shake, 0.28);
    }
  }

  function skullLordWaves(e) {
    var marks = [0.75, 0.5, 0.25];
    var counts = [3, 4, 5];
    var ratio = e.hp / e.maxHp;
    for (var i = 0; i < 3; i++) {
      if (!e.waveFlags[i] && ratio <= marks[i]) {
        e.waveFlags[i] = true;
        spawnSkullAdds(e, counts[i]);
      }
    }
  }

  /* Big hall made pure dist>135 → almost always lunge. Mix in walk-ins and
     cleaves; never chain more than one lunge without a close-range beat. */
  function pickSkullAtk(e, dist) {
    if (e.lastAtk === "lunge" || (e.lungeStreak || 0) >= 1) {
      if (dist < 160) return "cleave";
      return null; /* keep chasing into cleave range */
    }
    if (dist < 150) return "cleave";
    if (dist < 220) return rnd() < 0.22 ? "lunge" : null;
    return "lunge";
  }

  function startSkullAtk(e, kind, dx, dy, dist) {
    e.atk = kind;
    e.atkT = 0;
    e.atkHit = false;
    e.atkSwingSfx = false;
    e.slashTrail = [];
    e.dashCommit = false;
    e.capeFlare = 0;
    var n = dist || 1;
    e.aimX = dx / n;
    e.aimY = dy / n;
    e.face = e.aimX < 0 ? -1 : 1;
    e.dashLen = skullDashLen(e, dist);
    if (kind === "cleave") {
      /* longer tell, snappier cut so the fan is readable in the bigger hall */
      e.atkWind = 0.74;
      e.atkActive = 0.22;
      e.atkRecover = 0.50;
      e.bladeAng = skullBladeBang(skullAimAng(e), e.face * -SKULL_CLEAVE_BACK * 0.2);
    } else {
      /* square up briefly, then freeze the lane — knight charge locks from
         start; lord gets a short track so the tell still finds you, then
         ~0.7s of committed dashed lane to sidestep off. */
      e.atkWind = 1.20;
      e.atkActive = 0.38;
      e.atkRecover = 0.62;
      e.bladeAng = e.face * -0.35;
    }
    e.atkTotal = e.atkWind + e.atkActive + e.atkRecover;
  }

  function skullCleaveHit(e) {
    if (e.atkHit || !player) return;
    var px = player.x - e.x, py = player.y - e.y;
    var pr = Math.hypot(px, py) || 1;
    var reach = skullCleaveReach(e);
    if (pr > reach + player.r) return;
    var pang = Math.atan2(py, px);
    var blade = skullTipAng(e);
    var ad = Math.abs(Math.atan2(Math.sin(pang - blade), Math.cos(pang - blade)));
    if (ad < 0.70) {
      e.atkHit = true;
      hurtPlayer(2 + Math.floor(S.floor / 4));
      S.shake = Math.max(S.shake, 0.42);
      burst(player.x, player.y, "#c9a44c", 14);
      sfx("hit");
    }
  }

  function skullLungeHit(e) {
    if (e.atkHit || !player) return;
    var pr = player.r;
    var tipX = e.x + e.aimX * artR(e) * 2.6;
    var tipY = e.y + e.aimY * artR(e) * 2.6;
    var hit = Math.hypot(player.x - tipX, player.y - tipY) < pr + artR(e) * 0.95 ||
              Math.hypot(player.x - e.x, player.y - e.y) < pr + bodyR(e) * 1.2;
    /* capsule along this frame's travel so a real dash cannot skip over you */
    if (!hit && e.prevX != null) {
      var vx = e.x - e.prevX, vy = e.y - e.prevY;
      var len = Math.hypot(vx, vy) || 1;
      var t = ((player.x - e.prevX) * vx + (player.y - e.prevY) * vy) / (len * len);
      t = Math.max(0, Math.min(1, t));
      var cx = e.prevX + vx * t, cy = e.prevY + vy * t;
      hit = Math.hypot(player.x - cx, player.y - cy) < pr + bodyR(e) * 1.15;
    }
    if (hit) {
      e.atkHit = true;
      hurtPlayer(3 + Math.floor(S.floor / 3));
      S.shake = Math.max(S.shake, 0.55);
      burst(player.x, player.y, "#e8e0d0", 16);
      sfx("hit");
    }
  }

  function updateSkullLord(e, dt, dx, dy, dist) {
    ensureSkullLord(e);
    skullLordWaves(e);
    e.capesway += dt;
    e.dustT = Math.max(0, e.dustT - dt);
    e.capeFlare = Math.max(0, (e.capeFlare || 0) - dt * 1.8);
    e.prevX = e.x;
    e.prevY = e.y;

    if (e.atk) {
      e.atkT += dt;
      var wind = e.atkWind, active = e.atkActive, recover = e.atkRecover;
      var t = e.atkT;
      var aimAng = skullAimAng(e);
      if (!e.atkSwingSfx && t >= wind) {
        e.atkSwingSfx = true;
        sfx(e.atk === "cleave" ? "cleave" : "lunge");
        S.shake = Math.max(S.shake, e.atk === "lunge" ? 0.28 : 0.18);
      }
      if (e.atk === "cleave") {
        if (t < wind) {
          var w = easeOutCubic(Math.min(1, t / (wind * 0.78)));
          e.bladeLift = w * 1.0;
          e.bladeAng = skullBladeBang(aimAng, e.face * (-SKULL_CLEAVE_BACK * w));
          e.lean = -e.face * w * 0.62;
          e.crouch = w * 0.22;
          e.shieldFwd = -0.28 * w;
          e.capeFlare = w * 0.25;
          if (dist > 40) moveToward(e, dx / dist * 0.12, dy / dist * 0.12, e.spd * 0.28, dt);
          if (t < wind * 0.88 && dist > 1) {
            e.aimX = dx / dist;
            e.aimY = dy / dist;
            e.face = e.aimX < 0 ? -1 : 1;
          }
        } else if (t < wind + active) {
          var s = easeInCubic((t - wind) / active);
          e.bladeLift = 1.0 - s * 0.88;
          e.bladeAng = skullBladeBang(aimAng, e.face * (-SKULL_CLEAVE_BACK + s * (SKULL_CLEAVE_BACK + SKULL_CLEAVE_FWD)));
          e.lean = e.face * (-0.62 + s * 1.55);
          e.crouch = 0.22 - s * 0.12;
          e.shieldFwd = -0.28 + s * 0.5;
          e.capeFlare = 0.25 + s * 0.85;
          if (!e.slashTrail) e.slashTrail = [];
          var rad = skullCleaveReach(e) * 0.92;
          var tip = skullTipAng(e);
          e.slashTrail.push({
            x: e.x + Math.cos(tip) * rad,
            y: e.y + Math.sin(tip) * rad - artR(e) * 0.2,
            a: 1 - s
          });
          if (e.slashTrail.length > 16) e.slashTrail.shift();
          skullCleaveHit(e);
          if (s > 0.2 && s < 0.85) {
            burst(e.x + Math.cos(tip) * rad * 0.72, e.y + Math.sin(tip) * rad * 0.72, "#c9a44c", 1);
          }
        } else {
          var r = (t - wind - active) / recover;
          var hold = 1 - easeOutCubic(r);
          e.bladeLift = 0.12 * hold;
          e.bladeAng = skullBladeBang(aimAng, e.face * SKULL_CLEAVE_FWD) * hold + (e.face * -0.45) * (1 - hold);
          e.lean *= 0.86;
          e.crouch *= 0.88;
          e.shieldFwd *= 0.9;
          e.capeFlare *= 0.9;
          if (e.slashTrail) {
            for (var si = 0; si < e.slashTrail.length; si++) e.slashTrail[si].a *= 0.84;
          }
        }
      } else { /* lunge / charge stab */
        if (t < wind) {
          var lw = t / wind;
          var coil = easeOutCubic(Math.min(1, lw / 0.82));
          e.bladeLift = coil * 0.55;
          /* raise the slab vertical, then it will snap into the stab lane */
          e.bladeAng = (e.face * -0.45) * (1 - coil) + coil * (aimAng + Math.PI / 2 - e.face * 0.15);
          e.lean = -e.face * coil * 0.95;
          e.crouch = coil * 0.52;
          e.shieldFwd = coil * 1.05;
          e.dustT = 0.25;
          e.stride = coil * 0.22;
          /* creep only while still tracking; freeze feet once the lane locks */
          if (!e.dashCommit && dist > 50) {
            moveToward(e, dx / dist * 0.08, dy / dist * 0.08, e.spd * 0.22, dt);
          }
          /* lock aim ~42% in so the dashed lane is readable before the dash */
          if (lw < 0.42 && dist > 1) {
            e.aimX = dx / dist;
            e.aimY = dy / dist;
            e.face = e.aimX < 0 ? -1 : 1;
            e.dashLen = skullDashLen(e, dist);
          }
          if (lw >= 0.42 && !e.dashCommit) {
            e.dashCommit = true;
            e.dashFromX = e.x;
            e.dashFromY = e.y;
            e.dashLen = skullDashLen(e, dist);
            e.dashToX = e.x + e.aimX * e.dashLen;
            e.dashToY = e.y + e.aimY * e.dashLen;
          }
        } else if (t < wind + active) {
          if (!e.dashCommit) {
            e.dashCommit = true;
            e.dashFromX = e.x;
            e.dashFromY = e.y;
            e.dashLen = skullDashLen(e, dist);
            e.dashToX = e.x + e.aimX * e.dashLen;
            e.dashToY = e.y + e.aimY * e.dashLen;
          }
          var ls = (t - wind) / active;
          var fly = easeOutCubic(ls);
          e.bladeLift = 0.55 + fly * 0.35;
          e.bladeAng = aimAng + Math.PI / 2;
          e.lean = e.face * (-0.95 + fly * 1.85);
          e.crouch = 0.52 - fly * 0.42;
          e.shieldFwd = 1.05 - fly * 0.55;
          e.capeFlare = 0.4 + fly * 0.9;
          e.stride = 0.22 - fly * 0.4;
          skullSlide(e, e.dashFromX + (e.dashToX - e.dashFromX) * fly,
                        e.dashFromY + (e.dashToY - e.dashFromY) * fly);
          e.dustT = 0.4;
          burst(e.x - e.aimX * artR(e), e.y - e.aimY * artR(e) + artR(e) * 0.5, "#6a5a44", 2);
          skullLungeHit(e);
        } else {
          var lr = (t - wind - active) / recover;
          var plant = easeOutCubic(Math.min(1, lr / 0.28));
          var rest = easeOutCubic(lr);
          e.bladeLift = 0.9 * (1 - rest);
          e.bladeAng = (aimAng + Math.PI / 2) * (1 - rest) + (e.face * -0.45) * rest;
          e.lean = e.face * 0.9 * (1 - rest);
          e.crouch = 0.1 + plant * 0.22 * (1 - rest);
          e.shieldFwd *= 0.88;
          e.capeFlare *= 0.86;
          e.stride *= 0.85;
          if (lr < 0.18) {
            e.dustT = 0.45;
            S.shake = Math.max(S.shake, 0.22);
          }
          moveToward(e, e.aimX * 0.12, e.aimY * 0.12, e.spd * 0.22 * (1 - rest), dt);
        }
      }

      e.stridePhase = (e.stridePhase || 0) + dt * 6;
      if (e.atkT >= e.atkTotal) {
        var finished = e.atk;
        e.atk = null;
        e.atkT = 0;
        e.lastAtk = finished;
        if (finished === "lunge") e.lungeStreak = (e.lungeStreak || 0) + 1;
        else e.lungeStreak = 0;
        /* longer post-lunge rest so the next beat is walk/cleave, not spam */
        e.cd = (finished === "lunge" ? 1.55 : 1.05) + rnd() * 0.4;
        e.bladeLift = 0;
        e.bladeAng = e.face * -0.45;
        e.lean = 0;
        e.crouch = 0;
        e.shieldFwd = 0;
        e.capeFlare = 0;
        e.slashTrail = [];
        e.dashCommit = false;
      }
      return;
    }

    /* idle chase — after a lunge, press in for cleave instead of re-charging */
    var chase = dist > 240 ? 1.25 : dist > 150 ? 0.9 : dist > 90 ? 0.55 : 0.32;
    if (e.lastAtk === "lunge" || (e.lungeStreak || 0) >= 1) {
      chase = Math.max(chase, dist > 160 ? 1.35 : 0.95);
    }
    moveToward(e, dx / dist * chase, dy / dist * chase, e.spd, dt);
    e.face = dx < 0 ? -1 : 1;
    e.bladeAng = e.face * -0.45;
    e.lean = Math.sin(e.phase * 2.1) * 0.06;
    e.stridePhase = (e.stridePhase || 0) + dt * (dist > 50 ? 9 : 3.5);
    e.stride = Math.sin(e.stridePhase) * 0.14;
    if (e.cd <= 0) {
      var pick = pickSkullAtk(e, dist);
      if (pick) {
        startSkullAtk(e, pick, dx, dy, dist);
        sfx(pick);
      } else {
        e.cd = 0.28 + rnd() * 0.22;
      }
    }
  }

  function updateBoss(e, dt, dx, dy, dist) {
    e.phase += dt;
    if (e.boss === "ash") {
      /* ASH TITAN v4
         v3 ring: maxR 420, dmg 55+8*floor applied every frame in band, no tell, no gap
         v4 ring: maxR 196, dmg 8+floor applied ONCE, tell 1.35s, gap 1.15 rad */
      moveToward(e, dx / dist * 0.4, dy / dist * 0.4, e.spd, dt);
      if (e.tell > 0) {
        e.tell -= dt;
        if (e.tell <= 0) {
          e.ringOn = true; e.ringR = 28;
          var ang = Math.atan2(dy, dx) + (rnd() < 0.5 ? 2.4 : -2.4);
          e.gap = ang;
        }
      } else if (e.ringOn) {
        e.ringR += 150 * dt;
        if (!e.ringHit) {
          var pr = Math.hypot(player.x - e.x, player.y - e.y);
          var pang = Math.atan2(player.y - e.y, player.x - e.x);
          var ad = Math.abs(Math.atan2(Math.sin(pang - e.gap), Math.cos(pang - e.gap)));
          var inBand = Math.abs(pr - e.ringR) < 18;
          var inGap = ad < 0.575;
          if (inBand && !inGap) {
            e.ringHit = true;
            hurtPlayer(8 + S.floor);
          }
        }
        if (e.ringR >= 196) { e.ringOn = false; e.ringHit = false; e.cd = 2.2; }
      } else if (e.cd <= 0) {
        if (rnd() < 0.55) { e.tell = 1.35; e.ringHit = false; }
        else {
          fireShot(e.x, e.y, dx / dist, dy / dist, 200, 2, "knife", { owner: e });
          fireShot(e.x, e.y, dx / dist + 0.2, dy / dist, 180, 2, "knife", { owner: e });
          e.cd = 1.4;
        }
      }
    } else if (e.boss === "lord") {
      updateSkullLord(e, dt, dx, dy, dist);
    } else if (e.boss === "bone") {
      /* BB-V7.18 -- Bone King: slow chase + radial bone volley. */
      if (e.cd <= 0) {
        for (var k = 0; k < 6; k++) {
          var a = k * Math.PI / 3 + e.phase;
          fireShot(e.x, e.y, Math.cos(a), Math.sin(a), 170, 1, "knife", { owner: e });
        }
        e.cd = 2.0;
      }
      moveToward(e, dx / dist * 0.3, dy / dist * 0.3, e.spd, dt);
    } else if (e.boss === "slag") {
      /* BB-V7.19 -- Slag King: forge biome boss, radial hot knives + chase. */
      if (e.cd <= 0) {
        for (var sk = 0; sk < 8; sk++) {
          var sa = sk * Math.PI / 4 + e.phase * 0.7;
          fireShot(e.x, e.y, Math.cos(sa), Math.sin(sa), 185, 1, "knife", { owner: e });
        }
        e.cd = 1.85;
      }
      moveToward(e, dx / dist * 0.35, dy / dist * 0.35, e.spd, dt);
    } else if (e.boss === "thorn") {
      if (e.cd <= 0) {
        fireShot(e.x, e.y, dx / dist, dy / dist, 210, 2, "knife", { owner: e });
        e.cd = 0.7;
      }
      if (Math.floor(e.phase) % 4 === 0 && e.tell <= 0) e.tell = 0.01;
      moveToward(e, dx / dist * 0.5, dy / dist * 0.5, e.spd, dt);
    } else {
      /* BB-V7.18 — per-knight kits (special / normal / wild) */
      updateKnight(e, dt, dx, dy, dist);
    }
  }

  function killShot(i) {
    var s = S.shots[i];
    if (s && (s.kind === "weapon" || s.kind === "ember" || s.kind === "bone" || s.kind === "needle")) {
      burst(s.x, s.y, s.col || s.accent || "#c8d0d8", s.kind === "weapon" ? 10 : 6);
    }
    S.shots.splice(i, 1);
  }

  function updateShots(dt) {
    for (var i = S.shots.length - 1; i >= 0; i--) {
      var s = S.shots[i];
      if (s.inert) {
        s.life -= dt;
        if (s.life <= 0) killShot(i);
        continue;
      }
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      var shotBlock = blockAt(room.blocks, s.x, s.y, s.r);
      if (tileAt(room.grid, s.x, s.y) || shotBlock >= 0) {
        if (shotBlock >= 0) hurtBlockAt(shotBlock, blockDmgFromShot(s));
        killShot(i); continue;
      }
      if (Math.hypot(s.x - player.x, s.y - player.y) < player.r + s.r) {
        hurtPlayer(s.dmg); killShot(i); continue;
      }
      if (s.life <= 0) killShot(i);
    }
  }

  function updateBlocks(dt) {
    if (!room || !room.blocks) return;
    var bl = room.blocks, gone = false, i;
    for (i = bl.length - 1; i >= 0; i--) {
      if (bl[i].life == null) { bl[i].life = BLOCK_LIFE; bl[i].maxLife = BLOCK_LIFE; }
      if (bl[i].hp == null) { bl[i].hp = BLOCK_HITS; bl[i].maxHp = BLOCK_HITS; }
      bl[i].life -= dt;
      if (bl[i].life <= 0 || bl[i].hp <= 0) {
        burst(bl[i].x, bl[i].y, "#8a7a60", 7);
        bl.splice(i, 1);
        gone = true;
      }
    }
    if (gone) syncRoomBlocks();
  }

  function updateLoot(dt) {
    for (var i = S.loot.length - 1; i >= 0; i--) {
      var it = S.loot[i];
      /* BB-V7.22 — settle at the drop point (last enemy / chest location), not
         the bottom of the screen. restY falls back for any legacy loot. */
      var floorY = (it.restY != null) ? it.restY : (playH() - 40);
      it.life -= dt; it.vy += 80 * dt; it.y += it.vy * dt;
      if (it.y > floorY) { it.y = floorY; it.vy *= -0.3; }
      if (!it.taken && Math.hypot(it.x - player.x, it.y - player.y) < 28) takeLoot(it);
      if (it.life <= 0 || it.taken) S.loot.splice(i, 1);
    }
  }

  function burst(x, y, col, n) {
    for (var i = 0; i < n && S.particles.length < MAX_PART; i++) {
      var a = rnd() * Math.PI * 2, sp = 40 + rnd() * 120;
      S.particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0.4 + rnd() * 0.3, col: col, s: 2 + rnd() * 3 });
    }
  }
  function floatTxt(x, y, t, c) {
    S.floats.push({ x: x, y: y, t: t, c: c || "#fff", life: 0.8, vy: -36 });
  }
  function updateFx(dt) {
    for (var i = S.particles.length - 1; i >= 0; i--) {
      var p = S.particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 80 * dt; p.t -= dt;
      if (p.t <= 0) S.particles.splice(i, 1);
    }
    for (var j = S.floats.length - 1; j >= 0; j--) {
      var f = S.floats[j];
      f.y += f.vy * dt; f.life -= dt;
      if (f.life <= 0) S.floats.splice(j, 1);
    }
    for (var k = S.pops.length - 1; k >= 0; k--) {
      S.pops[k].t -= dt;
      if (S.pops[k].t <= 0) S.pops.splice(k, 1);
    }
    if (S.placeCd > 0) S.placeCd -= dt;
    if (S.shake > 0) S.shake -= dt;
    if (S.muteFx > 0) S.muteFx -= dt;
    if (S.bossBeat > 0) {
      /* Boss lairs hold until a swish. Knight rooms stay optional, but once a
         ready shot is in the air (or the swish cine is running) hold so every
         make gets the full track → punch → ease camera. */
      var hoopShotLive = !!(S.hoopReady && room && room.hoop && !room.hoop.swished &&
        ball && ball.live && !ball.ret);
      var holdBeat = (S.cine && S.cine.active) || hoopShotLive ||
        (S.hoopReady && room && room.hoop && !room.hoop.swished && room.kind === "boss");
      if (!holdBeat) S.bossBeat -= dt;
      if (S.bossBeat <= 0 && room && room.cleared) {
        S.hoopReady = false;
        nextRoomOrFloor();
      }
    }
    updateHoop(dt);
    updateCine(dt);
  }

  function placeGhostCell() {
    if (!player || !room) return null;
    var ptx = Math.floor(player.x / TILE), pty = Math.floor(player.y / TILE);
    var dx = player.facing >= 0 ? 1 : -1;
    var cand = [[ptx + dx, pty], [ptx + dx, pty - 1], [ptx + dx, pty + 1], [ptx, pty - 1], [ptx, pty + 1], [ptx - dx, pty]];
    for (var i = 0; i < cand.length; i++) {
      var tx = cand[i][0], ty = cand[i][1];
      if (ty <= 0 || tx <= 0 || ty >= playRows() - 1 || tx >= playCols() - 1) continue;
      if (room.grid[ty] && room.grid[ty][tx]) continue;
      if (tx === ptx && ty === pty) continue;
      var occupied = false;
      var bl = room.blocks || [];
      for (var b = 0; b < bl.length; b++) {
        if (bl[b].tx === tx && bl[b].ty === ty) { occupied = true; break; }
      }
      if (occupied) continue;
      return { tx: tx, ty: ty };
    }
    return null;
  }

  /* BB-V7.29 — a refused place shakes the cube instead of printing NO SPACE /
     NO BLOCKS across the field. The empty cube already reads dim; the shake
     says "not now" without a word. */
  function denyPlace() {
    var btn = document.getElementById("btnBlock");
    if (btn) {
      btn.classList.remove("deny");
      void btn.offsetWidth;
      btn.classList.add("deny");
      clearTimeout(S.placeDenyT);
      S.placeDenyT = setTimeout(function () { btn.classList.remove("deny"); }, 420);
    }
    sfx("deny");
  }

  function tryPlaceAtGhost() {
    if (S.placeCd > 0) return;
    if (!player || player.blockStock <= 0) { denyPlace(); return; }
    var c = placeGhostCell();
    if (!c) { denyPlace(); return; }
    var before = player ? player.blockStock : 0;
    tryPlaceBlock((c.tx + 0.5) * TILE, (c.ty + 0.5) * TILE);
    if (player && player.blockStock < before) S.placeCd = 0.14;
  }

  function tryPlaceBlock(wx, wy) {
    if (player.blockStock <= 0) { toast("NO BLOCKS"); return; }
    var tx = Math.floor(wx / TILE), ty = Math.floor(wy / TILE);
    if (ty <= 0 || tx <= 0 || ty >= playRows() - 1 || tx >= playCols() - 1) return;
    if (room.grid[ty][tx]) return;
    var ptx = Math.floor(player.x / TILE), pty = Math.floor(player.y / TILE);
    if (tx === ptx && ty === pty) return;
    var x = (tx + 0.5) * TILE, y = (ty + 0.5) * TILE;
    var bl = room.blocks || [];
    for (var i = 0; i < bl.length; i++) {
      if (bl[i].tx === tx && bl[i].ty === ty) return;
    }
    room.blocks.push({
      x: x, y: y, tx: tx, ty: ty,
      life: BLOCK_LIFE, maxLife: BLOCK_LIFE,
      hp: BLOCK_HITS, maxHp: BLOCK_HITS
    });
    syncRoomBlocks();
    player.blockStock -= 1;
    sfx("place");
    syncHud();
  }

  /* CHIEF BB-V5.1 — solid test and axis-separated movement. Axis-separated so a hero
     pushing into a corner slides along the wall instead of sticking to it, which is
     the difference between a control that feels alive and one that feels broken. */
  /* East exit span matches carveDoor("e"): two tiles on the right wall at doorY. */
  function eastDoorSpan() {
    if (!room || !room.grid) return null;
    var cols = playCols(), rows = playRows();
    var dy = doorY(room.grid);
    var y0 = Math.max(1, dy - 1), y1 = Math.min(rows - 2, dy);
    if (y1 === y0) y1 = Math.min(rows - 2, y0 + 1);
    if (!(room.grid[y0] && room.grid[y0][cols - 1] === 0)) return null;
    return { tx: cols - 1, y0: y0, y1: y1, cols: cols, rows: rows };
  }
  function isEastDoorTile(tx, ty) {
    var d = eastDoorSpan();
    return !!(d && tx === d.tx && ty >= d.y0 && ty <= d.y1);
  }
  /* 0 = sealed, 1 = fully open. Opens over clearWait so the swing is readable. */
  function exitDoorOpenAmt() {
    if (!room || !room.cleared) return 0;
    if (room.clearWait > 0) return 1 - Math.min(1, room.clearWait / 0.7);
    return 1;
  }

  function solidAt(x, y) {
    if (!room) return true;
    var tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);
    if (tx < 0 || ty < 0 || tx >= playCols() || ty >= playRows()) return true;
    if (room.grid[ty] && room.grid[ty][tx]) return true;
    /* Sealed exit reads as stone until the room is cleared. */
    if (!room.cleared && isEastDoorTile(tx, ty)) return true;
    var bl = room.blocks || [];
    for (var i = 0; i < bl.length; i++) {
      if (Math.abs(bl[i].x - x) < TILE * 0.5 && Math.abs(bl[i].y - y) < TILE * 0.5) return true;
    }
    return false;
  }

  function freeAt(x, y, r) {
    return !solidAt(x - r, y - r) && !solidAt(x + r, y - r) &&
           !solidAt(x - r, y + r) && !solidAt(x + r, y + r) &&
           !solidAt(x, y - r) && !solidAt(x, y + r) &&
           !solidAt(x - r, y) && !solidAt(x + r, y);
  }

  /* CHIEF BB-V5.6 — how the walk feels is the game, not a detail. Four things make
     the difference between a hero who walks well and one who slides around:

       1. He accelerates and stops on a ramp, not a switch. Starting is quick (he is
          responsive) and stopping is quicker (he does not skate past the spot you
          let go on).
       2. Diagonals are normalised, so walking corner-ways is not 41% faster.
       3. A corner nudge: when the leading edge clips a tile corner but the way past
          is clear a few pixels over, he is slid those few pixels instead of stopping
          dead. Without this every doorway snags and the whole thing feels sticky.
       4. Keys as well as the stick, summed, so a desk and a thumb both work. */
  var KEYS = Object.create(null);

  function inputVec() {
    var mx = STK.L.dx, my = STK.L.dy;
    if (KEYS.left) mx -= 1;
    if (KEYS.right) mx += 1;
    if (KEYS.up) my -= 1;
    if (KEYS.down) my += 1;
    var m = Math.hypot(mx, my);
    if (m > 1) { mx /= m; my /= m; m = 1; }
    return { x: mx, y: my, m: m };
  }

  /* FEEL — live-tunable, persisted. Defaults are the v3-equivalent: that build ran
     158 px/s at 1.00x sprite scale and was the one that got "keep the controls";
     the sprite is now 2.15x, and speed is felt in body-lengths, so 158 * 2.15 = 340.
     Shipping at 235 was a 31% slowdown in the only unit that matters.
     BB-V7.8 — Joe: movement a bit too high. Default MOVE 340 → 290 (~15%). Aim pad,
     drag-to-shoot, power curve, and throwSpd stay locked.
     BB-V7.9 — still a bit high on the live phone. 290 → 250. Throw/aim still locked.
     BB-V7.10 — landscape type fills the unused width; shop BUY buttons share
     a max-content right column per stack so neighbours line up exactly.
     BB-V7.11 — landscape copy right-justified so labels sit against their buttons.

     BB-V7.12b — Skull Lord (was Bone King slot): curated lair, melee cleave+lunge,

     BB-V7.13 — NBA hoop + cinematic swish; HP pips collapse to a bar after 8.
     BB-V7.14 — larger translucent walk/shot rings; phone HUD sized off viewport.
     BB-V7.15 — silhouette hitboxes: contact matches painted body for hero,
     trash, knights, and Skull Lord; split KNIGHT_VIS / LORD_VIS.
     BB-V7.16-spend — upgrade menu at 90% scale, top-center origin.
     BB-V7.16 — Skull Lord hall ~2.3× the v7.12 lair; cleave/lunge ease,

     BB-V7.17 — no auto exit-pull on clear; closed/open east door.
     BB-V7.18 — mini knights each get a special / normal / wild kit with
     distinct weapons, telegraphs, and pose clocks.
     BB-V7.18-realm — doubled rooms, knight chambers, Bone King restored.
     BB-V7.19 — Bosses on 3/6/9/12; floors 13-16 reincarnation gauntlet before
     Skull Lord; landscape boss splash; throneGate origin-biome centers.
     BB-V7.19-wall — row-sort walls with actors so south cubes occlude feet; softer
     hero bob/shadow against a south wall so he stops floating on the block.
     BB-V7.20 — paint-only back-wall HEIGHT 1–4 (half/wall/high/deep); solid
     walls; per-room wallH from procedural/curated rules + builder share.
     BB-V7.21 — soft DOWN beat before room reset; Skull Lord lunge longer
     telegraph + early lane lock, attack mix stops lunge spam.
     BB-V7.22 — difficulty tiers; loot hops settle at drop point; FEEL controls
     and dungeon builder entry hidden from player menus.
     BB-V7.23 — held-ball dribble while walking (bounce, squash, soft tap, arm).

     end-of-floor knight chambers get the same hoop + optional swish window.
     BB-V7.24 — large rooms zoom out toward TILE_CSS_MIN + smoothed cam pan.
     BB-V7.24 — track→punch→ease camera on every hoop swish (boss + knight).
     BB-V7.25 — iPad/tablet bolt-on: capped sticks nearer corners, denser HUD,

     WebAudio beeps cannot kill the loop; shade/ellipse/blocks/cos/ball
     guards; splash JPEG dropped when a run starts.
     BB-V7.32 — ambient audio session so Audible / Music mix with the beeps;
