<style>

       and taking the height from 100dvh gives the panels the viewport that is
       actually visible, and the card's max-height then means what it says. */

    top: 0;
    left: 0;
    right: 0;
    bottom: auto;
    overflow: hidden;
    background: #14110e;
    height: 100dvh;

  #hud {

       nudge one without dragging the rest. Change a --hud-*-t/l/r, not a flex group.

       digit counts never clip the next icon; only the row origin is absolute. */

    --hud-heart: clamp(24px, 7vh, 36px);
    --hud-heart-h: clamp(21px, 6.1vh, 32px);
    /* Five starting pips share this track as near-squares; extra HP narrows them. */

    --hud-hp-bar-w: var(--hud-hp-track);
    --hud-hp-bar-h: var(--hud-heart-h);
    --hud-hp-num: clamp(13px, 3.6vh, 18px);

    --hud-meta-fs: clamp(18px, 5.4vh, 28px);

  #menuCard .menuCol {
    display: flex;
    flex-direction: column;
    gap: clamp(4px, 0.9cqi, 8px);
    min-width: 0;
    min-height: 0;
    flex: 1 1 0;
  }
  #menuCard .menuHead {
    flex: 0 0 auto;
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    align-items: baseline;
    gap: clamp(6px, 1.2cqi, 12px);
    min-width: 0;
  }
  #menuCard h1.title {
    text-align: left;
    font-size: clamp(13.5px, 4.2cqi, 28px);
    letter-spacing: 0.06em;
    line-height: 0.95;
    margin: 0;
    white-space: nowrap;
  }
  #menuCard h1.tTop { margin: 0; }
  #menuCard h1.tBot { margin: 0; }
  #menuCard .menuBrand { flex: 0.9 1 0; }
  #menuCard .menuDiff { flex: 1.22 1 0; }
  #menuCard .menuSeed { flex: 1.12 1 0; }
  #menuCard h2 {
    margin: 0;
    font-size: clamp(13.5px, 2.1cqi, 15px);
    letter-spacing: 0.08em;
    line-height: 1.2;
  }
  #menuCard h2.fold {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    box-sizing: border-box;
    min-height: 44px;
    padding: 0 clamp(6px, 1.2cqi, 10px);
    background: #3a3026;
    border: 2px solid #6a5a44;
    border-radius: 4px;
  }
  #menuCard .foldArrow { font-size: clamp(13.5px, 2cqi, 15px); }
  #menuCard .menuStack {
    display: flex;
    flex-direction: column;
    flex-wrap: nowrap;
    align-items: stretch;
    gap: clamp(4px, 0.8cqi, 6px);
    flex: 1 1 auto;
  }
  #menuCard .menuStack .bb,
  #menuCard .menuBrand .bb.pri {
    width: 100%;
    box-sizing: border-box;
    min-height: 44px;
    flex: 1 1 44px;
    padding: 6px clamp(2px, 0.7cqi, 10px);
    font-size: clamp(13.5px, 2.3cqi, 16px);
    line-height: 1.15;
    white-space: nowrap;
    text-align: center;
  }
  #menuCard .menuSeed .menuStack .bb {
    white-space: normal;
    overflow-wrap: break-word;
  }
  #menuCard input.bb {
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
    min-height: 44px;
    padding: 6px 8px;
    font-size: clamp(13.5px, 2.3cqi, 16px);
  }
  #menuCard .muted,
  #menuCard .menuBlurb,
  #menuCard .menuFoot {
    font-size: clamp(13.5px, 2cqi, 14px);
    margin: 0;
    line-height: 1.25;
  }
  #menuCard .menuBlurb {
    flex: 0 0 auto;
  }
  #menuCard .menuFoot {
    flex: 0 0 auto;
  }
  #menuCard .menuSound {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: clamp(6px, 1cqi, 10px);
    min-width: 0;
  }
  #menuCard .menuSound .soundVol {
    margin-top: 0;
    max-width: none;
    width: 100%;
    flex: 1 1 auto;
  }
  #menuCard .menuSound .soundRow { flex: 0 0 auto; }
  #menuCard.menuCosOpen {
    gap: clamp(6px, 1.2cqi, 10px);
  }
  #menuCard.menuCosOpen #cosBox {
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: clamp(4px, 0.8cqi, 6px);
  }
  #menuCard.menuCosOpen #cosBox .row {
    flex-wrap: wrap;
    gap: 4px;
  }
  #menuCard.menuCosOpen #cosBox .bb {
    min-height: 44px;
    box-sizing: border-box;
    padding: 6px 8px;
    font-size: clamp(13.5px, 2.2cqi, 15px);
  }
  #toasts {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(88px + env(safe-area-inset-top));
    display: flex; flex-direction: column; gap: 6px; pointer-events: none; z-index: 30;
  }
  .toast {
    background: #2a2218ee; border: 2px solid #d06018; padding: 6px 10px; font-weight: 800;
    font-size: 14px; color: #ffe8c0;
  }
  #topbar, #botbar {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
    pointer-events: none;
  }
  .hud-item { position: absolute; display: none; }
  #hud.play #hpPips { display: flex; }
  #hud.play #metaRow { display: flex; }
  #hud.play #placePips { display: grid; }
  #hud.play #btnBlock { display: block; }
  #hud.play #btnPause { display: flex; }
  #hpPips {
    top: var(--hud-hp-t); left: var(--hud-hp-l);
    flex-wrap: nowrap; align-items: center; max-width: 48vw;
  }
  /* BB-V7.35 — HP is rectangles, not hearts. They share a fixed track so extra
     max HP makes each pip narrower, then they merge into a ticked bar, then a bar. */
  #hpPips.hp-pips {
    width: var(--hud-hp-track);
    gap: var(--hp-gap, 4px);
  }
  #hpPips .hpPip {
    flex: 1 1 0;
    min-width: 0;
    height: var(--hud-heart-h);
    box-sizing: border-box;
    background: #2a1814;
    border: 2px solid #5a5040;
    box-shadow: 0 1px 0 #1a120c;
  }
  #hpPips .hpPip.on {
    background: linear-gradient(#e07058, #c03830);
    border-color: #c87870;
    box-shadow: 0 1px 0 #1a120c, 0 0 6px rgba(208,64,56,0.35);
  }
  .hpMeter {
    display: flex; align-items: center; gap: 6px;
    min-width: 0;
  }
  .hpBar {
    position: relative;
    width: var(--hud-hp-bar-w); height: var(--hud-hp-bar-h);
    flex: 0 0 auto;
    background: #2a1814;
    border: 2px solid #8a5048;
    box-sizing: border-box;
    box-shadow: 0 1px 0 #1a120c;
    overflow: hidden;
  }
  .hpFill {
    display: block; height: 100%;
    background: linear-gradient(#e07058, #c03830);
    box-shadow: 0 0 6px rgba(208,64,56,0.45);
  }
  .hpTick {
    position: absolute;
    top: 0; bottom: 0;
    width: 1px;
    margin-left: -0.5px;
    background: rgba(240, 224, 208, 0.42);
    box-shadow: 0 0 0 1px rgba(26, 18, 12, 0.28);
    pointer-events: none;
    z-index: 1;
  }
  .hpNum {
    font-weight: 800; font-size: var(--hud-hp-num); color: #f0e6d4;
    text-shadow: 0 1px 0 #1a120c;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    flex: 0 0 auto;
  }
  #metaRow {
    top: var(--hud-meta-t); left: var(--hud-meta-l);
    align-items: center; gap: var(--hud-meta-gap);
    max-width: calc(100% - var(--hud-place-r) - var(--hud-place-w) - 16px);
    flex-wrap: wrap;
  }
  .meta {
    display: inline-flex; align-items: center; gap: 6px;
    font-weight: 800; font-size: var(--hud-meta-fs); color: #f0e6d4;
    text-shadow: 0 1px 0 #1a120c;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    flex: 0 0 auto;
  }
  .meta svg { display: block; flex: 0 0 auto; width: var(--hud-meta-ico); height: var(--hud-meta-ico); }
  .meta b { font-weight: 800; }
  #placePips {
    top: var(--hud-pips-t); right: var(--hud-pips-r);
    grid-template-columns: repeat(3, var(--hud-pip));
    grid-auto-rows: var(--hud-pip-h);
    gap: 4px 4px;
    pointer-events: none;
  }
  .mini-cube {
    width: var(--hud-pip); height: var(--hud-pip-h);
    position: relative;
    opacity: 0.16;
  }
  .mini-cube svg { display: block; width: 100%; height: 100%; }
  .mini-cube.on { opacity: 0.55; filter: drop-shadow(0 0 2px rgba(240,176,64,0.45)); }
  .mini-cube.partial { opacity: 0.42; }
  #btnBlock {
    top: var(--hud-place-t); right: var(--hud-place-r);
  }
  .place-btn {
    width: var(--hud-place-w); height: var(--hud-place-h);
    padding: 0; margin: 0;
    border: 0; background: transparent;
    cursor: pointer;
    /* BB-V7.29 — none, not manipulation: the exit-pull slides the held finger
       off the cube, and the browser must never turn that into a pan/cancel. */
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    filter: drop-shadow(0 1px 0 rgba(26,18,12,0.45));
  }
  .place-btn .place-svg { display: block; width: 100%; height: 100%; pointer-events: none; }
  .place-btn .place-words {
    position: absolute; left: 0; right: 0; top: 30%;
    text-align: center; pointer-events: none;
    font-weight: 800; font-size: var(--hud-place-fs); line-height: 1.05;
    letter-spacing: 0.04em; color: #f0e6d4;
    opacity: 0.72;
    text-shadow: 0 1px 0 #1a120c;
  }
  .place-btn.empty { opacity: 0.32; filter: grayscale(0.35) drop-shadow(0 1px 0 rgba(26,18,12,0.45)); }
  .place-btn.armed {
    transform: translateY(1px) scale(0.97);
    filter: drop-shadow(0 0 8px rgba(255,190,70,0.95));
  }
  .place-btn.armed .iso-top { fill: rgba(255,240,190,0.55); }
  .place-btn.armed .iso-left { fill: rgba(240,180,70,0.42); }
  .place-btn.armed .iso-right { fill: rgba(190,130,48,0.42); }
  .place-btn.armed .place-words { color: #3a1808; opacity: 0.9; }
  /* Exit-pull: finger slid off the held cube — it lets go of the glow and greys. */
  .place-btn.armed.pull {
    transform: none;
    filter: grayscale(0.6) drop-shadow(0 1px 0 rgba(26,18,12,0.45));
  }
  .place-btn.armed.pull .iso-top { fill: rgba(200,190,170,0.22); }
  .place-btn.armed.pull .iso-left { fill: rgba(150,140,120,0.18); }
  .place-btn.armed.pull .iso-right { fill: rgba(110,100,85,0.18); }
  .place-btn.armed.pull .place-words { color: #f0e6d4; opacity: 0.45; }
  /* Refused place: a short shake with a red flash instead of a text toast. */
  @keyframes place-deny {
    0% { transform: translateX(0); }
    20% { transform: translateX(-5px); }
    45% { transform: translateX(5px); }
    70% { transform: translateX(-3px); }
    100% { transform: translateX(0); }
  }
  .place-btn.deny { animation: place-deny 0.34s ease-out; }
  .place-btn.deny .iso-top { fill: rgba(230,120,100,0.45); stroke: rgba(255,170,150,0.8); }
  .place-btn.deny .iso-left { fill: rgba(200,90,70,0.32); }
  .place-btn.deny .iso-right { fill: rgba(150,60,45,0.32); }
  #btnPause {
    top: var(--hud-pause-t); left: var(--hud-pause-l);
    background: transparent;
    border: 0;
    box-shadow: none;
    z-index: 5;
    touch-action: manipulation;
    filter: drop-shadow(0 1px 0 rgba(26,18,12,0.45));
  }
  #btnPause svg { opacity: 0.42; }
  #btnPause:hover svg,
  #btnPause:focus-visible svg { opacity: 0.7; }
  #btnPause:active svg { opacity: 0.86; }
  #hud button.bb.icon-btn {
    width: var(--hud-pause);
    height: var(--hud-pause);
    padding: 6px;
    box-sizing: border-box;
    align-items: center; justify-content: center;
  }
  #hud button.bb.icon-btn svg { width: 78%; height: 78%; }
  #botbar .row { min-height: 0; }
  #botbar { position: absolute; left: 0; right: 0; bottom: 0;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    pointer-events: none;
  }
  .chip {
    background: #1a1612cc; border: 2px solid #4a4032; padding: 4px 8px; font-weight: 800;
    font-size: 13px; pointer-events: auto;
  }
  #copybox { width: 100%; min-height: 72px; }
</style>
</head>
<body>
<div id="shell">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hud">
    <div id="hpPips" class="hud-item" aria-label="health"></div>
    <div id="metaRow" class="hud-item" aria-label="run stats">
      <span class="meta" id="flChip" title="floor">
        <svg width="26" height="26" viewBox="0 0 14 14" aria-hidden="true"><rect x="1" y="8" width="12" height="5" rx="0.5" fill="#6a5a44" stroke="#c4b49a" stroke-width="1"/><rect x="3" y="4" width="8" height="5" rx="0.5" fill="#8a7a60" stroke="#e8dcc8" stroke-width="1"/><rect x="5" y="1" width="4" height="4" rx="0.5" fill="#c4a060" stroke="#f0e6d4" stroke-width="1"/></svg>
        <b id="flNum">1</b>
      </span>
      <span class="meta" id="scChip" title="score">
        <svg width="26" height="26" viewBox="0 0 14 14" aria-hidden="true"><polygon points="7,1 13,7 7,13 1,7" fill="#d0a040" stroke="#f0e0a0" stroke-width="1"/></svg>
        <b id="scNum">0</b>
      </span>
      <span class="meta" id="frChip" title="fragments">
        <svg width="22" height="26" viewBox="0 0 12 14" aria-hidden="true"><polygon points="6,1 11,6 8,13 4,13 1,6" fill="#70b0d0" stroke="#d0f0ff" stroke-width="1"/></svg>
        <b id="frNum">0</b>
      </span>
    </div>
    <div id="placePips" class="hud-item" aria-hidden="true"></div>
    <button type="button" class="hud-item place-btn" id="btnBlock" aria-label="place me">
      <svg class="place-svg" viewBox="0 0 80 88" aria-hidden="true">
        <polygon class="iso-top" points="40,6 74,24 40,42 6,24" fill="rgba(248,228,180,0.22)" stroke="rgba(255,236,200,0.50)" stroke-width="1.6"/>
        <polygon class="iso-left" points="6,24 40,42 40,76 6,58" fill="rgba(196,150,72,0.18)" stroke="rgba(255,220,150,0.38)" stroke-width="1.4"/>
        <polygon class="iso-right" points="40,42 74,24 74,56 40,76" fill="rgba(140,96,40,0.18)" stroke="rgba(255,210,140,0.36)" stroke-width="1.4"/>
      </svg>
      <span class="place-words">place<br>me</span>
    </button>
    <button type="button" class="hud-item bb icon-btn" id="btnPause" aria-label="pause">
      <svg width="22" height="22" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1" width="4" height="12" fill="#f0e6d4"/><rect x="8" y="1" width="4" height="12" fill="#f0e6d4"/></svg>
    </button>
    <!-- CHIEF FIX BB-V6.7 — the bottom strip sat under both thumbs. BALL and SEED
         were read-only labels that belong on the pause card, not across the play
         field; BLOCK sits top-right and PAUSE is a ghost under floor/score/frag
         (BB-V7.37). The bottom of the screen belongs to the two rings and nothing else. -->
    <div id="botbar">
      <div class="row"></div>
      <div class="row"></div>
    </div>
    <div id="toasts"></div>
  </div>
  <div id="install">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
      <rect x="4" y="8" width="14" height="12" rx="2" fill="none" stroke="#f0e6d4" stroke-width="2"/>
      <path d="M11 2 v10" stroke="#f0e6d4" stroke-width="2" fill="none"/>
      <path d="M7 6 l4 -4 l4 4" stroke="#f0e6d4" stroke-width="2" fill="none"/>
    </svg>
    <div class="grow"><b>Add to Home Screen</b> for the full app — tap Share, then Add to Home Screen.</div>
    <button id="btnInstallX" type="button">OK</button>
  </div>
  <div id="rotate"><div class="phone"></div><div style="font-size:22px;font-weight:800">Turn sideways to play</div><div class="muted">The dungeon is wider than it is tall. Rotate the device and the run picks up where it is.</div></div>
  <div class="panel splash" id="splashPanel"><div class="card splashCard" id="splashCard"></div></div>
  <div class="panel" id="menuPanel"><div class="card menuCard" id="menuCard"></div></div>
  <div class="panel" id="pausePanel"><div class="card" id="pauseCard"></div></div>
  <div class="panel" id="shopPanel"><div class="card" id="shopCard"></div></div>
  <div class="panel" id="floorPanel"><div class="card" id="floorCard"></div></div>
  <div class="panel" id="builderPanel"><div class="card" id="builderCard"></div></div>
  <div class="panel" id="feelPanel"><div class="card" id="feelCard"></div></div>
</div>
<script>
(function () {
  "use strict";
  var DIR = location.pathname.replace(/[^\/]*$/, "");

  var WORLD_W = 960, WORLD_H = 540, TILE = 30;
  var COLS = 32, ROWS = 18;
  /* BB-V7.7 — TILE stays 30 world px (one dungeon cube / place-block).
     WORLD_W/H and COLS/ROWS are the builder ceiling (32×18). Generated rooms
     choose their own cols×rows; cameraFit follows the live room. TILE_CSS is
     the on-screen target so cubes read on a phone (~30 CSS px, not the old
     hard 34px floor and not fit-only ~22px).
     BB-V7.24 — oversized rooms ease toward TILE_CSS_MIN so more of the arena
     stays framed (less frantic follow), and cam pan lerps instead of snapping. */
  var TILE_CSS = 30;
  var TILE_CSS_MIN = 22;
  var CAM_PAN_RATE = 7;
  /* BB-V7.15 — draw scale and hurtboxes follow what is painted, not one shared
     boss multiplier. Trash / knights / Skull Lord each get their own vis, and
     contact boxes are authored from the silhouette (torso), not r*N. */
  var MOB_VIS = 0.56;
  var KNIGHT_VIS = 0.86; /* minis: between HS 1.7 hero and the floor lord */
  var LORD_VIS = 0.72;   /* Skull Lord: ~+35% taller than a knight on screen */
  var BOSS_VIS = 0.76;   /* ash / thorn legacy arts */
  function enemyVis(e) {
    if (!e || !e.boss) return MOB_VIS;
    if (e.boss === "mini") return KNIGHT_VIS;
    if (e.boss === "lord") return LORD_VIS;
    return BOSS_VIS;
  }
  /* art radius used by draw* — physics uses bodyR / e.r after fitSilhouette */
  function artR(e) { return (e && e.artR != null) ? e.artR : (e ? e.r : 0); }
  /* BB-V7.9 — ball sprite AND hitbox. 17 sat huge next to HS 1.7 / r 24. */
  var BALL_R = 14;
  /* Hero body: sc=22*HS, default torso width ~0.84*sc → half ≈ 16. Contact
     sits on that torso, not the old r=24 halo. */
  var PLAYER_R = 17;
  /* BB-V7.12 — placed cubes are temporary cover: crumble on a timer AND take
     hits. HP is 2: a normal mob needs two, a knight / floor boss one-shots.
     The hero ball still clears a cube in one bounce. Permanent dungeon walls
     stay in room.grid; only room.blocks are soft. */
  var BLOCK_LIFE = 6.4;
  var BLOCK_HITS = 2;
  var DT = 1 / 60;

        if (g[t.ty]) g[t.ty][t.tx] = 0;

      }
      fillEnts(ents, { takeTile: takeTile, forceTile: forceTile, g: g, cols: cols, spawn: spawn });
      var spec = {

        spawn: spawn, cols: cols, rows: made.rows, pathOk: made.pathOk,
        tileset: null, centerTileset: null, bossIntro: false,
        wallH: pickWallH(kind, piece, cols, made.rows)

      if (extra) {

    for (var i = 0; i < nRooms; i++) {
      var kind, piece, doors;
      if (i > 0 && i < nRooms - 1 && rnd() < 0.42) { kind = "corridor"; piece = pick(hallPool); }
      else { kind = "room"; piece = pick(roomPool); }
      if (i === 0) doors = ["e"];
      else doors = ["w", "e"];
      pushRoom(kind, piece, doors, function (ents, api) {

    if (skullRevive) {

      var rtype = REVIVE_KNIGHTS[Math.max(0, Math.min(REVIVE_KNIGHTS.length - 1, ri))];
      var rmul = REVIVE_HP_MUL[Math.max(0, Math.min(REVIVE_HP_MUL.length - 1, ri))];
      pushRoom("mini", "throneGate", knightDoors, function (ents, api) {
        var kt = api.forceTile();
        ents.push({ kind: "enemy", type: rtype, tx: kt.tx, ty: kt.ty, hpMul: rmul, revive: true });
        if (rnd() < 0.45) {

    } else {

        if (rnd() < 0.5) {

    if (bossFloor) {

      }, null);
    } else if (skullLordHere) {

      pushRoom("boss", "skullLair", ["w"], function (ents, api) {
        var bt = api.forceTile();
        ents.push({ kind: "enemy", type: "skulllord", tx: bt.tx, ty: bt.ty });

  function tileAt(g, x, y) {
    var tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);

  /* BB-V7.25 — rim hangs on the wall face (boardY < 0). Open a narrow north-wall

  function hoopLaneOpen(tx, ty) {
    if (ty !== 0) return false;
    if (!S.hoopReady || !room || !room.hoop || room.hoop.swished) return false;
    var hx = Math.floor(room.hoop.x / TILE);

  }
  function tileAtBall(g, x, y) {
    var tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);

  }
  function circleBlocked(g, blocks, x, y, r) {
    if (tileAt(g, x - r, y) || tileAt(g, x + r, y) || tileAt(g, x, y - r) || tileAt(g, x, y + r) || tileAt(g, x, y)) return true;
    if (!blocks) return false;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (Math.abs(x - b.x) < r + TILE * 0.45 && Math.abs(y - b.y) < r + TILE * 0.45) return true;
    }
    return false;
  }
  function ballCircleBlocked(g, blocks, x, y, r) {
    if (tileAtBall(g, x - r, y) || tileAtBall(g, x + r, y) || tileAtBall(g, x, y - r) ||
        tileAtBall(g, x, y + r) || tileAtBall(g, x, y)) return true;
    if (!blocks) return false;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (Math.abs(x - b.x) < r + TILE * 0.45 && Math.abs(y - b.y) < r + TILE * 0.45) return true;

  function resolveCircle(g, blocks, o) {
    if (!circleBlocked(g, blocks, o.x, o.y, o.r)) return false;
    var hit = false;
    if (tileAt(g, o.x + o.r, o.y) || tileAt(g, o.x - o.r, o.y) || blockHit(blocks, o.x, o.y, o.r, true)) {
      o.x -= o.vx * DT * 1.1; o.vx *= -1; hit = true;
    }
    if (tileAt(g, o.x, o.y + o.r) || tileAt(g, o.x, o.y - o.r) || blockHit(blocks, o.x, o.y, o.r, false)) {
      o.y -= o.vy * DT * 1.1; o.vy *= -1; hit = true;
    }
    if (circleBlocked(g, blocks, o.x, o.y, o.r)) {

  }
  function resolveBallCircle(g, blocks, o) {
    if (!ballCircleBlocked(g, blocks, o.x, o.y, o.r)) return false;
    var hit = false;
    if (tileAtBall(g, o.x + o.r, o.y) || tileAtBall(g, o.x - o.r, o.y) || blockHit(blocks, o.x, o.y, o.r, true)) {
      o.x -= o.vx * DT * 1.1; o.vx *= -1; hit = true;
    }
    if (tileAtBall(g, o.x, o.y + o.r) || tileAtBall(g, o.x, o.y - o.r) || blockHit(blocks, o.x, o.y, o.r, false)) {
      o.y -= o.vy * DT * 1.1; o.vy *= -1; hit = true;
    }

  /* Step-slide so a long Skull Lord dash can not teleport through stone.

  function skullSlide(e, nx, ny) {
    if (!room) { e.x = nx; e.y = ny; return; }
    var dx = nx - e.x, dy = ny - e.y;
    var dist = Math.hypot(dx, dy);

    e.vx = dx; e.vy = dy;

      e.y += dy / n;
      if (circleBlocked(room.grid, room.blocks, e.x, e.y, e.r)) {

  }

  }
  function removeBlockAt(i) {

  }

  }

    return 1;
  }
  /* Hit a placed cube. Returns true if it shattered. Wall tiles are not soft. */
  function hurtBlockAt(i, hits) {

    var b = room.blocks[i];

  /* BB-V7.13 — NBA-style hoop for floor-boss lairs, inspired by the title art:

     top-down shot reads as "up the court." Active for a swish only after the
     floor boss is dead and the ball is back in hand.
     BB-V7.23 — boss rooms imply wallH 3 (high). Seat the backboard on that
     extruded north face so the hoop is not stuck on the floor under a tall
     wall. Same hoop in end-of-floor knight (mini) chambers.

  var HOOP_BOARD_W = 2.2; /* × TILE */
  var HOOP_BOARD_H = 1.35;
  var HOOP_ARM = 0.22; /* × TILE — board bottom → rim center (short brace) */
  function roomWantsHoop(spec) {
    return !!(spec && (spec.kind === "boss" || spec.kind === "mini"));
  }

  function makeBossHoop(spec) {
    var cols = spec.cols || gCols(spec.grid);
    var cx = Math.floor(cols / 2);
    var g = spec.grid, tx, ty;
    var wallH = clampWallH(spec.wallH != null ? spec.wallH : BACK_WALL_H);

    for (ty = 1; ty <= 3; ty++) {

      }

    /* North face spans [TILE - wallH*TILE, TILE]. Mount the board high on that

    var frontTop = TILE - wallH * TILE;
    var boardY = frontTop + TILE * (wallH >= 3 ? 1.0 : 1.15);
    var bh = TILE * HOOP_BOARD_H;
    var rimY = boardY + bh * 0.5 + TILE * HOOP_ARM;
    return {
      x: (cx + 0.5) * TILE,
      y: rimY,
      r: 16,
      boardY: boardY,
      wallH: wallH,
      faceX: 0,
      faceY: -1, /* toward the backboard (north) */

    S.cine = {
      active: true,
      mode: mode,
      t: 0,
      dur: opts.dur != null ? opts.dur : 1,
      zoom: prev && prev.active ? prev.zoom : 1,
      focusX: prev && prev.active ? prev.focusX : (player ? player.x : playW() * 0.5),
      focusY: prev && prev.active ? prev.focusY : (player ? player.y : playH() * 0.5),
      fromZoom: opts.fromZoom != null ? opts.fromZoom : (prev && prev.active ? prev.zoom : 1),
      toZoom: opts.toZoom != null ? opts.toZoom : 1.45,
      fromX: opts.fromX != null ? opts.fromX : (prev && prev.active ? prev.focusX : (player ? player.x : 0)),
      fromY: opts.fromY != null ? opts.fromY : (prev && prev.active ? prev.focusY : (player ? player.y : 0)),
      toX: opts.toX != null ? opts.toX : opts.x,

    if (h.glow > 0) h.glow = Math.max(0, h.glow - dt * 0.7);
  }

    g.strokeStyle = "#1a1a1a";
    g.lineWidth = 3;
    g.strokeRect(bx - bw * 0.22, by - bh * 0.22, bw * 0.44, bh * 0.44);

    g.lineWidth = 2;
